<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchAir" width="5" height="5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#881337" stroke-width="0.8" stroke-opacity="0.22"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — VECTORES DE LEHMANN (1902) vs. RESONANCIA AÉREA DEL TRACTO</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Por qué las sensaciones craneofaciales son conducción ósea pasiva y no radiación acústica hacia el teatro</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <line x1="440" y1="90" x2="440" y2="345" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.25" stroke-dasharray="3,3"/>

  <!-- IZQUIERDA: VECTORES DE LEHMANN -->
  <text x="230" y="102" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="700" fill="#1C1B19">I. MAPA SENSORIAL DE LEHMANN</text>
  <g transform="translate(115, 115)">
    <!-- Perfil craneal minimalista estilo grabado -->
    <path d="M 65,205 L 65,165 Q 30,155 25,115 Q 20,45 85,25 Q 155,15 170,75 L 188,108 L 168,118 L 172,145 L 145,155 L 140,205" fill="none" stroke="#1C1B19" stroke-width="1.3"/>
    <!-- Senos / puntos sensoriales -->
    <circle cx="152" cy="72" r="5" fill="none" stroke="#1C1B19" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="105" cy="36" r="5" fill="none" stroke="#1C1B19" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Arco curvo de Lehmann (punteado) -->
    <path d="M 110,160 Q 152,110 152,72 Q 140,42 105,36" fill="none" stroke="#1C1B19" stroke-width="1.6" stroke-dasharray="4,3"/>
    <circle cx="105" cy="36" r="3" fill="#1C1B19"/>
    <!-- Leader lines -->
    <line x1="157" y1="70" x2="205" y2="56" stroke="#1C1B19" stroke-width="0.8"/>
    <text x="210" y="54" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#1C1B19">Seno frontal / nariz</text>
    <text x="210" y="67" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">Impedancia ósea ~4.000×</text>

    <line x1="100" y1="36" x2="45" y2="24" stroke="#1C1B19" stroke-width="0.8"/>
    <text x="40" y="22" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#1C1B19">Coronilla</text>
    <text x="40" y="34" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">Metáfora propioceptiva</text>
  </g>

  <!-- DERECHA: ACÚSTICA REAL -->
  <text x="655" y="102" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="700" fill="#881337">II. RESONADOR AÉREO REAL (SUNDBERG)</text>
  <g transform="translate(540, 115)">
    <path d="M 65,205 L 65,165 Q 30,155 25,115 Q 20,45 85,25 Q 155,15 170,75 L 188,108 L 168,118 L 172,145 L 145,155 L 140,205" fill="none" stroke="#1C1B19" stroke-width="1.3"/>
    <!-- Columna de aire real en faringe y boca -->
    <path d="M 96,195 L 96,122 Q 120,108 168,125 L 168,136 Q 125,126 112,140 L 112,195 Z" fill="url(#hatchAir)" stroke="#881337" stroke-width="1.4"/>
    <!-- Ondas irradiadas al exterior por los labios -->
    <path d="M 184,116 Q 194,130 184,144 M 194,110 Q 207,130 194,150" fill="none" stroke="#881337" stroke-width="1.4"/>
    <!-- Leader lines -->
    <line x1="198" y1="130" x2="225" y2="115" stroke="#881337" stroke-width="0.9"/>
    <text x="228" y="114" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="700" fill="#881337">Radiación 99.9%</text>
    <text x="228" y="127" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">Exclusivamente aérea</text>

    <line x1="96" y1="168" x2="48" y2="178" stroke="#881337" stroke-width="0.8"/>
    <text x="44" y="176" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#881337">Tubo faríngeo</text>
    <text x="44" y="189" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">Único resonador activo</text>
  </g>

  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura física:</tspan> El zumbido en pómulos y frente es conducción ósea pasiva inducida por la presión interna del tracto (burdeos);
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    los senos paranasales actúan como trampas absorbentes y toda la energía radiada sale por la abertura labial.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · LÁMINA DE PROPIOCEPCIÓN Y ACÚSTICA (LEHMANN 1902 · VENNARD 1967 · SUNDBERG 1987)</text>
</svg>
