<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="890" height="36" rx="6" fill="#0f172a"/>
  <text x="460" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">EL MITO DEL VERISMO: ¿DESTRUYE LAS VOCES EL REPERTORIO O LA MALA TÉCNICA?</text>

  <!-- PANEL A: CANTO DE FUERZA -->
  <rect x="15" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="16" y="57" width="433" height="32" rx="7" fill="#fef2f2"/>
  <text x="232" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">A) El Vicio del "Canto de Fuerza" (Falsa Dramaticidad)</text>

  <g transform="translate(28, 102)">
    <rect x="0" y="0" width="160" height="118" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="80" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Sobrecarga Glótica</text>
    <rect x="35" y="40" width="90" height="14" rx="3" fill="#dc2626"/>
    <path d="M 80 72 L 80 56 M 74 62 L 80 56 L 86 62" stroke="#991b1b" stroke-width="2" fill="none"/>
    <text x="80" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">Empuje Brutal</text>
    <text x="80" y="103" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#7f1d1d">Sin cobertura ni squillo</text>

    <rect x="172" y="0" width="236" height="118" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="184" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Factores de Desgaste:</text>
    <text x="184" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Pecho subido sin transición al pasaje</text>
    <text x="184" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Grito abierto sobre orquesta densa</text>
    <text x="184" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Uso de llantos/sollozos con golpe glótico</text>
    <text x="184" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Oscurecimiento artificial del centro</text>
    <text x="184" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#b91c1c">• Edema, wobble precoz y pérdida de agudos</text>
  </g>

  <g transform="translate(28, 232)">
    <rect x="0" y="0" width="408" height="180" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="204" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">El Malentendido sobre Puccini y Mascagni</text>
    <text x="204" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">
      <tspan x="204" dy="0">"Confundir la intensidad dramática del verismo</tspan>
      <tspan x="204" dy="16">con la violencia muscular destruye el instrumento</tspan>
      <tspan x="204" dy="16">antes de alcanzar la madurez artística."</tspan>
    </text>
    <line x1="35" y1="94" x2="373" y2="94" stroke="#fecaca" stroke-width="1"/>
    <text x="204" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">
      <tspan x="204" dy="0">Error de Proyección:</tspan>
      <tspan x="204" dy="14" font-weight="700" fill="#b91c1c">Buscar volumen en la garganta en lugar del tracto</tspan>
    </text>
    <text x="204" y="154" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#991b1b">
      <tspan x="204" dy="0">Resultado Clínico</tspan>
      <tspan x="204" dy="14" font-weight="500" fill="#7f1d1d">Acortamiento severo de la carrera lírica (5–8 años)</tspan>
    </text>
  </g>

  <!-- PANEL B: VERISMO CON TÉCNICA BELCANTISTA -->
  <rect x="470" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
  <rect x="471" y="57" width="433" height="32" rx="7" fill="#f0f9ff"/>
  <text x="687" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0369a1">B) Verismo Cantado con Técnica Tradicional</text>

  <g transform="translate(483, 102)">
    <rect x="0" y="0" width="160" height="118" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="80" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Proyección Inteligente</text>
    <path d="M 28 68 Q 70 62 110 34 L 134 65" stroke="#0284c7" stroke-width="2.5" fill="none"/>
    <circle cx="110" cy="34" r="4" fill="#0284c7"/>
    <text x="80" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">Squillo 3 kHz</text>
    <text x="80" y="103" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#0c4a6e">Atraviesa el tutti</text>

    <rect x="172" y="0" width="236" height="118" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="184" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Claves de Longevidad:</text>
    <text x="184" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Legato impecable heredado del Bel Canto</text>
    <text x="184" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Cobertura precisa y chiaroscuro intacto</text>
    <text x="184" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Appoggio elástico sin rigidez glótica</text>
    <text x="184" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Acento teatral resuelto en la dicción</text>
    <text x="184" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0369a1">• Referentes: Caruso, Gigli, Ponselle</text>
  </g>

  <g transform="translate(483, 232)">
    <rect x="0" y="0" width="408" height="180" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="204" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0369a1">Testimonio de Rodolfo Celletti</text>
    <text x="204" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#0c4a6e">
      <tspan x="204" dy="0">"Los grandes intérpretes del verismo triunfaron</tspan>
      <tspan x="204" dy="16">porque aplicaron la disciplina de la respiración</tspan>
      <tspan x="204" dy="16">y el pasaje belcantista a la nueva dramaturgia."</tspan>
    </text>
    <line x1="35" y1="94" x2="373" y2="94" stroke="#bae6fd" stroke-width="1"/>
    <text x="204" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">
      <tspan x="204" dy="0">Realidad Histórica:</tspan>
      <tspan x="204" dy="14" font-weight="700" fill="#0369a1">Puccini exige lirismo, legato y medias voces reales</tspan>
    </text>
    <text x="204" y="154" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0284c7">
      <tspan x="204" dy="0">Conclusión Técnica</tspan>
      <tspan x="204" dy="14" font-weight="500" fill="#0c4a6e">No es el repertorio lo que enferma la voz, sino la falta de escuela</tspan>
    </text>
  </g>
</svg>
