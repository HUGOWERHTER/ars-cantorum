<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchVerismo" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.9" stroke-opacity="0.22"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — LONGEVIDAD VOCAL EN EL VERISMO: TÉCNICA BELCANTISTA vs. CANTO DE FUERZA</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Trayectoria comparada de estabilidad fonatoria a lo largo de la carrera lírica (Celletti · Fucito)</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- Grilla -->
  <g stroke="#1C1B19" stroke-opacity="0.12" stroke-width="0.8">
    <line x1="95" y1="130" x2="815" y2="130" stroke-dasharray="2,3"/>
    <line x1="95" y1="190" x2="815" y2="190" stroke-dasharray="2,3"/>
    <line x1="95" y1="250" x2="815" y2="250" stroke-dasharray="2,3"/>
    <line x1="275" y1="100" x2="275" y2="305" stroke-dasharray="2,3"/>
    <line x1="455" y1="100" x2="455" y2="305" stroke-dasharray="2,3"/>
    <line x1="635" y1="100" x2="635" y2="305" stroke-dasharray="2,3"/>
  </g>

  <line x1="95" y1="100" x2="95" y2="305" stroke="#1C1B19" stroke-width="1.2"/>
  <line x1="95" y1="305" x2="820" y2="305" stroke="#1C1B19" stroke-width="1.2"/>

  <text x="83" y="134" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Óptimo</text>
  <text x="83" y="194" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Fatiga</text>
  <text x="83" y="254" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Lesión</text>
  <text x="34" y="202" text-anchor="middle" transform="rotate(-90 34 202)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#57534E" letter-spacing="0.06em">INTEGRIDAD CORDO-ACÚSTICA</text>

  <text x="95" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Año 0</text>
  <text x="275" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">10 años</text>
  <text x="455" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">20 años</text>
  <text x="635" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">30 años</text>
  <text x="810" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">40 años</text>

  <!-- Área bajo curva burdeos -->
  <path d="M 95,142 C 250,124 460,122 650,132 C 720,136 775,146 805,158 L 805,305 L 95,305 Z" fill="url(#hatchVerismo)"/>
  <!-- Curva 1: Verismo con técnica belcantista (Caruso, Gigli, Ponselle) -->
  <path d="M 95,142 C 250,124 460,122 650,132 C 720,136 775,146 805,158" fill="none" stroke="#881337" stroke-width="2.2"/>
  <circle cx="455" cy="126" r="3.5" fill="#881337"/>

  <!-- Curva 2: Pseudoverismo / Canto de fuerza (colapso 6-10 años) -->
  <path d="M 95,142 C 155,148 205,175 250,232 C 275,266 305,288 335,295" fill="none" stroke="#1C1B19" stroke-width="1.6" stroke-dasharray="5,4"/>
  <circle cx="250" cy="232" r="3.5" fill="#FAF8F5" stroke="#1C1B19" stroke-width="1.5"/>

  <!-- Anotaciones directas -->
  <line x1="455" y1="126" x2="480" y2="100" stroke="#881337" stroke-width="0.9"/>
  <text x="486" y="100" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="700" fill="#881337">Verismo con escuela italiana</text>
  <text x="486" y="114" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Appoggio + squillo 3 kHz (Gigli, Ponselle, Warren)</text>

  <line x1="250" y1="232" x2="310" y2="212" stroke="#1C1B19" stroke-width="0.9"/>
  <text x="316" y="210" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="600" fill="#1C1B19">Pseudoverismo (5–10 años)</text>
  <text x="316" y="224" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Pecho subido + sollozo glótico · Edema y wobble</text>

  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura histórica:</tspan> Las partituras de Puccini o Mascagni no acortan por sí mismas la carrera vocal; el desgaste prematuro
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    (curva punteada) aparece cuando se sustituye la proyección formántica del Bel Canto por fuerza subglótica bruta.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · ANÁLISIS HISTÓRICO DE LONGEVIDAD VOCAL (CELLETTI · HINES)</text>
</svg>
