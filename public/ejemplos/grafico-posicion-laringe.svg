<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <!-- Barra de Título -->
  <rect x="10" y="8" width="880" height="36" rx="6" fill="#0f172a"/>
  <text x="450" y="31" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">BIOMECÁNICA DE LA ALTURA LARÍNGEA: COMPARATIVA DE POSTURAS</text>

  <!-- ==================== PANEL 1: LARINGE ELEVADA ==================== -->
  <rect x="15" y="54" width="275" height="240" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="16" y="55" width="273" height="32" rx="7" fill="#fffbeb"/>
  <text x="152" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b45309">1. Laringe Hiper-Elevada</text>

  <!-- Ilustración Tracto Corto -->
  <g transform="translate(40, 95)">
    <!-- Columna Faringea Corta -->
    <path d="M 50 10 L 50 45 Q 60 50 75 50 Q 90 50 100 45 L 100 10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <!-- Laringe muy alta -->
    <rect x="60" y="45" width="30" height="25" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <text x="75" y="62" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#78350f">Laringe</text>
    <!-- Flechas hacia arriba -->
    <path d="M 45 60 L 45 35 M 42 42 L 45 35 L 48 42" stroke="#b45309" stroke-width="1.8" fill="none"/>
    <path d="M 105 60 L 105 35 M 102 42 L 105 35 L 108 42" stroke="#b45309" stroke-width="1.8" fill="none"/>
    <text x="145" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Tracto vocal acortado</text>
    <text x="145" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Faringe colapsada</text>
    <text x="145" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Tensión constrictora</text>
  </g>

  <!-- Píldora Resultado 1 -->
  <rect x="25" y="185" width="255" height="95" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="152" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#92400e">Timbre Blanco y Estridente</text>
  <text x="152" y="223" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#78350f">Voce bianca / Canto infantile</text>
  <text x="152" y="243" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">Primer formante (F1) excesivamente alto</text>
  <text x="152" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">Incapaz de proyectar en salas grandes</text>

  <!-- ==================== PANEL 2: DEPRESIÓN FORZADA (TIEFSTELLUNG) ==================== -->
  <rect x="305" y="54" width="285" height="240" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
  <rect x="306" y="55" width="283" height="32" rx="7" fill="#fef2f2"/>
  <text x="448" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">2. Depresión Forzada (Tiefstellung)</text>

  <!-- Ilustración Laringe Hundida -->
  <g transform="translate(330, 95)">
    <!-- Lengua deprimiendo hacia abajo -->
    <path d="M 40 10 Q 55 45 75 45 Q 95 45 110 10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="75" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#991b1b">Base Lingual</text>
    <!-- Laringe empujada artificialmente abajo -->
    <rect x="60" y="55" width="30" height="25" rx="4" fill="#f87171" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="75" y="72" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Laringe</text>
    <!-- Flechas empuje hacia abajo -->
    <path d="M 75 40 L 75 52 M 71 46 L 75 52 L 79 46" stroke="#b91c1c" stroke-width="2" fill="none"/>
    <text x="145" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Lengua empuja hioides</text>
    <text x="145" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Rigidez infrahioidea</text>
    <text x="145" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Oclusión de epiglotis</text>
  </g>

  <!-- Píldora Resultado 2 -->
  <rect x="315" y="185" width="265" height="95" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="448" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">Sonido Entubado y Cavernoso</text>
  <text x="448" y="223" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">Voce ingolata / Knödel alemán</text>
  <text x="448" y="243" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">Pérdida del formante del cantante (brillo)</text>
  <text x="448" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">Vocales distorsionadas y fatiga rápida</text>

  <!-- ==================== PANEL 3: LARINGE FLOTANTE ITALIANA ==================== -->
  <rect x="605" y="54" width="280" height="240" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="606" y="55" width="278" height="32" rx="7" fill="#f0fdf4"/>
  <text x="745" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#15803d">3. Laringe Flotante (Bel Canto)</text>

  <!-- Ilustración Laringe Flotante -->
  <g transform="translate(630, 95)">
    <!-- Faringe abierta y relajada -->
    <path d="M 45 10 L 45 40 Q 60 48 75 48 Q 90 48 105 40 L 105 10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <!-- Laringe naturalmente suspendida -->
    <rect x="60" y="45" width="30" height="25" rx="4" fill="#4ade80" stroke="#15803d" stroke-width="1.5"/>
    <text x="75" y="62" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#064e3b">Laringe</text>
    <text x="140" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Descenso por inhalación</text>
    <text x="140" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Tracción traqueal suave</text>
    <text x="140" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Mandíbula y lengua libres</text>
  </g>

  <!-- Píldora Resultado 3 -->
  <rect x="615" y="185" width="260" height="95" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="745" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803d">El Ideal del Chiaroscuro</text>
  <text x="745" y="223" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#14532d">Gola aperta / Laringe fluttuante</text>
  <text x="745" y="243" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">Equilibrio perfecto entre brillo y profundidad</text>
  <text x="745" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">Agilidad intacta y longevidad vocal</text>
</svg>