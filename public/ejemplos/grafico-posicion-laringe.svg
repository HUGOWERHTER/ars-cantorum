<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" width="100%" height="auto" style="background:#fdfbf7; border:1px solid #dcd6cd; border-radius:4px; padding:6px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); font-family: 'Cinzel', 'Baskerville', 'Georgia', serif;">
  <defs>
    <pattern id="laidPaper_PLANCHE_III" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#f4efe6" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Fondo de papel antiguo verjurado -->
  <rect x="0" y="0" width="1040" height="680" fill="#fdfbf7"/>
  <rect x="0" y="0" width="1040" height="680" fill="url(#laidPaper_PLANCHE_III)"/>

  <!-- Doble marco clásico tipográfico estilo Diderot -->
  <rect x="12" y="12" width="1016" height="656" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="17" y="17" width="1006" height="646" fill="none" stroke="#475569" stroke-width="0.8"/>
  <rect x="21" y="21" width="998" height="638" fill="none" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="6,3"/>

  <!-- Viñetas en las esquinas -->
  <path d="M 23 35 L 35 23 M 23 23 L 35 35" stroke="#475569" stroke-width="0.8"/>
  <path d="M 1017 35 L 1005 23 M 1017 23 L 1005 35" stroke="#475569" stroke-width="0.8"/>
  <path d="M 23 645 L 35 657 M 23 657 L 35 645" stroke="#475569" stroke-width="0.8"/>
  <path d="M 1017 645 L 1005 657 M 1017 657 L 1005 645" stroke="#475569" stroke-width="0.8"/>

  <!-- Encabezado monumental enciclopédico -->
  <text x="520.0" y="44" text-anchor="middle" font-size="11" letter-spacing="0.2em" fill="#64748b" font-weight="600">ENCYCLOPÉDIE ANATOMIQUE ET MUSICOLOGIQUE DU BEL CANTO</text>
  <line x1="180" y1="52" x2="860" y2="52" stroke="#475569" stroke-width="0.8"/>
  <line x1="280" y1="55" x2="760" y2="55" stroke="#94a3b8" stroke-width="0.5"/>

  <text x="520.0" y="76" text-anchor="middle" font-size="15.5" letter-spacing="0.08em" fill="#0f172a" font-weight="700">PLANCHE III. — DE LA HAUTEUR DU LARYNX ET DU CABESTRAN MUSCULAIRE</text>
  <text x="520.0" y="95" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">Tiefstellung germanique contre la laringe flottante de l'école italienne</text>

  <!-- ==================== ÁREA DE ILUSTRACIÓN DEL GRABADO HISTÓRICO ==================== -->
  <g id="illustration">
    <!-- Marco del grabado -->
    <rect x="35" y="110" width="360" height="490" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
    <rect x="39" y="114" width="352" height="482" fill="none" stroke="#cbd5e1" stroke-width="0.6"/>

    <!-- Imagen calcográfica auténtica -->
    <image href="/ejemplos/grabado-laringe-musculos.png" x="45" y="120" width="340" height="470" preserveAspectRatio="xMidYMid meet"/>

    <!-- Rótulo de figura histórica -->
    <text x="215.0" y="613" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.05em" fill="#334155">FIG. 1. — DÉTAIL ANATOMIQUE AU BURIN</text>

    <!-- Línea de llamada A -->
    <line x1="180" y1="210" x2="65" y2="180" stroke="#0f172a" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="180" cy="210" r="3" fill="#0f172a"/>
    <circle cx="65" cy="180" r="9" fill="#fdfbf7" stroke="#0f172a" stroke-width="1.2"/>
    <text x="65" y="183.5" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">A</text>

    <!-- Línea de llamada B -->
    <line x1="230" y1="320" x2="65" y2="310" stroke="#0f172a" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="230" cy="320" r="3" fill="#0f172a"/>
    <circle cx="65" cy="310" r="9" fill="#fdfbf7" stroke="#0f172a" stroke-width="1.2"/>
    <text x="65" y="313.5" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">B</text>

    <!-- Línea de llamada C -->
    <line x1="180" y1="430" x2="65" y2="430" stroke="#0f172a" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="180" cy="430" r="3" fill="#0f172a"/>
    <circle cx="65" cy="430" r="9" fill="#fdfbf7" stroke="#0f172a" stroke-width="1.2"/>
    <text x="65" y="433.5" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">C</text>
  </g>

  <!-- ==================== COLUMNA DEDICADA DE LEYENDA CLÁSICA ==================== -->
  <g transform="translate(420, 110)">
    <!-- Marco de leyenda -->
    <rect x="0" y="0" width="590" height="508" fill="#fcfbfa" stroke="#475569" stroke-width="1"/>
    <rect x="4" y="4" width="582" height="500" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>

    <!-- Título de la leyenda -->
    <text x="295.0" y="24" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="0.08em" fill="#0f172a">EXPLICATION DES FIGURES &amp; ANATOMIE</text>
    <line x1="20" y1="32" x2="570" y2="32" stroke="#64748b" stroke-width="0.8"/>

    <!-- Ítem A -->
    <circle cx="18" cy="46" r="8" fill="#0f172a"/>
    <text x="18" y="50" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">A</text>
    <text x="32" y="50" font-size="10.5" font-weight="700" fill="#0f172a">La Escuela Italiana: Laringe Flotante y Suspensión Neutra</text>
    <text x="32" y="66" font-size="9.5" fill="#334155">La laringe reposa en su nivel fisiológico de reposo elástico.</text>
    <text x="32" y="80" font-size="9.5" fill="#334155">La musculatura supra e infrahioidea trabaja en balance agonista-antagonista</text>
    <text x="32" y="94" font-size="9.5" fill="#334155">sin forzar descensos articulares que rigoricen la basculación tiroidea.</text>

    <!-- Ítem B -->
    <circle cx="18" cy="110" r="8" fill="#0f172a"/>
    <text x="18" y="114" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">B</text>
    <text x="32" y="114" font-size="10.5" font-weight="700" fill="#0f172a">La Escuela Alemana del Siglo XIX: Tiefstellung (Hundimiento Forzado)</text>
    <text x="32" y="130" font-size="9.5" fill="#334155">Técnica que exige deprimir la laringe al máximo tirando del esternotiroideo.</text>
    <text x="32" y="144" font-size="9.5" fill="#334155">Elongación artificial del tracto que oscurece el timbre pero devora el squillo y la agilidad.</text>

    <!-- Ítem C -->
    <circle cx="18" cy="160" r="8" fill="#0f172a"/>
    <text x="18" y="164" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">C</text>
    <text x="32" y="164" font-size="10.5" font-weight="700" fill="#0f172a">Consecuencias Patológicas de la Depresión Forzada</text>
    <text x="32" y="180" font-size="9.5" fill="#334155">Produce 'vocal wobble' (vibrato lento y pesado), fatiga de la lengua</text>
    <text x="32" y="194" font-size="9.5" fill="#334155">y parálisis funcional en el passaggio por hiperpresión sobre el cricoides.</text>

    <!-- Ítem D -->
    <circle cx="18" cy="210" r="8" fill="#0f172a"/>
    <text x="18" y="214" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">D</text>
    <text x="32" y="214" font-size="10.5" font-weight="700" fill="#0f172a">El Dictamen de Manuel García II y Richard Miller</text>
    <text x="32" y="230" font-size="9.5" fill="#334155">La laringe desciende ligeramente con la inspiración diafragmática profunda,</text>
    <text x="32" y="244" font-size="9.5" fill="#334155">pero jamás debe ser empujada deliberadamente por la raíz lingual.</text>
  </g>

  <!-- Pie de imprenta de la lámina -->
  <line x1="30" y1="642" x2="1010" y2="642" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="35" y="656" font-size="9" font-style="italic" fill="#64748b">Ars Cantorum Archivo Histórico • Diderot, Bourgery &amp; Gray calcographie</text>
  <text x="1005" y="656" text-anchor="end" font-size="9" letter-spacing="0.05em" fill="#64748b">EXEMPLAIRE ACADÉMIQUE DE RÉFÉRENCE</text>
</svg>