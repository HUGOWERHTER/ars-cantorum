<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Altura vertical de la laringe: hiper-elevación, laringe flotante por tracción traqueal y Tiefstellung forzado">
  <defs>
    <style>
      .title { font-family: 'Cinzel', Georgia, serif; font-size: 19px; font-weight: 700; fill: #1C1B19; letter-spacing: 0.6px; }
      .subtitle { font-family: 'Newsreader', Georgia, serif; font-size: 13px; font-style: italic; fill: #1C1B19; opacity: 0.78; }
      .plate-num { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.8px; fill: #881337; text-transform: uppercase; }
      .sec-head { font-family: 'Cinzel', Georgia, serif; font-size: 13px; font-weight: 700; fill: #1C1B19; letter-spacing: 0.4px; }
      .sec-head-acc { font-family: 'Cinzel', Georgia, serif; font-size: 13px; font-weight: 700; fill: #881337; letter-spacing: 0.4px; }
      .lbl { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; fill: #1C1B19; }
      .lbl-b { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; font-weight: 700; fill: #1C1B19; }
      .lbl-acc { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; font-weight: 700; fill: #881337; }
      .lbl-sm { font-family: 'Newsreader', Georgia, serif; font-size: 11px; fill: #1C1B19; opacity: 0.85; }
      .mag { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 600; fill: #1C1B19; }
      .mag-acc { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 700; fill: #881337; }
      .mag-muted { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9.5px; fill: #1C1B19; opacity: 0.65; }
      .caption { font-family: 'Newsreader', Georgia, serif; font-size: 11.5px; fill: #1C1B19; opacity: 0.86; }
      .caption-b { font-family: 'Newsreader', Georgia, serif; font-size: 11.5px; font-weight: 700; fill: #1C1B19; }
      .hair { stroke: #1C1B19; stroke-width: 1; fill: none; }
      .hair-light { stroke: #1C1B19; stroke-width: 0.7; stroke-opacity: 0.35; fill: none; }
      .hair-dash { stroke: #1C1B19; stroke-width: 1.1; stroke-dasharray: 4 3; fill: none; }
      .ink-line { stroke: #1C1B19; stroke-width: 1.4; fill: none; }
      .acc-line { stroke: #881337; stroke-width: 1.8; fill: none; }
      .acc-dash { stroke: #881337; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
      .leader { stroke: #1C1B19; stroke-width: 0.85; stroke-opacity: 0.65; fill: none; }
    </style>
    <pattern id="hatch-ink" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.22"/>
    </pattern>
    <pattern id="hatch-acc" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.8" stroke-opacity="0.24"/>
    </pattern>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#1C1B19"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#881337"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#FAF8F5"/>
  <rect x="12" y="12" width="856" height="476" fill="none" stroke="#DCD6CD" stroke-width="1"/>
  <text x="36" y="42" class="plate-num">LÁMINA XXV · SUSPENSIÓN LARÍNGEA</text>
  <text x="36" y="66" class="title">Cabestrillo Laríngeo: Laringe Flotante vs. Tiefstellung</text>
  <text x="36" y="85" class="subtitle">Tracción traqueal pasiva (Bel Canto) frente a la compresión lingual descendente (Knödel)</text>
  <line x1="36" y1="98" x2="844" y2="98" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Column 1: High Larynx -->
  <g transform="translate(36, 118)">
    <rect x="0" y="0" width="256" height="320" fill="none" stroke="#DCD6CD" stroke-width="0.9"/>
    <text x="128" y="24" text-anchor="middle" class="sec-head">1. LARINGE HIPER-ELEVADA</text>
    <text x="128" y="41" text-anchor="middle" class="lbl-sm">(Predominio suprahioideo)</text>
    <!-- Reference neutral dashed line -->
    <line x1="40" y1="150" x2="216" y2="150" class="hair-light"/>
    <!-- Upward suprahyoid pull arrows -->
    <line x1="128" y1="108" x2="128" y2="74" class="ink-line" marker-end="url(#arr-ink)"/>
    <!-- Larynx box high -->
    <rect x="92" y="108" width="72" height="30" fill="url(#hatch-ink)" stroke="#1C1B19" stroke-width="1.3"/>
    <text x="128" y="127" text-anchor="middle" class="mag">Laringe alta</text>
    <!-- Trachea -->
    <line x1="112" y1="138" x2="112" y2="215" class="ink-line"/>
    <line x1="144" y1="138" x2="144" y2="215" class="ink-line"/>
    <text x="128" y="246" text-anchor="middle" class="lbl-b">Tubo acústico acortado</text>
    <text x="128" y="268" text-anchor="middle" class="lbl-sm">Faringe estrecha y tensa.</text>
    <text x="128" y="286" text-anchor="middle" class="lbl-sm">Timbre blanco, chillón y</text>
    <text x="128" y="302" text-anchor="middle" class="lbl-sm">carente de polo scuro.</text>
  </g>

  <!-- Column 2: Floating Larynx (Highlighted) -->
  <g transform="translate(312, 118)">
    <rect x="0" y="0" width="256" height="320" fill="none" stroke="#881337" stroke-width="1.4"/>
    <rect x="0" y="0" width="256" height="50" fill="url(#hatch-acc)"/>
    <text x="128" y="24" text-anchor="middle" class="sec-head-acc">2. LARINGE FLOTANTE</text>
    <text x="128" y="41" text-anchor="middle" class="lbl-acc">(Tracción traqueal · Bel Canto)</text>
    <!-- Epiglottis upright & free -->
    <path d="M 116,125 Q 128,104 140,125" class="acc-line"/>
    <text x="128" y="96" text-anchor="middle" class="mag-acc">Epilaringe 1:6 libre</text>
    <!-- Larynx box floating low (-1 to -1.5 cm) -->
    <rect x="92" y="136" width="72" height="32" fill="url(#hatch-acc)" stroke="#881337" stroke-width="1.5"/>
    <text x="128" y="156" text-anchor="middle" class="mag-acc">Neutra baja</text>
    <!-- Trachea + gentle downward tracheal tug -->
    <line x1="112" y1="168" x2="112" y2="206" class="acc-line"/>
    <line x1="144" y1="168" x2="144" y2="206" class="acc-line"/>
    <line x1="128" y1="176" x2="128" y2="220" class="acc-line" marker-end="url(#arr-acc)"/>
    <text x="128" y="246" text-anchor="middle" class="lbl-acc">Descenso pasivo (-1 a 1.5 cm)</text>
    <text x="128" y="268" text-anchor="middle" class="lbl-sm">Basculación CT libre y</text>
    <text x="128" y="286" text-anchor="middle" class="lbl-sm">raíz lingual relajada.</text>
    <text x="128" y="302" text-anchor="middle" class="lbl-acc">Chiaroscuro canónico.</text>
  </g>

  <!-- Column 3: Tiefstellung -->
  <g transform="translate(588, 118)">
    <rect x="0" y="0" width="256" height="320" fill="none" stroke="#DCD6CD" stroke-width="0.9"/>
    <text x="128" y="24" text-anchor="middle" class="sec-head">3. TIEFSTELLUNG FORZADO</text>
    <text x="128" y="41" text-anchor="middle" class="lbl-sm">(Depresión lingual activa)</text>
    <!-- Heavy tongue root pushing down -->
    <path d="M 86,88 Q 128,118 170,88" stroke="#1C1B19" stroke-width="2" fill="url(#hatch-ink)"/>
    <line x1="128" y1="98" x2="128" y2="146" class="ink-line" marker-end="url(#arr-ink)"/>
    <text x="128" y="80" text-anchor="middle" class="mag-muted">Raíz lingual (hiogloso) ↓</text>
    <!-- Depressed locked larynx -->
    <rect x="92" y="158" width="72" height="32" fill="url(#hatch-ink)" stroke="#1C1B19" stroke-width="1.3"/>
    <text x="128" y="178" text-anchor="middle" class="mag">Fijada abajo</text>
    <line x1="112" y1="190" x2="112" y2="218" class="ink-line"/>
    <line x1="144" y1="190" x2="144" y2="218" class="ink-line"/>
    <text x="128" y="246" text-anchor="middle" class="lbl-b">Epiglotis aplastada (Knödel)</text>
    <text x="128" y="268" text-anchor="middle" class="lbl-sm">Bloqueo cricotiroideo y</text>
    <text x="128" y="286" text-anchor="middle" class="lbl-sm">extinción del squillo.</text>
    <text x="128" y="302" text-anchor="middle" class="lbl-sm">Timbre oscuro sin proyección.</text>
  </g>

  <line x1="36" y1="456" x2="844" y2="456" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="474" class="caption-b">Lectura anatómica:</text>
  <text x="164" y="474" class="caption">La inhalación costo-diafragmática desciende la laringe por tracción traqueal sin comprimir el vestíbulo epilaríngeo (Titze; Miller).</text>
</svg>