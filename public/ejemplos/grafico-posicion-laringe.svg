<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="910" height="36" rx="6" fill="#0f172a"/>
  <text x="470" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">BIOMECÁNICA DE LA ALTURA LARÍNGEA: COMPARATIVA DE POSTURAS</text>

  <!-- PANEL 1: LARINGE ALTA -->
  <rect x="15" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/>
  <rect x="16" y="57" width="288" height="32" rx="7" fill="#fffbeb"/>
  <text x="160" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#b45309">1. Laringe Hiper-Elevada</text>

  <g transform="translate(25, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <path d="M 40 10 L 40 45 Q 50 50 65 50 Q 80 50 90 45 L 90 10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="50" y="45" width="30" height="25" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <text x="65" y="62" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#78350f">Laringe</text>
    <path d="M 35 60 L 35 35 M 32 42 L 35 35 L 38 42" stroke="#b45309" stroke-width="1.8" fill="none"/>
    <text x="110" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Tracto vocal muy acortado</text>
    <text x="110" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Faringe colapsada por dentro</text>
    <text x="110" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Tensión constrictora superior</text>
    <text x="110" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Subida refleja en el agudo</text>
    <text x="110" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#b45309">• Timbre blanco e infantil</text>
  </g>

  <g transform="translate(25, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#fffbeb" stroke="#fef3c7"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#92400e">Timbre Blanco y Estridente</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#78350f">
      <tspan x="135" dy="0">Voce bianca / Canto infantile:</tspan>
      <tspan x="135" dy="16">sin profundidad ni armónicos graves,</tspan>
      <tspan x="135" dy="16">el sonido carece de nobleza.</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#fde68a" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#78350f">
      <tspan x="135" dy="0" font-weight="700" fill="#b45309">Limitaciones Acústicas:</tspan>
      <tspan x="135" dy="15">• F1 excesivamente alto</tspan>
      <tspan x="135" dy="15">• Cero penetración en sala grande</tspan>
      <tspan x="135" dy="15">• Tensión laríngea acumulada</tspan>
    </text>
  </g>

  <!-- PANEL 2: DEPRESION FORZADA -->
  <rect x="325" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.3"/>
  <rect x="326" y="57" width="288" height="32" rx="7" fill="#fef2f2"/>
  <text x="470" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#b91c1c">2. Depresión Forzada (Tiefstellung)</text>

  <g transform="translate(335, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <path d="M 30 10 Q 45 45 65 45 Q 85 45 100 10" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="65" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#991b1b">Base Lingual</text>
    <rect x="50" y="55" width="30" height="25" rx="4" fill="#f87171" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="65" y="72" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#ffffff">Laringe</text>
    <path d="M 65 40 L 65 52 M 61 46 L 65 52 L 69 46" stroke="#b91c1c" stroke-width="2" fill="none"/>
    <text x="110" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Lengua empuja el hioides</text>
    <text x="110" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Rigidez infrahioidea severa</text>
    <text x="110" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Oclusión de la epiglotis</text>
    <text x="110" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Fijación rígida anti-fisiológica</text>
    <text x="110" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#b91c1c">• Sonido oscuro y entubado</text>
  </g>

  <g transform="translate(335, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">Sonido Entubado y Cavernoso</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">
      <tspan x="135" dy="0">Voce ingolata / Knödel alemán:</tspan>
      <tspan x="135" dy="16">la laringe atrapada hacia abajo</tspan>
      <tspan x="135" dy="16">destruye el brillo natural.</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#fecaca" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">
      <tspan x="135" dy="0" font-weight="700" fill="#b91c1c">Patología Funcional:</tspan>
      <tspan x="135" dy="15">• Pérdida total del squillo agudo</tspan>
      <tspan x="135" dy="15">• Vocales distorsionadas</tspan>
      <tspan x="135" dy="15">• Fatiga muscular precoz</tspan>
    </text>
  </g>

  <!-- PANEL 3: LARINGE FLOTANTE -->
  <rect x="635" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="636" y="57" width="288" height="32" rx="7" fill="#f0fdf4"/>
  <text x="780" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#15803d">3. Laringe Flotante (Bel Canto)</text>

  <g transform="translate(645, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <path d="M 35 10 L 35 40 Q 50 48 65 48 Q 80 48 95 40 L 95 10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect x="50" y="45" width="30" height="25" rx="4" fill="#4ade80" stroke="#15803d" stroke-width="1.5"/>
    <text x="65" y="62" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#064e3b">Laringe</text>
    <text x="110" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Descenso pasivo por inhalación</text>
    <text x="110" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Tracción traqueal suave</text>
    <text x="110" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Mandíbula y lengua elásticas</text>
    <text x="110" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Basculación tiroidea libre</text>
    <text x="110" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#15803d">• Equilibrio de chiaroscuro</text>
  </g>

  <g transform="translate(645, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#f0fdf4" stroke="#dcfce7"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803d">El Ideal del Bel Canto</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#14532d">
      <tspan x="135" dy="0">Gola aperta / Laringe fluttuante:</tspan>
      <tspan x="135" dy="16">libertad neuromuscular plena</tspan>
      <tspan x="135" dy="16">en todo el registro vocal.</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#bbf7d0" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">
      <tspan x="135" dy="0" font-weight="700" fill="#15803d">Virtudes Acústicas:</tspan>
      <tspan x="135" dy="15">• Fusión de squillo y profundidad</tspan>
      <tspan x="135" dy="15">• Agilidad y flexibilidad intactas</tspan>
      <tspan x="135" dy="15" font-weight="600" fill="#166534">• Emisión libre sin presiones</tspan>
    </text>
  </g>
</svg>