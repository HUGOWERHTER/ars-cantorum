<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchReg" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.9" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — EVOLUCIÓN HISTÓRICA DE LOS REGISTROS: DE TOSI A HIRANO Y TITZE</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Cómo una misma escala vocal fue dividida en 2, 3, 7 subregistros o 4 mecanismos laríngeos + acoplamiento formántico</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- LÍNEA DE TIEMPO EDITORIAL -->
  <line x1="60" y1="112" x2="820" y2="112" stroke="#1C1B19" stroke-width="1.2"/>
  <circle cx="145" cy="112" r="4" fill="#1C1B19"/>
  <circle cx="345" cy="112" r="4" fill="#1C1B19"/>
  <circle cx="545" cy="112" r="4" fill="#1C1B19"/>
  <circle cx="745" cy="112" r="4.5" fill="#881337"/>

  <text x="145" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#1C1B19">1723 · 1774</text>
  <text x="345" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#1C1B19">1841 · 1854</text>
  <text x="545" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#1C1B19">1883</text>
  <text x="745" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#881337">SIGLOS XX–XXI</text>

  <!-- 4 COLUMNAS LIMPIAS SIN BORDES PESADOS -->
  <g stroke="#1C1B19" stroke-opacity="0.2" stroke-width="0.8">
    <line x1="245" y1="126" x2="245" y2="340" stroke-dasharray="2,3"/>
    <line x1="445" y1="126" x2="445" y2="340" stroke-dasharray="2,3"/>
    <line x1="645" y1="126" x2="645" y2="340" stroke-dasharray="2,3"/>
  </g>

  <!-- Col 1: Tosi / Mancini -->
  <text x="145" y="142" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11.5" font-weight="700" fill="#1C1B19">TOSI y MANCINI</text>
  <text x="145" y="158" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#881337">2 REGISTROS</text>
  <rect x="75" y="176" width="140" height="58" fill="none" stroke="#1C1B19" stroke-width="1"/>
  <line x1="75" y1="205" x2="215" y2="205" stroke="#1C1B19" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="145" y="194" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11" fill="#1C1B19">Voce di Testa</text>
  <text x="145" y="224" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11" fill="#1C1B19">Voce di Petto</text>
  <text x="145" y="262" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11" fill="#57534E">Ideal: unione delle voci</text>
  <text x="145" y="278" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">mediante mezza voce</text>

  <!-- Col 2: Manuel García II -->
  <text x="345" y="142" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11.5" font-weight="700" fill="#1C1B19">MANUEL GARCÍA II</text>
  <text x="345" y="158" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#881337">3 REGISTROS</text>
  <rect x="275" y="176" width="140" height="72" fill="none" stroke="#1C1B19" stroke-width="1"/>
  <line x1="275" y1="200" x2="415" y2="200" stroke="#1C1B19" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="275" y1="224" x2="415" y2="224" stroke="#1C1B19" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="345" y="192" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="10.5" fill="#1C1B19">Cabeza (Tête)</text>
  <text x="345" y="216" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="10.5" fill="#1C1B19">Fausset / Médium</text>
  <text x="345" y="240" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="10.5" fill="#1C1B19">Pecho (Poitrine)</text>
  <text x="345" y="268" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11" fill="#57534E">Polémica semántica por</text>
  <text x="345" y="284" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">llamar «falsete» al centro</text>

  <!-- Col 3: Browne / Behnke -->
  <text x="545" y="142" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11.5" font-weight="700" fill="#1C1B19">ERA VICTORIANA</text>
  <text x="545" y="158" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#57534E">5 A 7 REGISTROS</text>
  <rect x="475" y="176" width="140" height="80" fill="none" stroke="#1C1B19" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="475" y1="192" x2="615" y2="192" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.4"/>
  <line x1="475" y1="208" x2="615" y2="208" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.4"/>
  <line x1="475" y1="224" x2="615" y2="224" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.4"/>
  <line x1="475" y1="240" x2="615" y2="240" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.4"/>
  <text x="545" y="274" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11" fill="#57534E">Hiper-fragmentación:</text>
  <text x="545" y="290" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">Lower/Upper Thick &amp; Thin</text>

  <!-- Col 4: Hirano / Titze (DESTACADA) -->
  <rect x="655" y="128" width="180" height="206" fill="url(#hatchReg)" stroke="#881337" stroke-width="1"/>
  <text x="745" y="146" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11.5" font-weight="700" fill="#881337">FONIATRÍA ACTUAL</text>
  <text x="745" y="162" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#881337">M0–M3 + FORMANTES</text>
  <text x="745" y="188" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#1C1B19">M1 (TA) ↔ M2 (CT)</text>
  <text x="745" y="204" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">M0 (Fry) · M3 (Silbido)</text>
  <line x1="680" y1="220" x2="810" y2="220" stroke="#881337" stroke-width="0.7" stroke-opacity="0.4"/>
  <text x="745" y="242" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#881337">Acoplamiento del filtro</text>
  <text x="745" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#1C1B19">Cruces F1/F2 crean colores</text>
  <text x="745" y="272" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#1C1B19">intermedios (voix mixte)</text>

  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura histórica:</tspan> La ciencia contemporánea (columna burdeos) reconcilia la disputa al distinguir los mecanismos cordales
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    intrínsecos (M0–M3) de las transiciones acústicas producidas por los formantes del tracto vocal.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · TAXONOMÍA DE REGISTROS (TOSI 1723 · GARCÍA II 1841 · HIRANO · TITZE)</text>
</svg>
