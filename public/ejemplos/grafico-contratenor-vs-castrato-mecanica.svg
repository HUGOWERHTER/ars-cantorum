<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111e38" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#f3e5ab" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="950" height="560" fill="url(#bgDark)" rx="12" />

  <!-- TITULO -->
  <text x="475" y="42" text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, serif" font-size="24" font-weight="bold" letter-spacing="1">DISYUNTIVA BIOMECÁNICA: CASTRATO HISTÓRICO VS. CONTRATENOR MODERNO</text>
  <text x="475" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14">Comparativa laríngea, capacidad torácica y mecanismo fonatorio de masa cordal</text>

  <!-- PANEL IZQUIERDO: CASTRATO HISTORICO -->
  <g transform="translate(40, 100)">
    <rect width="415" height="410" fill="#0f172a" stroke="#d4af37" stroke-width="1.5" rx="10" />
    <rect width="415" height="38" fill="#d4af37" rx="8" />
    <text x="207" y="25" text-anchor="middle" fill="#0f172a" font-family="Georgia, serif" font-size="16" font-weight="bold">1. CASTRATO HISTÓRICO (Siglos XVII-XVIII)</text>

    <!-- Esquema Laringe y Torax -->
    <circle cx="207" cy="110" r="45" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="4,3" />
    <path d="M 185,110 Q 207,95 229,110" stroke="#f59e0b" stroke-width="4" fill="none" />
    <text x="207" y="115" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Laringe Prepuberal Femenil</text>
    <text x="207" y="130" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">(Cuerdas de 11 a 14 mm)</text>

    <!-- Fuelle Torácico Gigante -->
    <rect x="90" y="175" width="235" height="65" fill="#1e293b" stroke="#f59e0b" stroke-width="1" rx="6" />
    <text x="207" y="198" text-anchor="middle" fill="#fde047" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Fuelle Hipertrófico (Eunucoide)</text>
    <text x="207" y="216" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Caja torácica desarrollada de varón adulto</text>
    <text x="207" y="230" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Presión subglótica masiva + flujo laminar mínimo</text>

    <!-- Características Fonatorias -->
    <g transform="translate(25, 260)">
      <text x="0" y="18" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">• Mecanismo Vocal:</text>
      <text x="135" y="18" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">M1 modal natural (no falsete)</text>

      <text x="0" y="42" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">• Masa Glótica:</text>
      <text x="135" y="42" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Vibración de cuerpo y cubierta completa</text>

      <text x="0" y="66" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">• Salida Acústica:</text>
      <text x="135" y="66" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Penetración sonora colosal y squillo puro</text>

      <text x="0" y="90" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">• Resistencia Aérea:</text>
      <text x="135" y="90" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Fraseo ininterrumpido &gt; 60 segundos</text>

      <text x="0" y="114" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">• Huella Espectral:</text>
      <text x="135" y="114" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Agudos brillantes con resonancia torácica</text>
    </g>
  </g>

  <!-- PANEL DERECHO: CONTRATENOR MODERNO -->
  <g transform="translate(495, 100)">
    <rect width="415" height="410" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="10" />
    <rect width="415" height="38" fill="#1e3a8a" rx="8" />
    <text x="207" y="25" text-anchor="middle" fill="#f8fafc" font-family="Georgia, serif" font-size="16" font-weight="bold">2. CONTRATENOR MODERNO (Siglos XX-XXI)</text>

    <!-- Esquema Laringe y Torax -->
    <circle cx="207" cy="110" r="45" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" />
    <path d="M 175,110 Q 207,95 239,110" stroke="#60a5fa" stroke-width="2" fill="none" />
    <text x="207" y="115" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Laringe Masculina Postpuberal</text>
    <text x="207" y="130" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">(Cuerdas de 17 a 22 mm en falsete)</text>

    <!-- Fuelle Torácico Normal -->
    <rect x="90" y="175" width="235" height="65" fill="#1e293b" stroke="#38bdf8" stroke-width="1" rx="6" />
    <text x="207" y="198" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Fuelle Masculino Estándar</text>
    <text x="207" y="216" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Capacidad vital media de varón barítono/tenor</text>
    <text x="207" y="230" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Mayor escape aéreo por cierre glótico parcial</text>

    <!-- Características Fonatorias -->
    <g transform="translate(25, 260)">
      <text x="0" y="18" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">• Mecanismo Vocal:</text>
      <text x="135" y="18" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">M2 (falsete reforzado / voz de cabeza)</text>

      <text x="0" y="42" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">• Masa Glótica:</text>
      <text x="135" y="42" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Vibración aislada del borde libre (mucosa)</text>

      <text x="0" y="66" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">• Salida Acústica:</text>
      <text x="135" y="66" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Timbre etéreo, flautado; menor presión sonora</text>

      <text x="0" y="90" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">• Resistencia Aérea:</text>
      <text x="135" y="90" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Gasto fonatorio acelerado por hiatus posterior</text>

      <text x="0" y="114" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">• Huella Espectral:</text>
      <text x="135" y="114" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="12">Rico en fundamental (H1), formantes altos atenuados</text>
    </g>
  </g>

  <!-- PIE DE PAGINA -->
  <text x="475" y="535" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Ars Cantorum © 2026 • Análisis Musicológico y Fisiológico Comparativo</text>
</svg>