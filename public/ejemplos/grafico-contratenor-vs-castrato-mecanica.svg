<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111e38" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#f3e5ab" />
    </linearGradient>
  </defs>

  <rect width="980" height="580" fill="url(#bgDark)" rx="12" />

  <!-- TITULO -->
  <text x="490" y="42" text-anchor="middle" fill="url(#goldGrad)" font-family="Georgia, serif" font-size="22" font-weight="bold" letter-spacing="1">DISYUNTIVA BIOMECÁNICA: CASTRATO HISTÓRICO VS. CONTRATENOR MODERNO</text>
  <text x="490" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Comparativa laríngea, capacidad torácica y mecanismo fonatorio de masa cordal</text>

  <!-- PANEL IZQUIERDO: CASTRATO HISTORICO -->
  <g transform="translate(30, 95)">
    <rect width="445" height="435" fill="#0f172a" stroke="#d4af37" stroke-width="1.5" rx="10" />
    <rect width="445" height="38" fill="#d4af37" rx="8" />
    <text x="222" y="25" text-anchor="middle" fill="#0f172a" font-family="Georgia, serif" font-size="15" font-weight="bold">1. CASTRATO HISTÓRICO (Siglos XVII-XVIII)</text>

    <!-- Esquema Laringe y Torax -->
    <circle cx="222" cy="105" r="42" fill="none" stroke="#d4af37" stroke-width="2" stroke-dasharray="4,3" />
    <path d="M 200,105 Q 222,90 244,105" stroke="#f59e0b" stroke-width="4" fill="none" />
    <text x="222" y="109" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Laringe Prepuberal Femenil</text>
    <text x="222" y="124" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">(Cuerdas de 11 a 14 mm de longitud)</text>

    <!-- Fuelle Torácico Gigante -->
    <rect x="85" y="160" width="275" height="65" fill="#1e293b" stroke="#f59e0b" stroke-width="1" rx="6" />
    <text x="222" y="182" text-anchor="middle" fill="#fde047" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Fuelle Hipertrófico (Eunucoide)</text>
    <text x="222" y="199" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">Caja torácica desarrollada de varón adulto</text>
    <text x="222" y="214" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Presión subglótica masiva y flujo laminar mínimo</text>

    <!-- Características Fonatorias formateadas en dos columnas limpias -->
    <g transform="translate(20, 245)">
      <rect width="405" height="170" fill="#1e293b" stroke="#334155" rx="6" />
      
      <text x="15" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Mecanismo Vocal:</text>
      <text x="145" y="24" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">M1 modal natural (no falsete)</text>

      <text x="15" y="52" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Masa Glótica:</text>
      <text x="145" y="52" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Vibración de cuerpo y cubierta completa</text>

      <text x="15" y="80" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Salida Acústica:</text>
      <text x="145" y="80" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Penetración sonora colosal y squillo puro</text>

      <text x="15" y="108" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Resistencia Aérea:</text>
      <text x="145" y="108" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Fraseo sostenido superior a 60 segundos</text>

      <text x="15" y="136" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Huella Espectral:</text>
      <text x="145" y="136" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Agudos brillantes con resonancia torácica</text>
    </g>
  </g>

  <!-- PANEL DERECHO: CONTRATENOR MODERNO -->
  <g transform="translate(505, 95)">
    <rect width="445" height="435" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" rx="10" />
    <rect width="445" height="38" fill="#1e3a8a" rx="8" />
    <text x="222" y="25" text-anchor="middle" fill="#f8fafc" font-family="Georgia, serif" font-size="15" font-weight="bold">2. CONTRATENOR MODERNO (Siglos XX-XXI)</text>

    <!-- Esquema Laringe y Torax -->
    <circle cx="222" cy="105" r="42" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,3" />
    <path d="M 195,105 Q 222,92 249,105" stroke="#60a5fa" stroke-width="2" fill="none" />
    <text x="222" y="109" text-anchor="middle" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold">Laringe Masculina Postpuberal</text>
    <text x="222" y="124" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">(Cuerdas de 17 a 22 mm en falsete)</text>

    <!-- Fuelle Torácico Normal -->
    <rect x="85" y="160" width="275" height="65" fill="#1e293b" stroke="#38bdf8" stroke-width="1" rx="6" />
    <text x="222" y="182" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Fuelle Masculino Estándar</text>
    <text x="222" y="199" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10.5">Capacidad vital media de varón barítono/tenor</text>
    <text x="222" y="214" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Mayor escape aéreo por cierre glótico parcial</text>

    <!-- Características Fonatorias formateadas en dos columnas limpias -->
    <g transform="translate(20, 245)">
      <rect width="405" height="170" fill="#1e293b" stroke="#334155" rx="6" />
      
      <text x="15" y="24" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Mecanismo Vocal:</text>
      <text x="145" y="24" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">M2 (falsete reforzado / voz de cabeza)</text>

      <text x="15" y="52" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Masa Glótica:</text>
      <text x="145" y="52" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Vibración aislada del borde libre (mucosa)</text>

      <text x="15" y="80" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Salida Acústica:</text>
      <text x="145" y="80" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Timbre etéreo; menor presión de proyección</text>

      <text x="15" y="108" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Resistencia Aérea:</text>
      <text x="145" y="108" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Gasto fonatorio acelerado por hiatus glótico</text>

      <text x="15" y="136" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Huella Espectral:</text>
      <text x="145" y="136" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Rico en fundamental (H1); armónicos suaves</text>
    </g>
  </g>

  <!-- PIE DE PAGINA -->
  <text x="490" y="555" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Ars Cantorum © 2026 • Análisis Musicológico y Fisiológico Comparativo</text>
</svg>