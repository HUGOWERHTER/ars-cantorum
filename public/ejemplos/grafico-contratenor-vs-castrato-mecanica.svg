<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchCas" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.9" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — ORGANOLOGÍA COMPARADA: CASTRATO BARROCO vs. CONTRATENOR</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Asimetría entre longitud cordal (mm), capacidad vital torácica (L) y mecanismo laríngeo (M1 vs. M2)</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <line x1="440" y1="90" x2="440" y2="345" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.25" stroke-dasharray="3,3"/>

  <!-- IZQUIERDA: CASTRATO HISTÓRICO -->
  <text x="230" y="102" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="700" fill="#881337">I. CASTRATO HISTÓRICO (SIGLOS XVII–XVIII)</text>
  <!-- Glotis prepuberal 11-14 mm en M1 -->
  <ellipse cx="230" cy="155" rx="44" ry="28" fill="url(#hatchCas)" stroke="#881337" stroke-width="1.3"/>
  <path d="M 196,155 Q 230,147 264,155 Q 230,163 196,155 Z" fill="#881337" fill-opacity="0.75"/>
  <line x1="196" y1="196" x2="264" y2="196" stroke="#881337" stroke-width="1"/>
  <text x="230" y="211" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#881337">11–14 mm · Mecanismo M1 pleno</text>
  <!-- Barra de capacidad torácica (>5.5 L) -->
  <text x="70" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#57534E">CAPACIDAD TORÁCICA</text>
  <rect x="70" y="256" width="320" height="14" fill="url(#hatchCas)" stroke="#881337" stroke-width="1"/>
  <text x="390" y="284" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#881337">&gt; 5.5 L (Hipertrofia eunucoide)</text>
  <text x="230" y="316" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" fill="#1C1B19">Cuerpo y cubierta en fase cerrada larga · Squillo heroico</text>
  <text x="230" y="332" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Resistencia de &gt;60 s en un solo aliento (Farinelli)</text>

  <!-- DERECHA: CONTRATENOR MODERNO -->
  <text x="655" y="102" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="700" fill="#1C1B19">II. CONTRATENOR MODERNO (M2 ADULTO)</text>
  <ellipse cx="655" cy="155" rx="58" ry="32" fill="none" stroke="#1C1B19" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 605,153 Q 655,147 705,153" fill="none" stroke="#1C1B19" stroke-width="1.8"/>
  <path d="M 605,157 Q 655,163 705,157" fill="none" stroke="#1C1B19" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="605" y1="196" x2="705" y2="196" stroke="#1C1B19" stroke-width="1"/>
  <text x="655" y="211" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#1C1B19">17–22 mm · Mecanismo M2 (Borde libre)</text>
  <!-- Barra estándar -->
  <text x="495" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#57534E">CAPACIDAD TORÁCICA</text>
  <rect x="495" y="256" width="230" height="14" fill="none" stroke="#1C1B19" stroke-width="1"/>
  <text x="725" y="284" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#57534E">4.0–5.0 L (Estándar masculino)</text>
  <text x="655" y="316" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" fill="#1C1B19">Predominio de fundamental H₁ · Ligero hiatus posterior</text>
  <text x="655" y="332" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Timbre flautado y etéreo · Menor presión subglótica máxima</text>

  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura organológica:</tspan> El castrato acoplaba una laringe infantil en M1 modal (burdeos) a un tórax gigante; el contratenor
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    adulto canta en M2 ligamentoso sobre una laringe virilizada, generando una acústica radicalmente distinta.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · ANATOMÍA COMPARADA (TOSI 1723 · MANCINI 1774 · STARK 1999)</text>
</svg>
