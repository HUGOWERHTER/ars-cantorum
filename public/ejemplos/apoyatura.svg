<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="100%" height="auto" style="background:#ffffff; border:1px solid #e5ded4; border-radius:8px; padding:10px;">
  <!-- Título del ejemplo -->
  <text x="30" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0f172a">EJEMPLO 1: LA APOYATURA DESCENDENTE (Resolución de tercera)</text>
  
  <!-- Subtítulos de comparación -->
  <text x="70" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#92400e">A) Como está escrito</text>
  <text x="420" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#059669">B) Como se canta (Ejecución Belcantista)</text>

  <!-- PENTAGRAMA A -->
  <g stroke="#334155" stroke-width="1.2">
    <line x1="60" y1="65" x2="350" y2="65"/>
    <line x1="60" y1="77" x2="350" y2="77"/>
    <line x1="60" y1="89" x2="350" y2="89"/>
    <line x1="60" y1="101" x2="350" y2="101"/>
    <line x1="60" y1="113" x2="350" y2="113"/>
    <!-- Barra inicial y final -->
    <line x1="60" y1="65" x2="60" y2="113" stroke-width="2"/>
    <line x1="350" y1="65" x2="350" y2="113" stroke-width="2"/>
  </g>
  <!-- Clave de Sol A (simplificada nítida) -->
  <text x="70" y="106" font-family="serif" font-size="46" fill="#0f172a">𝄞</text>
  <!-- Compás 4/4 -->
  <text x="105" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#334155">4</text>
  <text x="105" y="108" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="700" fill="#334155">4</text>
  <!-- Pequeña apoyatura (Re5) -->
  <ellipse cx="160" cy="71" rx="4.5" ry="3.5" fill="#92400e" transform="rotate(-15 160 71)"/>
  <line x1="164" y1="71" x2="164" y2="48" stroke="#92400e" stroke-width="1.5"/>
  <path d="M164 48 Q 170 52 173 58" stroke="#92400e" stroke-width="1.5" fill="none"/>
  <line x1="158" y1="56" x2="170" y2="50" stroke="#92400e" stroke-width="1.2"/> <!-- Tachadura de apoyatura breve -->
  <path d="M 162 76 Q 175 84 190 79" stroke="#92400e" stroke-width="1.2" fill="none"/> <!-- Ligadura -->
  <text x="150" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Apoyatura</text>
  <!-- Nota principal (Do5) Blanca -->
  <ellipse cx="195" cy="77" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 195 77)"/>
  <line x1="201" y1="77" x2="201" y2="45" stroke="#0f172a" stroke-width="1.8"/>
  <text x="185" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Nota real</text>
  <!-- Nota resolución (Si4) Blanca -->
  <ellipse cx="280" cy="83" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 280 83)"/>
  <line x1="286" y1="83" x2="286" y2="50" stroke="#0f172a" stroke-width="1.8"/>

  <!-- PENTAGRAMA B -->
  <g stroke="#334155" stroke-width="1.2">
    <line x1="410" y1="65" x2="720" y2="65"/>
    <line x1="410" y1="77" x2="720" y2="77"/>
    <line x1="410" y1="89" x2="720" y2="89"/>
    <line x1="410" y1="101" x2="720" y2="101"/>
    <line x1="410" y1="113" x2="720" y2="113"/>
    <!-- Barra inicial y final -->
    <line x1="410" y1="65" x2="410" y2="113" stroke-width="2"/>
    <line x1="720" y1="65" x2="720" y2="113" stroke-width="2"/>
  </g>
  <!-- Clave de Sol B -->
  <text x="420" y="106" font-family="serif" font-size="46" fill="#0f172a">𝄞</text>
  <!-- Nota 1: Re5 (Negra con acento >) -->
  <text x="480" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#059669">&gt;</text>
  <ellipse cx="485" cy="71" rx="6" ry="4.5" fill="#059669" transform="rotate(-15 485 71)"/>
  <line x1="490" y1="71" x2="490" y2="44" stroke="#059669" stroke-width="1.8"/>
  <text x="468" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#059669">(Acento prosódico)</text>
  <!-- Ligadura de articulación -->
  <path d="M 490 64 Q 520 54 550 70" stroke="#059669" stroke-width="1.5" fill="none"/>
  <!-- Nota 2: Do5 (Negra relajada) -->
  <ellipse cx="550" cy="77" rx="6" ry="4.5" fill="#0f172a" transform="rotate(-15 550 77)"/>
  <line x1="555" y1="77" x2="555" y2="50" stroke="#0f172a" stroke-width="1.8"/>
  <text x="536" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">(Resolución suave)</text>
  <!-- Nota 3: Si4 (Blanca) -->
  <ellipse cx="640" cy="83" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 640 83)"/>
  <line x1="646" y1="83" x2="646" y2="50" stroke="#0f172a" stroke-width="1.8"/>
</svg>
