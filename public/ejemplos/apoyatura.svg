<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="810" height="34" rx="6" fill="#e2e8f0"/>
  <text x="420" y="32" text-anchor="middle" font-family="'Cinzel', serif" font-size="13.5" font-weight="700" fill="#0f172a" letter-spacing="0.05em">EJEMPLO 1: APOYATURA DESCENDENTE</text>

  <!-- PANEL A -->
  <rect x="15" y="54" width="395" height="162" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="16" y="55" width="393" height="28" rx="7" fill="#fff7ed"/>
  <text x="35" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#c2410c">A) Cómo se escribe</text>

  <g stroke="#64748b" stroke-width="1.2">
    <line x1="35" y1="102" x2="390" y2="102"/>
    <line x1="35" y1="112" x2="390" y2="112"/>
    <line x1="35" y1="122" x2="390" y2="122"/>
    <line x1="35" y1="132" x2="390" y2="132"/>
    <line x1="35" y1="142" x2="390" y2="142"/>
  </g>
  <text x="40" y="137" font-family="serif" font-size="44" fill="#0f172a">𝄞</text>

  <!-- Apoyatura Mi5 -->
  <ellipse cx="160" cy="107" rx="4.5" ry="3.5" fill="#0f172a" transform="rotate(-15 160 107)"/>
  <line x1="164" y1="107" x2="164" y2="86" stroke="#0f172a" stroke-width="1.4"/>
  <path d="M 164 86 Q 170 90 173 96" stroke="#0f172a" stroke-width="1.4" fill="none"/>
  <path d="M 163 112 Q 200 126 235 117" stroke="#0f172a" stroke-width="1.4" fill="none"/>

  <!-- Re5 -->
  <ellipse cx="240" cy="112" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 240 112)"/>
  <line x1="234" y1="112" x2="234" y2="140" stroke="#0f172a" stroke-width="1.8"/>

  <!-- Do5 -->
  <ellipse cx="335" cy="117" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 335 117)"/>
  <line x1="329" y1="117" x2="329" y2="145" stroke="#0f172a" stroke-width="1.8"/>

  <rect x="25" y="168" width="375" height="38" rx="5" fill="#f1f5f9"/>
  <text x="212" y="185" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11.5" fill="#334155">
    <tspan x="212" dy="0">Apoyatura escrita como nota pequeña:</tspan>
    <tspan x="212" dy="14">adorno que precede a la nota principal</tspan>
  </text>

  <!-- PANEL B -->
  <rect x="430" y="54" width="395" height="162" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="431" y="55" width="393" height="28" rx="7" fill="#f0fdf4"/>
  <text x="450" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#15803d">B) Cómo se realiza</text>

  <g stroke="#64748b" stroke-width="1.2">
    <line x1="450" y1="102" x2="805" y2="102"/>
    <line x1="450" y1="112" x2="805" y2="112"/>
    <line x1="450" y1="122" x2="805" y2="122"/>
    <line x1="450" y1="132" x2="805" y2="132"/>
    <line x1="450" y1="142" x2="805" y2="142"/>
  </g>
  <text x="455" y="137" font-family="serif" font-size="44" fill="#0f172a">𝄞</text>

  <path d="M 545 95 Q 590 82 630 100" stroke="#0f172a" stroke-width="1.5" fill="none"/>

  <ellipse cx="545" cy="107" rx="6" ry="4.5" fill="#0f172a" transform="rotate(-15 545 107)"/>
  <line x1="539" y1="107" x2="539" y2="135" stroke="#0f172a" stroke-width="1.8"/>

  <ellipse cx="630" cy="112" rx="6" ry="4.5" fill="#0f172a" transform="rotate(-15 630 112)"/>
  <line x1="624" y1="112" x2="624" y2="140" stroke="#0f172a" stroke-width="1.8"/>

  <ellipse cx="725" cy="117" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 725 117)"/>
  <line x1="719" y1="117" x2="719" y2="145" stroke="#0f172a" stroke-width="1.8"/>

  <rect x="440" y="168" width="375" height="38" rx="5" fill="#f0fdf4"/>
  <text x="627" y="185" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11.5" fill="#15803d">
    <tspan x="627" dy="0">La apoyatura toma la mitad del valor:</tspan>
    <tspan x="627" dy="14">tensión disonante en tiempo fuerte</tspan>
  </text>
</svg>