<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" width="100%" height="auto" style="background:#fdfbf7; border:1px solid #dcd6cd; border-radius:4px; padding:6px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); font-family: 'Cinzel', 'Baskerville', 'Georgia', serif;">
  <!-- Doble marco clásico tipográfico estilo Diderot -->
  <rect x="10" y="10" width="840" height="250" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="14" y="14" width="832" height="242" fill="none" stroke="#475569" stroke-width="0.8"/>
  <rect x="18" y="18" width="824" height="234" fill="none" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="6,3"/>

  <!-- Encabezado de la lámina -->
  <text x="430" y="40" text-anchor="middle" font-size="10.5" letter-spacing="0.2em" fill="#64748b" font-weight="600">ENCYCLOPÉDIE MUSICOLOGIQUE DU BEL CANTO</text>
  <line x1="200" y1="46" x2="660" y2="46" stroke="#475569" stroke-width="0.8"/>
  <text x="430" y="64" text-anchor="middle" font-size="13.5" letter-spacing="0.08em" fill="#0f172a" font-weight="700">PLANCHE XIV-A. — DE L'APPUYATURE DESCENDANTE</text>

  <!-- ==================== FIGURA 1: NOTATION ÉCRITE ==================== -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="380" height="135" fill="#fcfbfa" stroke="#475569" stroke-width="1"/>
    <rect x="3" y="3" width="374" height="129" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    <text x="190" y="22" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.05em" fill="#0f172a">FIG. 1. — NOTATION ÉCRITE (NOTATION ORNÉE)</text>
    <line x1="30" y1="28" x2="350" y2="28" stroke="#cbd5e1" stroke-width="0.6"/>

    <!-- Pentagrama (5 líneas) -->
    <g stroke="#334155" stroke-width="1">
      <line x1="25" y1="52" x2="355" y2="52"/>
      <line x1="25" y1="62" x2="355" y2="62"/>
      <line x1="25" y1="72" x2="355" y2="72"/>
      <line x1="25" y1="82" x2="355" y2="82"/>
      <line x1="25" y1="92" x2="355" y2="92"/>
    </g>
    <!-- Clave de Sol -->
    <text x="30" y="87" font-family="serif" font-size="42" fill="#0f172a">𝄞</text>

    <!-- Apoyatura pequeña Mi5 -->
    <ellipse cx="145" cy="57" rx="4.2" ry="3.2" fill="#0f172a" transform="rotate(-15 145 57)"/>
    <line x1="149" y1="57" x2="149" y2="36" stroke="#0f172a" stroke-width="1.3"/>
    <path d="M 149 36 Q 155 40 158 46" stroke="#0f172a" stroke-width="1.3" fill="none"/>
    <path d="M 148 62 Q 182 75 214 67" stroke="#0f172a" stroke-width="1.3" fill="none"/>

    <!-- Nota principal Re5 (Blanca) -->
    <ellipse cx="220" cy="62" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="1.8" transform="rotate(-15 220 62)"/>
    <line x1="214" y1="62" x2="214" y2="90" stroke="#0f172a" stroke-width="1.6"/>

    <!-- Nota de resolución Do5 (Blanca) -->
    <ellipse cx="305" cy="67" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="1.8" transform="rotate(-15 305 67)"/>
    <line x1="299" y1="67" x2="299" y2="95" stroke="#0f172a" stroke-width="1.6"/>

    <text x="190" y="118" text-anchor="middle" font-size="9.5" font-style="italic" fill="#475569">Apoyatura indicada en carácter diminuto antes de la consonancia.</text>
  </g>

  <!-- ==================== FIGURA 2: EXÉCUTION RÉELLE ==================== -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="380" height="135" fill="#fcfbfa" stroke="#475569" stroke-width="1"/>
    <rect x="3" y="3" width="374" height="129" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    <text x="190" y="22" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.05em" fill="#0f172a">FIG. 2. — EXÉCUTION RÉELLE (VALEUR DU TEMPS)</text>
    <line x1="30" y1="28" x2="350" y2="28" stroke="#cbd5e1" stroke-width="0.6"/>

    <!-- Pentagrama (5 líneas) -->
    <g stroke="#334155" stroke-width="1">
      <line x1="25" y1="52" x2="355" y2="52"/>
      <line x1="25" y1="62" x2="355" y2="62"/>
      <line x1="25" y1="72" x2="355" y2="72"/>
      <line x1="25" y1="82" x2="355" y2="82"/>
      <line x1="25" y1="92" x2="355" y2="92"/>
    </g>
    <!-- Clave de Sol -->
    <text x="30" y="87" font-family="serif" font-size="42" fill="#0f172a">𝄞</text>

    <!-- Ligadura de apoyatura a resolución -->
    <path d="M 125 45 Q 165 32 205 50" stroke="#0f172a" stroke-width="1.4" fill="none"/>

    <!-- Mi5 Negra (mitad de valor) -->
    <ellipse cx="125" cy="57" rx="6" ry="4.5" fill="#0f172a" transform="rotate(-15 125 57)"/>
    <line x1="119" y1="57" x2="119" y2="85" stroke="#0f172a" stroke-width="1.6"/>

    <!-- Re5 Negra (segunda mitad) -->
    <ellipse cx="205" cy="62" rx="6" ry="4.5" fill="#0f172a" transform="rotate(-15 205 62)"/>
    <line x1="199" y1="62" x2="199" y2="90" stroke="#0f172a" stroke-width="1.6"/>

    <!-- Do5 Blanca (resolución) -->
    <ellipse cx="290" cy="67" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="1.8" transform="rotate(-15 290 67)"/>
    <line x1="284" y1="67" x2="284" y2="95" stroke="#0f172a" stroke-width="1.6"/>

    <text x="190" y="118" text-anchor="middle" font-size="9.5" font-style="italic" fill="#475569">La apoyatura toma la mitad exacta del valor métrico principal.</text>
  </g>

  <!-- Pie de imprenta -->
  <line x1="30" y1="236" x2="830" y2="236" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="35" y="249" font-size="9" font-style="italic" fill="#64748b">Ars Cantorum Archivo • Traités historiques de Tosi, Mancini et Agricola</text>
  <text x="825" y="249" text-anchor="end" font-size="9" letter-spacing="0.05em" fill="#64748b">GRAVURE MUSICALE SUR CUIVRE</text>
</svg>