<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 215" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <!-- Barra superior del título -->
  <rect x="10" y="8" width="740" height="34" rx="6" fill="#e2e8f0"/>
  <text x="380" y="30" text-anchor="middle" font-family="'Cinzel', serif" font-size="13.5" font-weight="700" fill="#0f172a" letter-spacing="0.05em">EJEMPLO 1: APOYATURA DESCENDENTE</text>

  <!-- ==================== TARJETA A (CÓMO SE ESCRIBE) ==================== -->
  <rect x="15" y="50" width="355" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="16" y="51" width="353" height="28" rx="7" fill="#fff7ed"/>
  <text x="30" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" fill="#c2410c">A) Cómo se escribe</text>

  <!-- Pentagrama A (5 líneas) -->
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="35" y1="98" x2="350" y2="98"/>
    <line x1="35" y1="108" x2="350" y2="108"/>
    <line x1="35" y1="118" x2="350" y2="118"/>
    <line x1="35" y1="128" x2="350" y2="128"/>
    <line x1="35" y1="138" x2="350" y2="138"/>
  </g>
  <!-- Clave de Sol A -->
  <text x="40" y="133" font-family="serif" font-size="44" fill="#0f172a">𝄞</text>

  <!-- Apoyatura pequeña Mi5 (4to espacio) -->
  <ellipse cx="145" cy="103" rx="4.2" ry="3.2" fill="#0f172a" transform="rotate(-15 145 103)"/>
  <line x1="149" y1="103" x2="149" y2="82" stroke="#0f172a" stroke-width="1.4"/>
  <path d="M 149 82 Q 155 86 158 92" stroke="#0f172a" stroke-width="1.4" fill="none"/>

  <!-- Nota principal Re5 (4ta línea, Blanca) -->
  <ellipse cx="220" cy="108" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 220 108)"/>
  <line x1="214" y1="108" x2="214" y2="136" stroke="#0f172a" stroke-width="1.8"/>

  <!-- Nota de llegada Do5 (3er espacio, Blanca) -->
  <ellipse cx="305" cy="113" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 305 113)"/>
  <line x1="299" y1="113" x2="299" y2="141" stroke="#0f172a" stroke-width="1.8"/>

  <!-- Píldora explicativa A -->
  <rect x="25" y="162" width="335" height="28" rx="5" fill="#f1f5f9"/>
  <text x="192" y="180" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="12.5" fill="#334155">apoyatura escrita como nota pequeña</text>


  <!-- ==================== TARJETA B (CÓMO SE REALIZA) ==================== -->
  <rect x="390" y="50" width="355" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="391" y="51" width="353" height="28" rx="7" fill="#f0fdf4"/>
  <text x="405" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" fill="#15803d">B) Cómo se realiza</text>

  <!-- Pentagrama B (5 líneas) -->
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="410" y1="98" x2="725" y2="98"/>
    <line x1="410" y1="108" x2="725" y2="108"/>
    <line x1="410" y1="118" x2="725" y2="118"/>
    <line x1="410" y1="128" x2="725" y2="128"/>
    <line x1="410" y1="138" x2="725" y2="138"/>
  </g>
  <!-- Clave de Sol B -->
  <text x="415" y="133" font-family="serif" font-size="44" fill="#0f172a">𝄞</text>

  <!-- Ligadura de apoyatura a resolución -->
  <path d="M 495 91 Q 535 78 575 96" stroke="#0f172a" stroke-width="1.5" fill="none"/>

  <!-- Mi5 Negra (Toma la mitad del valor de Re5) -->
  <ellipse cx="495" cy="103" rx="6" ry="4.5" fill="#0f172a" transform="rotate(-15 495 103)"/>
  <line x1="489" y1="103" x2="489" y2="131" stroke="#0f172a" stroke-width="1.8"/>

  <!-- Re5 Negra (Segunda mitad) -->
  <ellipse cx="575" cy="108" rx="6" ry="4.5" fill="#0f172a" transform="rotate(-15 575 108)"/>
  <line x1="569" y1="108" x2="569" y2="136" stroke="#0f172a" stroke-width="1.8"/>

  <!-- Do5 Blanca (Resolución) -->
  <ellipse cx="660" cy="113" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 660 113)"/>
  <line x1="654" y1="113" x2="654" y2="141" stroke="#0f172a" stroke-width="1.8"/>

  <!-- Píldora explicativa B -->
  <rect x="400" y="162" width="335" height="28" rx="5" fill="#f1f5f9"/>
  <text x="567" y="180" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="12.5" fill="#334155">la apoyatura toma la mitad del valor de la nota principal</text>
</svg>