<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchAppoggio" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.9" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — CURVA DE RETROCESO ELÁSTICO: OVER-BREATHING vs. ECONOMÍA DE LAMPERTI</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Relación entre el volumen pulmonar inhalado (% capacidad vital) y la presión pasiva que debe frenar la glotis</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- Grilla -->
  <g stroke="#1C1B19" stroke-opacity="0.12" stroke-width="0.8">
    <line x1="95" y1="125" x2="815" y2="125" stroke-dasharray="2,3"/>
    <line x1="95" y1="185" x2="815" y2="185" stroke-dasharray="2,3"/>
    <line x1="95" y1="245" x2="815" y2="245" stroke-dasharray="2,3"/>
    <line x1="275" y1="100" x2="275" y2="305" stroke-dasharray="2,3"/>
    <line x1="455" y1="100" x2="455" y2="305" stroke-dasharray="2,3"/>
    <line x1="635" y1="100" x2="635" y2="305" stroke-dasharray="2,3"/>
  </g>

  <!-- Zona óptima de Lamperti (55% - 75% capacidad -> x=491 a 635) -->
  <rect x="491" y="100" width="144" height="205" fill="url(#hatchAppoggio)" stroke="#881337" stroke-width="0.8" stroke-opacity="0.4"/>

  <!-- Ejes -->
  <line x1="95" y1="100" x2="95" y2="305" stroke="#1C1B19" stroke-width="1.2"/>
  <line x1="95" y1="305" x2="820" y2="305" stroke="#1C1B19" stroke-width="1.2"/>

  <!-- Etiquetas Eje Y -->
  <text x="83" y="129" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">+30 cm H₂O</text>
  <text x="83" y="189" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">+15 cm H₂O</text>
  <text x="83" y="249" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">0 cm H₂O</text>
  <text x="22" y="202" text-anchor="middle" transform="rotate(-90 22 202)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#57534E" letter-spacing="0.06em">PRESIÓN PASIVA DE RELAJACIÓN</text>

  <!-- Etiquetas Eje X -->
  <text x="95" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">0%</text>
  <text x="275" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">25%</text>
  <text x="455" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">50%</text>
  <text x="635" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#881337">75%</text>
  <text x="815" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">100% CV</text>

  <!-- Curva de presión de relajación (S-curve de Titze: sube exponencialmente >80%) -->
  <path d="M 110,295 C 220,275 340,248 455,222 C 560,198 635,180 695,148 C 745,122 785,108 810,104"
        fill="none" stroke="#1C1B19" stroke-width="1.8"/>
  <!-- Segmento burdeos dentro de la zona económica -->
  <path d="M 491,214 C 550,200 600,188 635,180" fill="none" stroke="#881337" stroke-width="2.6"/>
  <circle cx="563" cy="197" r="4" fill="#881337"/>
  <circle cx="775" cy="112" r="4" fill="#1C1B19"/>

  <!-- Línea umbral fonatorio óptimo -->
  <line x1="95" y1="196" x2="815" y2="196" stroke="#881337" stroke-width="0.9" stroke-dasharray="4,3"/>

  <!-- Anotaciones directas -->
  <line x1="563" y1="197" x2="500" y2="132" stroke="#881337" stroke-width="0.9"/>
  <text x="494" y="122" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="700" fill="#881337">Zona de Appoggio (60–75%)</text>
  <text x="494" y="136" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Presión estable (8–12 cm H₂O) sin esfuerzo glótico</text>

  <line x1="775" y1="112" x2="735" y2="215" stroke="#1C1B19" stroke-width="0.9"/>
  <text x="735" y="230" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="600" fill="#1C1B19">Over-breathing (&gt;85%)</text>
  <text x="735" y="244" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Retroceso violento · Cierre defensivo</text>

  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura aerodinámica:</tspan> Por encima del 80% de la capacidad vital (CV), el tórax genera presiones pasivas muy superiores
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    a las necesarias para cantar, obligando a la laringe a frenar el aire; la toma moderada de Lamperti evita ese bloqueo.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · CURVA PRESIÓN-VOLUMEN (LAMPERTI 1890 · TITZE 1994)</text>
</svg>
