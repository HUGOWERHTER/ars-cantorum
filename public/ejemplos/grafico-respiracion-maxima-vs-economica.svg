<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="890" height="36" rx="6" fill="#0f172a"/>
  <text x="460" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">LA PARADOJA DEL AIRE: INHALACIÓN MÁXIMA (OVER-BREATHING) vs. CONTROL ECONÓMICO</text>

  <!-- PANEL A: OVER-BREATHING -->
  <rect x="15" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="16" y="57" width="433" height="32" rx="7" fill="#fef2f2"/>
  <text x="232" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">A) Sobrecarga Pulmonar (Llenado al 100%)</text>

  <g transform="translate(28, 102)">
    <rect x="0" y="0" width="160" height="118" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="80" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Presión Excesiva</text>
    <rect x="45" y="32" width="70" height="38" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <path d="M 80 65 L 80 38 M 74 44 L 80 38 L 86 44" stroke="#dc2626" stroke-width="2" fill="none"/>
    <text x="80" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">Retroceso Elástico</text>
    <text x="80" y="103" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#7f1d1d">La glotis se defiende</text>

    <rect x="172" y="0" width="236" height="118" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="184" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Efectos Aerodinámicos:</text>
    <text x="184" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Elevación clavicular y rigidez cervical</text>
    <text x="184" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Presión subglótica muy superior a la útil</text>
    <text x="184" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Cierre glótico forzado para contener aire</text>
    <text x="184" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Escape rápido al inicio de la frase</text>
    <text x="184" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#b91c1c">• Sensación paradójica de ahogo</text>
  </g>

  <g transform="translate(28, 232)">
    <rect x="0" y="0" width="408" height="180" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="204" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">El Error de la "Capacidad Pulmonar"</text>
    <text x="204" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">
      <tspan x="204" dy="0">"Tomar una bocanada gigante obliga al tórax</tspan>
      <tspan x="204" dy="16">a colapsar violentamente, forzando a la laringe</tspan>
      <tspan x="204" dy="16">a actuar como una válvula de freno."</tspan>
    </text>
    <line x1="35" y1="94" x2="373" y2="94" stroke="#fecaca" stroke-width="1"/>
    <text x="204" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">
      <tspan x="204" dy="0">Física del Tórax (Titze):</tspan>
      <tspan x="204" dy="14" font-weight="700" fill="#b91c1c">A >80% de volumen, la presión pasiva excede lo necesario</tspan>
    </text>
    <text x="204" y="154" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#991b1b">
      <tspan x="204" dy="0">Resultado en Escena</tspan>
      <tspan x="204" dy="14" font-weight="500" fill="#7f1d1d">Ataques duros, pérdida de afinación y agotamiento rápido</tspan>
    </text>
  </g>

  <!-- PANEL B: CONTROL ECONÓMICO -->
  <rect x="470" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
  <rect x="471" y="57" width="433" height="32" rx="7" fill="#f0fdf4"/>
  <text x="687" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#15803d">B) Economía Belcantista (Respiración Moderada y Silenciosa)</text>

  <g transform="translate(483, 102)">
    <rect x="0" y="0" width="160" height="118" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="80" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#15803d">Flujo Dosificado</text>
    <rect x="45" y="38" width="70" height="30" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <line x1="55" y1="53" x2="105" y2="53" stroke="#15803d" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="80" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#15803d">60–70% Capacidad</text>
    <text x="80" y="103" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#166534">Equilibrio sin rigidez</text>

    <rect x="172" y="0" width="236" height="118" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="184" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#15803d">Norma de Lamperti:</text>
    <text x="184" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#166534">• Toma de aire silenciosa, baja y sin prisa</text>
    <text x="184" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#166534">• Volumen ajustado a la longitud de frase</text>
    <text x="184" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#166534">• Tono inspiratorio mantenido (appoggio)</text>
    <text x="184" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#166534">• Flujo mínimo (100–150 ml/s) bien convertido</text>
    <text x="184" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#15803d">• Libertad total en el instrumento laríngeo</text>
  </g>

  <g transform="translate(483, 232)">
    <rect x="0" y="0" width="408" height="180" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="204" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803d">Máxima de Francesco y G. B. Lamperti</text>
    <text x="204" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#166534">
      <tspan x="204" dy="0">"No tomes jamás más aire del que puedas</tspan>
      <tspan x="204" dy="16">controlar con facilidad; la potencia nace de la</tspan>
      <tspan x="204" dy="16">resonancia acústica, nunca del volumen de aire."</tspan>
    </text>
    <line x1="35" y1="94" x2="373" y2="94" stroke="#bbf7d0" stroke-width="1"/>
    <text x="204" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#166534">
      <tspan x="204" dy="0">Prueba Clásica de la Vela:</tspan>
      <tspan x="204" dy="14" font-weight="700" fill="#15803d">La llama apenas oscila ante los labios durante el canto</tspan>
    </text>
    <text x="204" y="154" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#16a34a">
      <tspan x="204" dy="0">Eficiencia Energética</tspan>
      <tspan x="204" dy="14" font-weight="500" fill="#166534">Frases de 20+ segundos con plenitud tímbrica constante</tspan>
    </text>
  </g>
</svg>
