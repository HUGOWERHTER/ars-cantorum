<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.04);">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Contenedor Izquierdo -->
  <rect x="20" y="18" width="450" height="184" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 4"/>
  <text x="35" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10.5" fill="#64748b" letter-spacing="0.08em">SISTEMA CORDAL ANTAGONISTA</text>

  <!-- Tarjeta TA -->
  <rect x="35" y="48" width="420" height="64" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.5"/>
  <text x="50" y="68" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#c2410c">MÚSCULO TIROARITENOIDEO (TA)</text>
  <text x="50" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#475569">
    <tspan x="50" dy="0">Masa profunda y cierre firme • Dominancia de Pecho (M1)</tspan>
    <tspan x="50" dy="14" fill="#9a3412">Aporta cuerpo, armónicos fundamentales y potencia heroica</tspan>
  </text>

  <!-- Tarjeta CT -->
  <rect x="35" y="124" width="420" height="64" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="50" y="144" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#1d4ed8">MÚSCULO CRICOTIROIDEO (CT)</text>
  <text x="50" y="162" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#475569">
    <tspan x="50" dy="0">Tensor longitudinal / Adelgazamiento • Dominancia Cabeza (M2)</tspan>
    <tspan x="50" dy="14" fill="#1e40af">Elonga y afina el borde cordal para alcanzar los agudos</tspan>
  </text>

  <!-- Flechas convergentes -->
  <path d="M 455 80 C 500 80, 510 100, 545 100" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M 455 156 C 500 156, 510 120, 545 120" fill="none" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow2)"/>
  <text x="500" y="114" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#64748b">balance</text>

  <!-- Tarjeta Derecha: VOCE MISTA -->
  <rect x="555" y="35" width="285" height="150" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.8"/>
  <rect x="556" y="36" width="283" height="30" rx="7" fill="#f0fdf4"/>
  <text x="697" y="56" text-anchor="middle" font-family="'Cinzel', serif" font-weight="700" font-size="12.5" fill="#15803d">VOCE MISTA (VOZ MIXTA)</text>

  <text x="697" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#0f172a">Transición Neuromuscular Continua</text>
  <text x="697" y="110" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#475569">
    <tspan x="697" dy="0">El CT asume la tensión mientras el TA</tspan>
    <tspan x="697" dy="16">cede masa gradualmente sin soltar aducción.</tspan>
  </text>
  <line x1="580" y1="140" x2="815" y2="140" stroke="#bbf7d0" stroke-width="1"/>
  <text x="697" y="162" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11.5" fill="#15803d">Passaggio homogéneo sin quiebre acústico</text>
</svg>