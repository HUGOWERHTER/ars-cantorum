<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="910" height="36" rx="6" fill="#0f172a"/>
  <text x="470" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">ANATOMÍA DEL ATAQUE VOCAL: COMPARATIVA BIOMECÁNICA</text>

  <!-- PANEL 1: ATAQUE SOPLADO -->
  <rect x="15" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="16" y="57" width="288" height="32" rx="7" fill="#f8fafc"/>
  <text x="160" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#334155">1. Ataque Soplado (Aspirado)</text>

  <g transform="translate(25, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <ellipse cx="135" cy="40" rx="40" ry="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 105 40 Q 135 24 165 40" stroke="#94a3b8" stroke-width="4" fill="none"/>
    <path d="M 105 40 Q 135 56 165 40" stroke="#94a3b8" stroke-width="4" fill="none"/>
    <!-- Fuga aire -->
    <path d="M 125 15 L 125 30 M 135 10 L 135 30 M 145 15 L 145 30" stroke="#38bdf8" stroke-width="1.8" stroke-dasharray="2,2"/>
    <text x="135" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#64748b">Escape de aire previo (/h/)</text>
    <text x="135" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#94a3b8">Glotis incompleta al iniciar fonación</text>
  </g>

  <g transform="translate(25, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#334155">Falta de Aducción Firme</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#475569">
      <tspan x="135" dy="0">El aire escapa antes del tono:</tspan>
      <tspan x="135" dy="16">desperdicio aéreo masivo</tspan>
      <tspan x="135" dy="16">que deja la voz velada y sin brillo.</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#cbd5e1" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#475569">
      <tspan x="135" dy="0" font-weight="700" fill="#334155">Consecuencias:</tspan>
      <tspan x="135" dy="15">• Voz velada y sin núcleo tímbrico</tspan>
      <tspan x="135" dy="15">• Fatiga prematura por gasto de aire</tspan>
      <tspan x="135" dy="15">• Imposibilidad de clarificar el squillo</tspan>
    </text>
  </g>

  <!-- PANEL 2: CHOQUE GLOTICO -->
  <rect x="325" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.3"/>
  <rect x="326" y="57" width="288" height="32" rx="7" fill="#fef2f2"/>
  <text x="470" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#b91c1c">2. Choque Glótico Violento (Trauma)</text>

  <g transform="translate(335, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <ellipse cx="135" cy="40" rx="40" ry="24" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/>
    <line x1="100" y1="40" x2="170" y2="40" stroke="#dc2626" stroke-width="7"/>
    <path d="M 120 25 L 128 35 M 150 25 L 142 35 M 120 55 L 128 45 M 150 55 L 142 45" stroke="#b91c1c" stroke-width="1.8"/>
    <text x="135" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#dc2626">Hiperaducción espasmódica</text>
    <text x="135" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#b91c1c">Colisión destructiva entre cuerdas</text>
  </g>

  <g transform="translate(335, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">Explosión Acústica Percusiva</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">
      <tspan x="135" dy="0">El malentendido histórico:</tspan>
      <tspan x="135" dy="16">un golpe violento que lacera</tspan>
      <tspan x="135" dy="16">el epitelio cordal y crea nódulos.</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#fecaca" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">
      <tspan x="135" dy="0" font-weight="700" fill="#b91c1c">Peligro Clínico:</tspan>
      <tspan x="135" dy="15">• Impacto fonotraumático severo</tspan>
      <tspan x="135" dy="15">• Riesgo de edema y pólipos</tspan>
      <tspan x="135" dy="15">• Rigidez inmediata en el passaggio</tspan>
    </text>
  </g>

  <!-- PANEL 3: COUP DE GLOTTE GARCIA -->
  <rect x="635" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="636" y="57" width="288" height="32" rx="7" fill="#f0fdf4"/>
  <text x="780" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#15803d">3. Coup de Glotte de García (Simultáneo)</text>

  <g transform="translate(645, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <ellipse cx="135" cy="40" rx="40" ry="24" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
    <line x1="104" y1="40" x2="166" y2="40" stroke="#16a34a" stroke-width="4.5"/>
    <text x="135" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#15803d">Contacto elástico y exacto</text>
    <text x="135" y="98" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#166534">Cierre simultáneo con el soplo aéreo</text>
  </g>

  <g transform="translate(645, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#f0fdf4" stroke="#dcfce7"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803d">Fonación de Flujo Inmediata</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#14532d">
      <tspan x="135" dy="0">El verdadero espíritu de García:</tspan>
      <tspan x="135" dy="16">un pizzicato vocal limpio,</tspan>
      <tspan x="135" dy="16">cero aire residual y máxima pureza.</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#bbf7d0" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">
      <tspan x="135" dy="0" font-weight="700" fill="#15803d">Beneficios Vocales:</tspan>
      <tspan x="135" dy="15">• Tono brillante e instantáneo</tspan>
      <tspan x="135" dy="15">• Máximo rendimiento energético</tspan>
      <tspan x="135" dy="15" font-weight="600" fill="#166534">• Salud y longevidad laríngea</tspan>
    </text>
  </g>
</svg>