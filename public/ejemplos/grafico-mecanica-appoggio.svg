<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <!-- Barra de Título -->
  <rect x="10" y="8" width="880" height="36" rx="6" fill="#0f172a"/>
  <text x="450" y="31" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">BIOMECÁNICA DEL APPOGGIO: EQUILIBRIO ANTAGÓNICO vs. MÉTODOS DEFECTUOSOS</text>

  <!-- ==================== PANEL 1: EMPUJE VALSALVA ==================== -->
  <rect x="15" y="54" width="275" height="240" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
  <rect x="16" y="55" width="273" height="32" rx="7" fill="#fef2f2"/>
  <text x="152" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">1. Empuje Inferior (Maniobra Valsalva)</text>

  <!-- Ilustración Valsalva -->
  <g transform="translate(45, 95)">
    <!-- Silueta Torso -->
    <path d="M 30 10 L 30 80 Q 30 100 70 100 Q 110 100 110 80 L 110 10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Abdomen abultado hacia abajo/afuera forzado -->
    <path d="M 40 45 Q 20 70 40 85" stroke="#ef4444" stroke-width="3" fill="none"/>
    <!-- Flechas empuje hacia abajo/suelo pélvico -->
    <path d="M 70 50 L 70 85 M 65 77 L 70 85 L 75 77" stroke="#dc2626" stroke-width="2.2" fill="none"/>
    <text x="135" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">• Empujar hacia el suelo pélvico</text>
    <text x="135" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">• Hipertensión abdominal</text>
    <text x="135" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">• Constricción laríngea refleja</text>
  </g>
  <rect x="25" y="185" width="255" height="95" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="152" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">Riesgo Fonotraumático</text>
  <text x="152" y="223" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">Sobrecarga y rigidez cordal</text>
  <text x="152" y="243" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">La laringe se bloquea para frenar la presión</text>
  <text x="152" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">Pérdida de afinación y fatiga inmediata</text>

  <!-- ==================== PANEL 2: ABDOMINAL TUCK-IN ==================== -->
  <rect x="305" y="54" width="285" height="240" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="306" y="55" width="283" height="32" rx="7" fill="#fffbeb"/>
  <text x="448" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b45309">2. Metida de Ombligo (Abdominal Tuck)</text>

  <!-- Ilustración Tuck-in -->
  <g transform="translate(335, 95)">
    <!-- Silueta Torso -->
    <path d="M 30 10 L 30 80 Q 30 100 70 100 Q 110 100 110 80 L 110 10" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Vientre hundido bruscamente -->
    <path d="M 40 40 Q 65 65 40 90" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <!-- Flechas empuje hacia arriba descontrolado -->
    <path d="M 70 80 L 70 35 M 65 43 L 70 35 L 75 43" stroke="#d97706" stroke-width="2.2" fill="none"/>
    <text x="135" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Meter ombligo con fuerza</text>
    <text x="135" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Diafragma expulsado arriba</text>
    <text x="135" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Vencimiento del tórax</text>
  </g>
  <rect x="315" y="185" width="265" height="95" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="448" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#92400e">Desperdicio Aéreo Incontrolado</text>
  <text x="448" y="223" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#78350f">Agotamiento prematuro del aliento</text>
  <text x="448" y="243" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">El aire sale en tromba sin freno inspiratorio</text>
  <text x="448" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">Imposibilidad de sostener frases largas de legato</text>

  <!-- ==================== PANEL 3: EL APPOGGIO CANÓNICO ==================== -->
  <rect x="605" y="54" width="280" height="240" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="606" y="55" width="278" height="32" rx="7" fill="#f0fdf4"/>
  <text x="745" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#15803d">3. El Appoggio Italiano (Equilibrio)</text>

  <!-- Ilustración Appoggio -->
  <g transform="translate(635, 95)">
    <!-- Silueta Torso Noble y Abierto -->
    <path d="M 25 10 L 25 80 Q 25 100 70 100 Q 115 100 115 80 L 115 10" fill="none" stroke="#16a34a" stroke-width="1.8"/>
    <!-- Costillas expandidas lateralmente -->
    <path d="M 15 35 L 25 35 M 115 35 L 125 35" stroke="#15803d" stroke-width="2.5"/>
    <!-- Diafragma en contención elástica (arco suave) -->
    <path d="M 30 45 Q 70 65 110 45" stroke="#16a34a" stroke-width="3" fill="none"/>
    <!-- Fuerzas antagónicas equilibradas -->
    <path d="M 70 45 L 70 60 M 70 75 L 70 60" stroke="#15803d" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="135" y="35" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Costillas abiertas (intercostales)</text>
    <text x="135" y="50" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Tono inspiratorio residual</text>
    <text x="135" y="65" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Epigastrio elástico y flexible</text>
  </g>
  <rect x="615" y="185" width="260" height="95" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="745" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803d">Inhalare la Voce</text>
  <text x="745" y="223" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#14532d">Presión subglótica milimétrica</text>
  <text x="745" y="243" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">El aire no se empuja; se sostiene con serenidad</text>
  <text x="745" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#15803d">Legato infinito, flexibilidad y messa di voce</text>
</svg>