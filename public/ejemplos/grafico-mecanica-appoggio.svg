<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="910" height="36" rx="6" fill="#0f172a"/>
  <text x="470" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">BIOMECÁNICA DEL APPOGGIO: EQUILIBRIO ANTAGÓNICO vs. MÉTODOS DEFECTUOSOS</text>

  <!-- PANEL 1: VALSALVA -->
  <rect x="15" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.3"/>
  <rect x="16" y="57" width="288" height="32" rx="7" fill="#fef2f2"/>
  <text x="160" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#b91c1c">1. Empuje Inferior (Valsalva)</text>

  <g transform="translate(25, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <path d="M 25 15 L 25 75 Q 25 95 65 95 Q 105 95 105 75 L 105 15" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 35 45 Q 15 70 35 85" stroke="#ef4444" stroke-width="3" fill="none"/>
    <path d="M 65 50 L 65 85 M 60 77 L 65 85 L 70 77" stroke="#dc2626" stroke-width="2.2" fill="none"/>
    <text x="120" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">• Empuje al suelo pélvico</text>
    <text x="120" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">• Hipertensión abdominal</text>
    <text x="120" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">• Constricción laríngea refleja</text>
    <text x="120" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">• Cierre de bandas ventriculares</text>
    <text x="120" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#b91c1c">• Fonotrauma acumulativo</text>
  </g>

  <g transform="translate(25, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">Riesgo Fonotraumático</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">
      <tspan x="135" dy="0">Sobrecarga y rigidez cordal:</tspan>
      <tspan x="135" dy="16">la laringe se bloquea</tspan>
      <tspan x="135" dy="16">para frenar la presión.</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#fecaca" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">
      <tspan x="135" dy="0" font-weight="700" fill="#b91c1c">Efectos Crónicos:</tspan>
      <tspan x="135" dy="15">• Pérdida inmediata de afinación</tspan>
      <tspan x="135" dy="15">• Fatiga muscular prematura</tspan>
      <tspan x="135" dy="15">• Rigidez en el sobreagudo</tspan>
    </text>
  </g>

  <!-- PANEL 2: ABDOMINAL TUCK -->
  <rect x="325" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/>
  <rect x="326" y="57" width="288" height="32" rx="7" fill="#fffbeb"/>
  <text x="470" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#b45309">2. Metida de Ombligo (Tuck-In)</text>

  <g transform="translate(335, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <path d="M 25 15 L 25 75 Q 25 95 65 95 Q 105 95 105 75 L 105 15" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 35 40 Q 60 65 35 90" stroke="#f59e0b" stroke-width="3" fill="none"/>
    <path d="M 65 80 L 65 35 M 60 43 L 65 35 L 70 43" stroke="#d97706" stroke-width="2.2" fill="none"/>
    <text x="120" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Hundir ombligo con fuerza</text>
    <text x="120" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Diafragma expulsado arriba</text>
    <text x="120" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Colapso del fuelle costal</text>
    <text x="120" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Salida descontrolada del aire</text>
    <text x="120" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#b45309">• Falta de contención elástica</text>
  </g>

  <g transform="translate(335, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#fffbeb" stroke="#fef3c7"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#92400e">Desperdicio Aéreo Prematuro</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#78350f">
      <tspan x="135" dy="0">El aire escapa en tromba:</tspan>
      <tspan x="135" dy="16">sin freno inspiratorio antagónico,</tspan>
      <tspan x="135" dy="16">el aliento se agota de inmediato.</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#fde68a" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#78350f">
      <tspan x="135" dy="0" font-weight="700" fill="#b45309">Efectos Crónicos:</tspan>
      <tspan x="135" dy="15">• Imposibilidad de frases largas</tspan>
      <tspan x="135" dy="15">• Quiebre del legato belcantista</tspan>
      <tspan x="135" dy="15">• Fraseo jadeante y entrecortado</tspan>
    </text>
  </g>

  <!-- PANEL 3: APPOGGIO CANONICO -->
  <rect x="635" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="636" y="57" width="288" height="32" rx="7" fill="#f0fdf4"/>
  <text x="780" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#15803d">3. El Appoggio Italiano (Equilibrio)</text>

  <g transform="translate(645, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <path d="M 20 15 L 20 75 Q 20 95 60 95 Q 100 95 100 75 L 100 15" fill="none" stroke="#16a34a" stroke-width="1.8"/>
    <path d="M 12 35 L 20 35 M 100 35 L 108 35" stroke="#15803d" stroke-width="2.5"/>
    <path d="M 25 45 Q 60 65 95 45" stroke="#16a34a" stroke-width="3" fill="none"/>
    <path d="M 60 45 L 60 60 M 60 75 L 60 60" stroke="#15803d" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="115" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Costillas en expansión noble</text>
    <text x="115" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Tono inspiratorio del diafragma</text>
    <text x="115" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Epigastrio elástico y receptivo</text>
    <text x="115" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Equilibrio entre inhalar y cantar</text>
    <text x="115" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#15803d">• Presión subglótica milimétrica</text>
  </g>

  <g transform="translate(645, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#f0fdf4" stroke="#dcfce7"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803d">Inhalare la Voce</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#14532d">
      <tspan x="135" dy="0">"El aire no se empuja jamás:</tspan>
      <tspan x="135" dy="16">se retiene con serena calma,</tspan>
      <tspan x="135" dy="16">como bebiendo el sonido con el alma."</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#bbf7d0" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">
      <tspan x="135" dy="0" font-weight="700" fill="#15803d">Logros Técnicos Supremos:</tspan>
      <tspan x="135" dy="15">• Legato infinito y homogéneo</tspan>
      <tspan x="135" dy="15">• Messa di voce impecable</tspan>
      <tspan x="135" dy="15" font-weight="600" fill="#166534">• Libertad absoluta en la garganta</tspan>
    </text>
  </g>
</svg>