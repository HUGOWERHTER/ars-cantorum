<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Biomecánica del Appoggio: equilibrio antagónico frente a Valsalva y metida de ombligo">
  <defs>
    <style>
      .title { font-family: 'Cinzel', Georgia, serif; font-size: 19px; font-weight: 700; fill: #1C1B19; letter-spacing: 0.6px; }
      .subtitle { font-family: 'Newsreader', Georgia, serif; font-size: 13px; font-style: italic; fill: #1C1B19; opacity: 0.78; }
      .plate-num { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.8px; fill: #881337; text-transform: uppercase; }
      .sec-head { font-family: 'Cinzel', Georgia, serif; font-size: 13px; font-weight: 700; fill: #1C1B19; letter-spacing: 0.4px; }
      .sec-head-acc { font-family: 'Cinzel', Georgia, serif; font-size: 13px; font-weight: 700; fill: #881337; letter-spacing: 0.4px; }
      .lbl { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; fill: #1C1B19; }
      .lbl-b { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; font-weight: 700; fill: #1C1B19; }
      .lbl-acc { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; font-weight: 700; fill: #881337; }
      .lbl-sm { font-family: 'Newsreader', Georgia, serif; font-size: 11px; fill: #1C1B19; opacity: 0.85; }
      .mag { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 600; fill: #1C1B19; }
      .mag-acc { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 700; fill: #881337; }
      .mag-muted { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9.5px; fill: #1C1B19; opacity: 0.65; }
      .caption { font-family: 'Newsreader', Georgia, serif; font-size: 11.5px; fill: #1C1B19; opacity: 0.86; }
      .caption-b { font-family: 'Newsreader', Georgia, serif; font-size: 11.5px; font-weight: 700; fill: #1C1B19; }
      .hair { stroke: #1C1B19; stroke-width: 1; fill: none; }
      .hair-light { stroke: #1C1B19; stroke-width: 0.7; stroke-opacity: 0.35; fill: none; }
      .hair-dash { stroke: #1C1B19; stroke-width: 1.1; stroke-dasharray: 4 3; fill: none; }
      .ink-line { stroke: #1C1B19; stroke-width: 1.4; fill: none; }
      .acc-line { stroke: #881337; stroke-width: 1.8; fill: none; }
      .acc-dash { stroke: #881337; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
      .leader { stroke: #1C1B19; stroke-width: 0.85; stroke-opacity: 0.65; fill: none; }
    </style>
    <pattern id="hatch-ink" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.22"/>
    </pattern>
    <pattern id="hatch-acc" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.8" stroke-opacity="0.24"/>
    </pattern>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#1C1B19"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#881337"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#FAF8F5"/>
  <rect x="12" y="12" width="856" height="476" fill="none" stroke="#DCD6CD" stroke-width="1"/>
  <text x="36" y="42" class="plate-num">LÁMINA XIX · BIOMECÁNICA RESPIRATORIA</text>
  <text x="36" y="66" class="title">Tres Modelos de Presión Subglótica Frente al Appoggio</text>
  <text x="36" y="85" class="subtitle">Coordinación antagónica costo-diafragmática frente al empuje pélvico (Valsalva) y el colapso abdominal</text>
  <line x1="36" y1="98" x2="844" y2="98" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Column 1: Valsalva -->
  <g transform="translate(36, 118)">
    <rect x="0" y="0" width="256" height="320" fill="none" stroke="#DCD6CD" stroke-width="0.9"/>
    <text x="128" y="24" text-anchor="middle" class="sec-head">1. MANIOBRA DE VALSALVA</text>
    <text x="128" y="41" text-anchor="middle" class="lbl-sm">(Empuje violento hacia abajo)</text>
    <!-- Schematic ribcage & diaphragm -->
    <path d="M 76,82 C 62,120 62,175 76,205" class="ink-line"/>
    <path d="M 180,82 C 194,120 194,175 180,205" class="ink-line"/>
    <!-- Constricted larynx -->
    <rect x="114" y="62" width="28" height="14" fill="url(#hatch-ink)" stroke="#1C1B19" stroke-width="1.2"/>
    <text x="128" y="57" text-anchor="middle" class="mag-muted">Falsas cuerdas cerradas</text>
    <!-- Flat/locked diaphragm -->
    <path d="M 76,178 Q 128,174 180,178" class="ink-line"/>
    <!-- Downward force vectors -->
    <line x1="108" y1="186" x2="108" y2="236" class="ink-line" marker-end="url(#arr-ink)"/>
    <line x1="148" y1="186" x2="148" y2="236" class="ink-line" marker-end="url(#arr-ink)"/>
    <text x="128" y="258" text-anchor="middle" class="lbl-b">Hiperpresión pélvica</text>
    <text x="128" y="278" text-anchor="middle" class="lbl-sm">Bloqueo faríngeo y sonido</text>
    <text x="128" y="294" text-anchor="middle" class="lbl-sm">apretado y metálico.</text>
  </g>

  <!-- Column 2: Appoggio Canónico (highlighted) -->
  <g transform="translate(312, 118)">
    <rect x="0" y="0" width="256" height="320" fill="none" stroke="#881337" stroke-width="1.4"/>
    <rect x="0" y="0" width="256" height="50" fill="url(#hatch-acc)"/>
    <text x="128" y="24" text-anchor="middle" class="sec-head-acc">2. APPOGGIO CANÓNICO</text>
    <text x="128" y="41" text-anchor="middle" class="lbl-acc">(Equilibrio muscular antagónico)</text>
    <!-- Expanded ribcage -->
    <path d="M 72,82 C 52,120 52,175 72,208" class="acc-line"/>
    <path d="M 184,82 C 204,120 204,175 184,208" class="acc-line"/>
    <!-- Free larynx -->
    <ellipse cx="128" cy="69" rx="14" ry="7" fill="none" stroke="#881337" stroke-width="1.4"/>
    <text x="128" y="57" text-anchor="middle" class="mag-acc">Laringe neutra y libre</text>
    <!-- Elastic domed diaphragm -->
    <path d="M 72,172 Q 128,142 184,172" class="acc-line"/>
    <!-- Outward inspiratory brake arrows (intercostals) -->
    <line x1="60" y1="140" x2="34" y2="140" class="hair-dash" marker-end="url(#arr-ink)"/>
    <line x1="196" y1="140" x2="222" y2="140" class="hair-dash" marker-end="url(#arr-ink)"/>
    <text x="22" y="128" class="mag-muted">Freno</text>
    <text x="206" y="128" class="mag-muted">Freno</text>
    <!-- Slow regulated upward transversus vector -->
    <line x1="128" y1="238" x2="128" y2="170" class="acc-line" marker-end="url(#arr-acc)"/>
    <text x="128" y="258" text-anchor="middle" class="lbl-acc">Motor espiratorio regulado</text>
    <text x="128" y="278" text-anchor="middle" class="lbl-sm">Transverso ↑ vs. intercostales ↔</text>
    <text x="128" y="294" text-anchor="middle" class="lbl-sm">Presión subglótica estable.</text>
  </g>

  <!-- Column 3: Abdominal Tuck-in -->
  <g transform="translate(588, 118)">
    <rect x="0" y="0" width="256" height="320" fill="none" stroke="#DCD6CD" stroke-width="0.9"/>
    <text x="128" y="24" text-anchor="middle" class="sec-head">3. METIDA DE OMBLIGO</text>
    <text x="128" y="41" text-anchor="middle" class="lbl-sm">(Abdominal tuck-in)</text>
    <!-- Collapsing ribcage -->
    <path d="M 86,82 C 88,125 90,175 94,205" class="hair-dash"/>
    <path d="M 170,82 C 168,125 166,175 162,205" class="hair-dash"/>
    <!-- Inward collapse arrows -->
    <line x1="62" y1="148" x2="86" y2="148" class="ink-line" marker-end="url(#arr-ink)"/>
    <line x1="194" y1="148" x2="170" y2="148" class="ink-line" marker-end="url(#arr-ink)"/>
    <!-- Diaphragm catapulted up -->
    <path d="M 94,158 Q 128,118 162,158" class="ink-line"/>
    <line x1="128" y1="226" x2="128" y2="144" class="ink-line" marker-end="url(#arr-ink)"/>
    <text x="128" y="57" text-anchor="middle" class="mag-muted">Glotis frena el escape</text>
    <text x="128" y="258" text-anchor="middle" class="lbl-b">Colapso costal rápido</text>
    <text x="128" y="278" text-anchor="middle" class="lbl-sm">Diafragma catapultado arriba;</text>
    <text x="128" y="294" text-anchor="middle" class="lbl-sm">pérdida súbita de aliento.</text>
  </g>

  <line x1="36" y1="456" x2="844" y2="456" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="474" class="caption-b">Lectura biomecánica:</text>
  <text x="174" y="474" class="caption">El appoggio retiene elásticamente la postura inspiratoria mientras el transverso entrega un flujo dosificado (Vennard; Chapman).</text>
</svg>