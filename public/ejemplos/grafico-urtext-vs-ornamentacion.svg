<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchUrtext" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.9" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — ARQUITECTURA DEL DA CAPO: LITERALISMO URTEXT vs. CO-CREACIÓN</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Evolución retórica de una frase belcantista entre la primera exposición (A) y su retorno variado (A')</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- FILA SUPERIOR: LITERALISMO URTEXT (A = A) -->
  <text x="48" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#57534E" letter-spacing="0.06em">I. PRÁCTICA LITERALISTA MODERNA (REPETICIÓN IDÉNTICA)</text>
  <g stroke="#1C1B19" stroke-opacity="0.22" stroke-width="0.8">
    <line x1="48" y1="122" x2="832" y2="122"/><line x1="48" y1="130" x2="832" y2="130"/><line x1="48" y1="138" x2="832" y2="138"/><line x1="48" y1="146" x2="832" y2="146"/><line x1="48" y1="154" x2="832" y2="154"/>
    <line x1="305" y1="116" x2="305" y2="160" stroke-opacity="0.45"/><line x1="560" y1="116" x2="560" y2="160" stroke-opacity="0.45"/>
  </g>
  <!-- Contorno melódico idéntico en A y A -->
  <path d="M 70,146 L 140,130 L 210,138 L 280,146" fill="none" stroke="#1C1B19" stroke-width="1.6"/>
  <path d="M 330,138 L 410,122 L 480,130 L 540,138" fill="none" stroke="#1C1B19" stroke-width="1.2" stroke-dasharray="4,3"/>
  <path d="M 585,146 L 655,130 L 725,138 L 795,146" fill="none" stroke="#1C1B19" stroke-width="1.6" stroke-dasharray="5,3"/>
  <text x="175" y="176" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" fill="#1C1B19">A · Tema original</text>
  <text x="432" y="176" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="11.5" fill="#57534E">B · Sección contrastante</text>
  <text x="690" y="176" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" fill="#57534E">A · Repetición literal sin afecto nuevo</text>

  <!-- FILA INFERIOR: PRAXIS BELCANTISTA (A -> B -> A' VARIADO) -->
  <text x="48" y="216" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#881337" letter-spacing="0.06em">II. PRAXIS HISTÓRICA DEL BEL CANTO (TOSI · MANCINI · CORRI · ROSSINI)</text>
  <g stroke="#1C1B19" stroke-opacity="0.22" stroke-width="0.8">
    <line x1="48" y1="234" x2="832" y2="234"/><line x1="48" y1="242" x2="832" y2="242"/><line x1="48" y1="250" x2="832" y2="250"/><line x1="48" y1="258" x2="832" y2="258"/><line x1="48" y1="266" x2="832" y2="266"/>
    <line x1="305" y1="228" x2="305" y2="272" stroke-opacity="0.45"/><line x1="560" y1="228" x2="560" y2="272" stroke-opacity="0.45"/>
  </g>
  <rect x="560" y="226" width="272" height="50" fill="url(#hatchUrtext)"/>
  <!-- A puro -->
  <path d="M 70,258 L 140,242 L 210,250 L 280,258" fill="none" stroke="#1C1B19" stroke-width="1.6"/>
  <!-- B con messa di voce y apoyaturas -->
  <path d="M 330,250 Q 370,232 410,234 Q 450,238 485,242 L 540,250" fill="none" stroke="#1C1B19" stroke-width="1.4"/>
  <!-- A' ornamentado sobre la estructura armónica (burdeos) -->
  <path d="M 585,258 L 655,242 L 725,250 L 795,258" fill="none" stroke="#1C1B19" stroke-width="0.9" stroke-dasharray="2,3" stroke-opacity="0.45"/>
  <path d="M 585,258 C 610,232 635,252 655,234 C 675,218 700,254 725,238 C 750,224 770,268 795,258" fill="none" stroke="#881337" stroke-width="2"/>
  <circle cx="655" cy="234" r="3" fill="#881337"/><circle cx="725" cy="238" r="3" fill="#881337"/><circle cx="795" cy="258" r="3" fill="#881337"/>

  <!-- Leader lines -->
  <line x1="175" y1="264" x2="175" y2="294" stroke="#1C1B19" stroke-width="0.8"/>
  <text x="175" y="308" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="600" fill="#1C1B19">Exposición fiel</text>
  <text x="175" y="322" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">El oído fija la melodía original</text>

  <line x1="432" y1="246" x2="432" y2="294" stroke="#1C1B19" stroke-width="0.8"/>
  <text x="432" y="308" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="600" fill="#1C1B19">Inflexión prosódica</text>
  <text x="432" y="322" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Apoyaturas y messa di voce</text>

  <line x1="705" y1="240" x2="705" y2="294" stroke="#881337" stroke-width="0.9"/>
  <text x="705" y="308" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="700" fill="#881337">A' · Variación con discrezione</text>
  <text x="705" y="322" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Divisiones y cadencia in un fiato</text>

  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura estilística:</tspan> La partitura belcantista fija el esqueleto armónico (línea punteada en A'), pero espera que el cantante
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    intensifique el afecto dramático en la repetición (curva burdeos) sin destruir la métrica ni el equilibrio armónico.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · ESTRUCTURA RETÓRICA DEL DA CAPO (TOSI 1723 · GOSSETT 2006)</text>
</svg>
