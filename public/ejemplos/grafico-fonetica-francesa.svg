<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="910" height="36" rx="6" fill="#0f172a"/>
  <text x="470" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">FONÉTICA Y LÍNEA EN EL REPERTORIO FRANCÉS: EL ARTE DEL LEGATO</text>

  <!-- PANEL 1: NASALIDAD BRUTA -->
  <rect x="15" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.3"/>
  <rect x="16" y="57" width="288" height="32" rx="7" fill="#fef2f2"/>
  <text x="160" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#b91c1c">1. El Vicio: Nasalidad Gangosa</text>

  <g transform="translate(25, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <path d="M 20 40 L 50 40 L 65 48 M 20 65 L 50 65 L 65 56" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <path d="M 35 35 Q 30 55 25 60" stroke="#ef4444" stroke-width="3" fill="none"/>
    <path d="M 35 25 L 75 20 M 68 15 L 75 20 L 70 26" stroke="#dc2626" stroke-width="2" fill="none"/>
    <text x="95" y="28" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">• Todo el aire escapa por nariz</text>
    <text x="95" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">• Faringe colapsada por dentro</text>
    <text x="95" y="64" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">• Quiebre del legato vocal</text>
    <text x="95" y="82" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">• Sonido estridente y sordo</text>
    <text x="95" y="100" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#b91c1c">• Tendencia constante a calar</text>
  </g>

  <g transform="translate(25, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">Sonido Desagradable y Pobre</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">
      <tspan x="135" dy="0">La trampa del principiante:</tspan>
      <tspan x="135" dy="16">confundir resonancia francesa</tspan>
      <tspan x="135" dy="16">con emisión nasal deprimente.</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#fecaca" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">
      <tspan x="135" dy="0" font-weight="700" fill="#b91c1c">Efectos Crónicos:</tspan>
      <tspan x="135" dy="15">• Asfixia de los armónicos agudos</tspan>
      <tspan x="135" dy="15">• Pérdida de foco y timbre noble</tspan>
      <tspan x="135" dy="15">• Inestabilidad de afinación</tspan>
    </text>
  </g>

  <!-- PANEL 2: LAS 4 VOCALES NOBLES -->
  <rect x="325" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="326" y="57" width="288" height="32" rx="7" fill="#f0f9ff"/>
  <text x="470" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#0369a1">2. Las 4 Vocales Nasales Nobles</text>

  <g transform="translate(335, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <!-- Matriz 2x2 -->
    <rect x="15" y="12" width="115" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="32" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0284c7">[ɑ̃]</text>
    <text x="60" y="36" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#334155">vent / sans</text>

    <rect x="140" y="12" width="115" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="157" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0284c7">[ɛ̃]</text>
    <text x="185" y="36" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#334155">vin / plein</text>

    <rect x="15" y="62" width="115" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="32" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0284c7">[ɔ̃]</text>
    <text x="60" y="86" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#334155">bon / ombre</text>

    <rect x="140" y="62" width="115" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="157" y="88" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="700" fill="#0284c7">[œ̃]</text>
    <text x="185" y="86" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#334155">un / parfum</text>
  </g>

  <g transform="translate(335, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0369a1">La Regla de Bernac y Grubb</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#0c4a6e">
      <tspan x="135" dy="0">"Una vocal puramente oral</tspan>
      <tspan x="135" dy="16">apenas aromatizada por el velo:</tspan>
      <tspan x="135" dy="16">el 80% resuena en la boca."</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#bae6fd" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">
      <tspan x="135" dy="0" font-weight="700" fill="#0284c7">Técnica Fono-Articulatoria:</tspan>
      <tspan x="135" dy="15">• Solo un toque aromático nasal</tspan>
      <tspan x="135" dy="15">• Faringe abierta y distendida</tspan>
      <tspan x="135" dy="15" font-weight="600" fill="#0369a1">• Dicción aristocrática y pura</tspan>
    </text>
  </g>

  <!-- PANEL 3: ENCHAINEMENT Y LIAISON -->
  <rect x="635" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.4"/>
  <rect x="636" y="57" width="288" height="32" rx="7" fill="#f0fdf4"/>
  <text x="780" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#15803d">3. La Línea Continua (Legatissimo)</text>

  <g transform="translate(645, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <rect x="15" y="15" width="240" height="34" rx="5" fill="#ffffff" stroke="#86efac"/>
    <text x="135" y="37" text-anchor="middle" font-family="'Newsreader', serif" font-size="13" font-style="italic" fill="#166534">"Un grand oiseau"</text>
    
    <path d="M 50 65 Q 135 85 220 65" stroke="#15803d" stroke-width="2" fill="none"/>
    <text x="135" y="90" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#15803d">[ œ̃ — grɑ̃ — twa — zo ]</text>
    <text x="135" y="106" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#166534">Ligadura silábica consonante-vocal</text>
  </g>

  <g transform="translate(645, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#f0fdf4" stroke="#dcfce7"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803d">La Consonante Lanza la Vocal</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#14532d">
      <tspan x="135" dy="0">Sin rupturas en la columna de aire:</tspan>
      <tspan x="135" dy="16">la consonante final se proyecta</tspan>
      <tspan x="135" dy="16">en la vocal subsiguiente.</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#bbf7d0" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">
      <tspan x="135" dy="0" font-weight="700" fill="#15803d">Criterio Estético Supremo:</tspan>
      <tspan x="135" dy="15">• La melodía no se detiene jamás</tspan>
      <tspan x="135" dy="15">• La palabra sirve a la música</tspan>
      <tspan x="135" dy="15" font-weight="600" fill="#166534">• Fusión perfecta de poesía y canto</tspan>
    </text>
  </g>
</svg>