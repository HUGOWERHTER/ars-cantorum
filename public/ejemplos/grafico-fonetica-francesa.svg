<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <!-- Barra de Título -->
  <rect x="10" y="8" width="880" height="36" rx="6" fill="#0f172a"/>
  <text x="450" y="31" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">FONÉTICA Y LÍNEA EN EL REPERTORIO FRANCÉS: EL ARTE DEL LEGATO</text>

  <!-- ==================== PANEL 1: EL ERROR DE LA NASALIDAD BRUTA ==================== -->
  <rect x="15" y="54" width="275" height="240" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
  <rect x="16" y="55" width="273" height="32" rx="7" fill="#fef2f2"/>
  <text x="152" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">1. El Vicio: Nasalidad Gangosa</text>

  <!-- Esquema Velo Caído y Boca Cerrada -->
  <g transform="translate(35, 95)">
    <!-- Boca casi cerrada -->
    <path d="M 30 40 L 60 40 L 75 48 M 30 65 L 60 65 L 75 56" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <!-- Velo completamente colapsado -->
    <path d="M 45 35 Q 40 55 35 60" stroke="#ef4444" stroke-width="3" fill="none"/>
    <!-- Flechas aire saliendo por la nariz en tromba -->
    <path d="M 45 25 L 85 20 M 78 15 L 85 20 L 80 26" stroke="#dc2626" stroke-width="2" fill="none"/>
    <text x="135" y="30" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">• Todo el aire escapa por nariz</text>
    <text x="135" y="45" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">• Faringe colapsada por dentro</text>
    <text x="135" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">• Quiebre total del legato</text>
  </g>
  <rect x="25" y="185" width="255" height="95" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="152" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">Sonido Desagradable y Sordo</text>
  <text x="152" y="223" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">La trampa del cantante extranjero</text>
  <text x="152" y="243" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">Pérdida de afinación (tendencia a calar)</text>
  <text x="152" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">La consonante nasal asfixia la resonancia</text>

  <!-- ==================== PANEL 2: LAS 4 VOCALES NASALES NOBLES ==================== -->
  <rect x="305" y="54" width="285" height="240" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="306" y="55" width="283" height="32" rx="7" fill="#f0f9ff"/>
  <text x="448" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0369a1">2. Las 4 Vocales Nasales Nobles</text>

  <!-- Cuadrante de las 4 nasales -->
  <g transform="translate(325, 95)">
    <!-- Tarjeta 1: [ɑ̃] -->
    <rect x="10" y="5" width="110" height="35" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="25" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0284c7">[ɑ̃]</text>
    <text x="50" y="24" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#334155">vent / sans</text>

    <!-- Tarjeta 2: [ɛ̃] -->
    <rect x="130" y="5" width="110" height="35" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="145" y="26" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0284c7">[ɛ̃]</text>
    <text x="170" y="24" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#334155">vin / plein</text>

    <!-- Tarjeta 3: [ɔ̃] -->
    <rect x="10" y="45" width="110" height="35" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="25" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0284c7">[ɔ̃]</text>
    <text x="50" y="64" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#334155">bon / ombre</text>

    <!-- Tarjeta 4: [œ̃] -->
    <rect x="130" y="45" width="110" height="35" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="145" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0284c7">[œ̃]</text>
    <text x="170" y="64" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#334155">un / parfum</text>
  </g>
  <rect x="315" y="185" width="265" height="95" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
  <text x="448" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0369a1">La Regla de Bernac y Grubb</text>
  <text x="448" y="223" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#0c4a6e">"Una vocal oral coloreada por el velo"</text>
  <text x="448" y="243" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0369a1">El 80% de la resonancia permanece en la boca</text>
  <text x="448" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#0284c7">Solo un toque aromático atraviesa la cavidad nasal</text>

  <!-- ==================== PANEL 3: EL ENCHAÎNEMENT Y LA LIAISON ==================== -->
  <rect x="605" y="54" width="280" height="240" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="606" y="55" width="278" height="32" rx="7" fill="#f0fdf4"/>
  <text x="745" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#15803d">3. La Línea Continua (Legatissimo)</text>

  <!-- Ilustración Silabación Ligada -->
  <g transform="translate(625, 95)">
    <!-- Texto en versos franceses: "Un grand oiseau" -> [œ̃ - grɑ̃ - twa - zo] -->
    <rect x="10" y="10" width="240" height="32" rx="5" fill="#ffffff" stroke="#86efac"/>
    <text x="130" y="30" text-anchor="middle" font-family="'Newsreader', serif" font-size="13" font-style="italic" fill="#166534">"Un grand oiseau"</text>
    
    <!-- Enchaînement silábico hacia la vocal -->
    <path d="M 60 48 Q 130 65 200 48" stroke="#15803d" stroke-width="2" fill="none"/>
    <text x="130" y="65" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#15803d">[ œ̃ — grɑ̃ — twa — zo ]</text>
  </g>
  <rect x="615" y="185" width="260" height="95" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="745" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803d">La Consonante Lanza la Vocal</text>
  <text x="745" y="223" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#14532d">Sin rupturas en la columna de aire</text>
  <text x="745" y="243" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">Las consonantes finales se apoyan en la siguiente sílaba</text>
  <text x="745" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#15803d">La melodía no se detiene jamás ante la palabra</text>
</svg>