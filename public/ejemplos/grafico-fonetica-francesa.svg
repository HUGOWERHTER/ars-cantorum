<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Fonética lírica francesa: proporción oral/nasal en vocales nasales y mecánica del legatissimo">
  <defs>
    <style>
      .title { font-family: 'Cinzel', Georgia, serif; font-size: 19px; font-weight: 700; fill: #1C1B19; letter-spacing: 0.6px; }
      .subtitle { font-family: 'Newsreader', Georgia, serif; font-size: 13px; font-style: italic; fill: #1C1B19; opacity: 0.78; }
      .plate-num { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.8px; fill: #881337; text-transform: uppercase; }
      .sec-head { font-family: 'Cinzel', Georgia, serif; font-size: 13px; font-weight: 700; fill: #1C1B19; letter-spacing: 0.4px; }
      .sec-head-acc { font-family: 'Cinzel', Georgia, serif; font-size: 13px; font-weight: 700; fill: #881337; letter-spacing: 0.4px; }
      .lbl { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; fill: #1C1B19; }
      .lbl-b { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; font-weight: 700; fill: #1C1B19; }
      .lbl-acc { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; font-weight: 700; fill: #881337; }
      .lbl-sm { font-family: 'Newsreader', Georgia, serif; font-size: 11px; fill: #1C1B19; opacity: 0.85; }
      .mag { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 600; fill: #1C1B19; }
      .mag-acc { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 700; fill: #881337; }
      .mag-muted { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9.5px; fill: #1C1B19; opacity: 0.65; }
      .caption { font-family: 'Newsreader', Georgia, serif; font-size: 11.5px; fill: #1C1B19; opacity: 0.86; }
      .caption-b { font-family: 'Newsreader', Georgia, serif; font-size: 11.5px; font-weight: 700; fill: #1C1B19; }
      .hair { stroke: #1C1B19; stroke-width: 1; fill: none; }
      .hair-light { stroke: #1C1B19; stroke-width: 0.7; stroke-opacity: 0.35; fill: none; }
      .hair-dash { stroke: #1C1B19; stroke-width: 1.1; stroke-dasharray: 4 3; fill: none; }
      .ink-line { stroke: #1C1B19; stroke-width: 1.4; fill: none; }
      .acc-line { stroke: #881337; stroke-width: 1.8; fill: none; }
      .acc-dash { stroke: #881337; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
      .leader { stroke: #1C1B19; stroke-width: 0.85; stroke-opacity: 0.65; fill: none; }
    </style>
    <pattern id="hatch-ink" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.22"/>
    </pattern>
    <pattern id="hatch-acc" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.8" stroke-opacity="0.24"/>
    </pattern>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#1C1B19"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#881337"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#FAF8F5"/>
  <rect x="12" y="12" width="856" height="476" fill="none" stroke="#DCD6CD" stroke-width="1"/>
  <text x="36" y="42" class="plate-num">LÁMINA XXIV · FONÉTICA LÍRICA Y LEGATISSIMO</text>
  <text x="36" y="66" class="title">Mélodie Francesa: Vocales Nasales y Enchaînement</text>
  <text x="36" y="85" class="subtitle">Equilibrio entre proyección orofaríngea (85%) y color nasal (15%) sobre línea continua</text>
  <line x1="36" y1="98" x2="844" y2="98" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Panel A: Oral vs Nasal Energy Split -->
  <text x="36" y="122" class="sec-head-acc">A. ANATOMÍA DE LAS 4 VOCALES NASALES ([ɑ̃], [ɛ̃], [ɔ̃], [œ̃])</text>
  <g transform="translate(36, 138)">
    <rect x="0" y="0" width="808" height="145" fill="none" stroke="#DCD6CD" stroke-width="0.9"/>

    <!-- Left sub-diagram: Correct (Grubb/Bernac) -->
    <text x="20" y="24" class="lbl-acc">1. Emisión Canónica (Vocal oral + color nasal)</text>
    <!-- Oral bar 85% -->
    <rect x="20" y="40" width="300" height="26" fill="url(#hatch-acc)" stroke="#881337" stroke-width="1.2"/>
    <text x="170" y="57" text-anchor="middle" class="mag-acc">85% Energía Oral (Faringe abierta · squillo)</text>
    <!-- Nasal bar 15% -->
    <rect x="320" y="40" width="54" height="26" fill="url(#hatch-ink)" stroke="#1C1B19" stroke-width="1"/>
    <text x="347" y="57" text-anchor="middle" class="mag">15%</text>
    <text x="20" y="88" class="lbl-sm">• Velo del paladar desciende apenas 1 mm (sin colapso)</text>
    <text x="20" y="106" class="lbl-sm">• Base vocálica oral intacta ([ɑ], [ɛ], [ɔ], [œ])</text>
    <text x="20" y="124" class="mag-acc">• Proyección intacta y afinación estable</text>

    <line x1="404" y1="14" x2="404" y2="132" class="hair-light"/>

    <!-- Right sub-diagram: Vicio (Nasalización) -->
    <text x="426" y="24" class="lbl-b">2. Vicio Habitual (Empuje nasal)</text>
    <rect x="426" y="40" width="120" height="26" fill="none" stroke="#1C1B19" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="486" y="57" text-anchor="middle" class="mag-muted">Oral cerrada</text>
    <rect x="546" y="40" width="234" height="26" fill="url(#hatch-ink)" stroke="#1C1B19" stroke-width="1.2"/>
    <text x="663" y="57" text-anchor="middle" class="mag">Exceso de flujo nasal (cornetes)</text>
    <text x="426" y="88" class="lbl-sm">• Mandíbula cerrada y lengua retraída</text>
    <text x="426" y="106" class="lbl-sm">• Pérdida de armónicos agudos en los cornetes</text>
    <text x="426" y="124" class="mag-muted">• Timbre gangoso y tendencia a calar (calatura)</text>
  </g>

  <!-- Panel B: Legatissimo & Enchaînement -->
  <text x="36" y="306" class="sec-head">B. MECÁNICA DEL LEGATISSIMO: ENCHAÎNEMENT Y LIAISON</text>
  <g transform="translate(36, 320)">
    <rect x="0" y="0" width="808" height="120" fill="none" stroke="#DCD6CD" stroke-width="0.9"/>

    <!-- Incorrect fragmented speech -->
    <text x="20" y="26" class="lbl-b">Silabeo fragmentado (error):</text>
    <rect x="235" y="12" width="110" height="22" fill="none" stroke="#1C1B19" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="290" y="27" text-anchor="middle" class="mag-muted">[a - vɛk]</text>
    <line x1="362" y1="10" x2="362" y2="36" stroke="#1C1B19" stroke-width="1.4"/>
    <rect x="380" y="12" width="80" height="22" fill="none" stroke="#1C1B19" stroke-width="1" stroke-dasharray="3 2"/>
    <text x="420" y="27" text-anchor="middle" class="mag-muted">[ɛl]</text>
    <text x="480" y="27" class="lbl-sm">Corte de flujo + ataque glótico</text>

    <!-- Correct Enchainement -->
    <text x="20" y="72" class="lbl-acc">Enchaînement («avec elle»):</text>
    <path d="M 235,68 L 560,68" class="acc-line" marker-end="url(#arr-acc)"/>
    <circle cx="260" cy="68" r="14" fill="#FAF8F5" stroke="#881337" stroke-width="1.2"/>
    <text x="260" y="72" text-anchor="middle" class="mag-acc">a</text>
    <circle cx="345" cy="68" r="16" fill="#FAF8F5" stroke="#881337" stroke-width="1.2"/>
    <text x="345" y="72" text-anchor="middle" class="mag-acc">vɛ</text>
    <circle cx="445" cy="68" r="18" fill="url(#hatch-acc)" stroke="#881337" stroke-width="1.4"/>
    <text x="445" y="72" text-anchor="middle" class="mag-acc">kɛl</text>
    <text x="576" y="72" class="lbl-sm">La [k] pasa a la sílaba siguiente</text>

    <text x="20" y="104" class="lbl-sm">Acento prosódico suave al final del grupo fónico · e caduque cantada como [œ] o [ə] ligera (Bernac; Grubb).</text>
  </g>

  <line x1="36" y1="456" x2="844" y2="456" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="474" class="caption-b">Lectura estilística:</text>
  <text x="156" y="474" class="caption">La vocal nasal francesa conserva la amplitud faríngea de su vocal oral base; el enchaînement evita fracturar la columna de aire.</text>
</svg>