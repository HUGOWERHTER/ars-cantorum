<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="890" height="36" rx="6" fill="#0f172a"/>
  <text x="460" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">EL PASSAGGIO EN EL CANTO: VOCE APERTA vs. COPERTURA (AGGIUSTAMENTO)</text>

  <!-- PANEL A: VOCE APERTA -->
  <rect x="15" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="16" y="57" width="433" height="32" rx="7" fill="#fef2f2"/>
  <text x="232" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">A) Voce Aperta (Voz Abierta y Desparramada)</text>

  <g transform="translate(28, 102)">
    <rect x="0" y="0" width="160" height="118" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="80" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Choque Formántico</text>
    <!-- Línea ascendente que choca con barrera horizontal -->
    <line x1="25" y1="36" x2="135" y2="36" stroke="#991b1b" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M 30 68 L 85 38 L 125 46" stroke="#dc2626" stroke-width="2.5" fill="none"/>
    <circle cx="85" cy="38" r="4" fill="#dc2626"/>
    <text x="80" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">F0 cruza F1 fijo</text>
    <text x="80" y="103" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#7f1d1d">Grito o quiebre glótico</text>

    <rect x="172" y="0" width="236" height="118" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="184" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Fisiología del Desajuste:</text>
    <text x="184" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Boca horizontal y plana ("A" abierta)</text>
    <text x="184" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Ascenso violento de la laringe</text>
    <text x="184" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Dominancia rígida del músculo TA</text>
    <text x="184" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Timbre estridente (voce sguaiata)</text>
    <text x="184" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#b91c1c">• Fatiga y daño cordal prematuro</text>
  </g>

  <g transform="translate(28, 232)">
    <rect x="0" y="0" width="408" height="180" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="204" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">Diagnóstico de Richard Miller</text>
    <text x="204" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">
      <tspan x="204" dy="0">"La voce aperta indica un desequilibrio general</tspan>
      <tspan x="204" dy="16">entre los factores de resonancia, especialmente</tspan>
      <tspan x="204" dy="16">en el registro medio-agudo y agudo."</tspan>
    </text>
    <line x1="35" y1="94" x2="373" y2="94" stroke="#fecaca" stroke-width="1"/>
    <text x="204" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">
      <tspan x="204" dy="0">Consecuencia Acústica:</tspan>
      <tspan x="204" dy="14" font-weight="700" fill="#b91c1c">Pérdida de armónicos superiores y techo vocal bajo</tspan>
    </text>
    <text x="204" y="154" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#991b1b">
      <tspan x="204" dy="0">Riesgo en el Passaggio</tspan>
      <tspan x="204" dy="14" font-weight="500" fill="#7f1d1d">Incapacidad de sostener la línea más allá de Fa4 / Fa#4</tspan>
    </text>
  </g>

  <!-- PANEL B: COPERTURA -->
  <rect x="470" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
  <rect x="471" y="57" width="433" height="32" rx="7" fill="#f0f9ff"/>
  <text x="687" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0369a1">B) Copertura / Aggiustamento (Cobertura Acústica)</text>

  <g transform="translate(483, 102)">
    <rect x="0" y="0" width="160" height="118" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="80" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Sintonía de Formantes</text>
    <path d="M 28 70 Q 80 56 132 34" stroke="#0284c7" stroke-width="2.5" fill="none"/>
    <path d="M 28 52 Q 80 42 132 28" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>
    <circle cx="132" cy="34" r="4" fill="#0284c7"/>
    <text x="80" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">A → O • E → Ö</text>
    <text x="80" y="103" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#0c4a6e">F1 acompaña al agudo</text>

    <rect x="172" y="0" width="236" height="118" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="184" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Biomecánica Funcional:</text>
    <text x="184" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Redondeo vocálico sutil (aggiustamento)</text>
    <text x="184" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Basculación libre del cartílago tiroides</text>
    <text x="184" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Transición gradual de masa TA → CT</text>
    <text x="184" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Conserva squillo (2.8–3.2 kHz) y cuerpo</text>
    <text x="184" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0369a1">• Escala homogénea hasta el sobreagudo</text>
  </g>

  <g transform="translate(483, 232)">
    <rect x="0" y="0" width="408" height="180" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="204" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0369a1">Síntesis de García II y Sundberg</text>
    <text x="204" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#0c4a6e">
      <tspan x="204" dy="0">"Cubrir no es oscurecer ni engolar la garganta,</tspan>
      <tspan x="204" dy="16">sino adaptar la geometría del tracto vocal</tspan>
      <tspan x="204" dy="16">para que el timbre conserve nobleza y libertad."</tspan>
    </text>
    <line x1="35" y1="94" x2="373" y2="94" stroke="#bae6fd" stroke-width="1"/>
    <text x="204" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">
      <tspan x="204" dy="0">Equilibrio Acústico:</tspan>
      <tspan x="204" dy="14" font-weight="700" fill="#0369a1">Chiaroscuro pleno sin rigidez ni pérdida de brillo</tspan>
    </text>
    <text x="204" y="154" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0284c7">
      <tspan x="204" dy="0">El Error de la Hiper-Cobertura</tspan>
      <tspan x="204" dy="14" font-weight="500" fill="#0c4a6e">Oscurecer en exceso desde el grave ahoga el brillo y engola</tspan>
    </text>
  </g>
</svg>
