<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchPass" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.9" stroke-opacity="0.18"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — SINTONÍA DE FORMANTES EN EL PASSAGGIO: VOCE APERTA vs. COPERTURA</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Evolución del primer formante (F1) frente al segundo armónico (2f0) al ascender hacia el registro agudo (Sundberg)</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- Zona Passaggio (Mi4 - Fa#4) -->
  <rect x="405" y="100" width="150" height="205" fill="url(#hatchPass)" stroke="#881337" stroke-width="0.7" stroke-opacity="0.35"/>
  <text x="480" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#881337" letter-spacing="0.06em">ZONA DE PASSAGGIO</text>

  <!-- Ejes -->
  <line x1="95" y1="100" x2="95" y2="305" stroke="#1C1B19" stroke-width="1.2"/>
  <line x1="95" y1="305" x2="820" y2="305" stroke="#1C1B19" stroke-width="1.2"/>
  <g stroke="#1C1B19" stroke-opacity="0.12" stroke-width="0.8">
    <line x1="95" y1="150" x2="815" y2="150" stroke-dasharray="2,3"/>
    <line x1="95" y1="210" x2="815" y2="210" stroke-dasharray="2,3"/>
    <line x1="95" y1="265" x2="815" y2="265" stroke-dasharray="2,3"/>
  </g>

  <text x="83" y="154" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">900 Hz</text>
  <text x="83" y="214" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">700 Hz</text>
  <text x="83" y="269" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">500 Hz</text>
  <text x="34" y="202" text-anchor="middle" transform="rotate(-90 34 202)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#57534E" letter-spacing="0.06em">FRECUENCIA (Hz)</text>

  <text x="170" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Do4 (Centro)</text>
  <text x="330" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Re4</text>
  <text x="480" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#881337">Mi4–Fa#4</text>
  <text x="640" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Sol4</text>
  <text x="770" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Do5 (Agudo)</text>

  <!-- Línea de 2f0 ascendente -->
  <path d="M 140,275 L 780,122" fill="none" stroke="#1C1B19" stroke-width="1.4" stroke-opacity="0.45"/>

  <!-- Techo fijo F1 en Voce Aperta (/a/ horizontal a ~700 Hz -> choque en x=480) -->
  <line x1="140" y1="208" x2="770" y2="208" stroke="#1C1B19" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="420" cy="208" r="4.5" fill="#FAF8F5" stroke="#1C1B19" stroke-width="1.8"/>

  <!-- Ajuste de F1 en Copertura (desciende suavemente por redondeo /a/ -> /o/ para sintonizarse y evitar el choque) -->
  <path d="M 140,208 C 280,208 380,214 480,242 C 580,266 680,256 775,232" fill="none" stroke="#881337" stroke-width="2.2"/>
  <circle cx="480" cy="242" r="4" fill="#881337"/>

  <!-- Anotaciones directas -->
  <line x1="420" y1="208" x2="345" y2="152" stroke="#1C1B19" stroke-width="0.9"/>
  <text x="340" y="144" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="600" fill="#1C1B19">Choque en Voce Aperta</text>
  <text x="340" y="158" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">2f0 cruza F1 fijo (~700 Hz) · Grito</text>

  <line x1="690" y1="144" x2="640" y2="112" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="645" y="110" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#57534E">2º armónico (2f0)</text>

  <line x1="560" y1="255" x2="610" y2="282" stroke="#881337" stroke-width="0.9"/>
  <text x="615" y="280" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="700" fill="#881337">Copertura (Aggiustamento)</text>
  <text x="615" y="294" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Redondeo (/a/ → /ɔ/) ajusta F1 sin choque</text>

  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura física:</tspan> Mantener la vocal plana en el pasaje (línea punteada) provoca que los armónicos superen a F1 y disparen
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    la tensión laríngea; el redondeo sutil de la cobertura (curva burdeos) reacomoda la resonancia preservando el <tspan font-style="italic">squillo</tspan>.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · SINTONÍA FORMÁNTICA (GARCÍA II 1847 · MILLER 1986 · SUNDBERG 1987)</text>
</svg>
