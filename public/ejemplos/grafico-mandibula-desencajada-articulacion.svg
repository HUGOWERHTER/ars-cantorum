<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="890" height="36" rx="6" fill="#0f172a"/>
  <text x="460" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">BIOMECÁNICA MANDIBULAR EN EL CANTO: CAÍDA PASIVA vs. MANDÍBULA DESENCAJADA</text>

  <!-- PANEL IZQUIERDO -->
  <rect x="15" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
  <rect x="16" y="57" width="433" height="32" rx="7" fill="#f0f9ff"/>
  <text x="232" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0369a1">A) Bel Canto: Suspensión Mandibular Libre</text>

  <g transform="translate(25, 100)">
    <rect x="0" y="0" width="150" height="115" rx="6" fill="#f8fafc" stroke="#bae6fd"/>
    <text x="75" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Apertura Libre</text>
    <!-- Curva en tercio superior sin tocar texto -->
    <path d="M 35 30 Q 55 52 105 55" stroke="#0284c7" stroke-width="3" fill="none"/>
    <circle cx="35" cy="30" r="4.5" fill="#0284c7"/>
    <text x="75" y="85" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0369a1">Rotación Condilar Pura</text>
    <text x="75" y="100" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748b">ATM libre de tensión</text>

    <rect x="162" y="0" width="250" height="115" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="174" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Mecánica Fisiológica</text>
    <text x="174" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Descenso condicionado por la vocal</text>
    <text x="174" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Espacio faríngeo libre y amplio</text>
    <text x="174" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Cóndilo rota naturalmente en la fosa</text>
    <text x="174" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Laringe en flotación elástica neutra</text>
    <text x="174" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Máxima agilidad en la dicción</text>
  </g>

  <g transform="translate(25, 228)">
    <rect x="0" y="0" width="414" height="185" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="207" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1e293b">Doctrina de Mancini y Lamperti</text>
    <text x="207" y="46" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#475569">
      <tspan x="207" dy="0">"La mandíbula no debe ser empujada hacia abajo;</tspan>
      <tspan x="207" dy="16">debe colgar libremente por su propio peso,</tspan>
      <tspan x="207" dy="16">sin violencia en las articulaciones ni rigidez."</tspan>
    </text>
    <line x1="40" y1="92" x2="374" y2="92" stroke="#e2e8f0" stroke-width="1"/>
    <text x="207" y="114" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">
      <tspan x="207" dy="0">Beneficio Acústico:</tspan>
      <tspan x="207" dy="14" font-weight="600" fill="#0369a1">Preservación del formante del cantante y agilidad</tspan>
    </text>
    <text x="207" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0284c7">
      <tspan x="207" dy="0">Apertura Diferenciada por Vocal y Rango</tspan>
      <tspan x="207" dy="14" font-weight="500" fill="#334155">Apertura moderada en graves, mayor holgura en agudos</tspan>
    </text>
  </g>

  <!-- PANEL DERECHO -->
  <rect x="470" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="471" y="57" width="433" height="32" rx="7" fill="#fef2f2"/>
  <text x="687" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">B) La Trampa del Jaw Drop Extremo</text>

  <g transform="translate(480, 100)">
    <rect x="0" y="0" width="150" height="115" rx="6" fill="#f8fafc" stroke="#fecaca"/>
    <text x="75" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#b91c1c">Subluxación Rígida</text>
    <!-- Dibujo en tercio superior sin tocar texto -->
    <path d="M 40 28 L 40 55 L 95 62" stroke="#dc2626" stroke-width="3" fill="none"/>
    <circle cx="40" cy="28" r="4.5" fill="#dc2626"/>
    <text x="75" y="85" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#b91c1c">Mandíbula Forzada</text>
    <text x="75" y="100" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#7f1d1d">Tracción sobre el hioides</text>

    <rect x="162" y="0" width="250" height="115" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="174" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Efectos Patológicos</text>
    <text x="174" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Contracción espasmódica de maseteros</text>
    <text x="174" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• La base lingual es empujada a la faringe</text>
    <text x="174" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Tracción ascensional sobre la laringe</text>
    <text x="174" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Bloqueo de la basculación tiroidea</text>
    <text x="174" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Timbre sordo y dicción empastada</text>
  </g>

  <g transform="translate(480, 228)">
    <rect x="0" y="0" width="414" height="185" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
    <text x="207" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">Advertencia de Richard Miller</text>
    <text x="207" y="46" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">
      <tspan x="207" dy="0">"Desencajar la mandíbula hacia abajo y atrás</tspan>
      <tspan x="207" dy="16">no crea verdadero espacio; introduce una ancla</tspan>
      <tspan x="207" dy="16">de rigidez muscular en el cuello y la lengua."</tspan>
    </text>
    <line x1="40" y1="92" x2="374" y2="92" stroke="#fecaca" stroke-width="1"/>
    <text x="207" y="114" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">
      <tspan x="207" dy="0">Consecuencia Técnica Crónica:</tspan>
      <tspan x="207" dy="14" font-weight="600" fill="#b91c1c">Pérdida de flexibilidad en el passaggio agudo</tspan>
    </text>
    <text x="207" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#991b1b">
      <tspan x="207" dy="0">El Mito de la Boca en Caverna</tspan>
      <tspan x="207" dy="14" font-weight="500" fill="#7f1d1d">Apertura desmesurada que desactiva los formantes</tspan>
    </text>
  </g>
</svg>