<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <!-- Barra superior del título -->
  <rect x="10" y="8" width="880" height="36" rx="6" fill="#0f172a"/>
  <text x="450" y="31" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">BIOMECÁNICA MANDIBULAR EN EL CANTO: CAÍDA PASIVA vs. MANDÍBULA DESENCAJADA</text>

  <!-- ==================== PANEL IZQUIERDO: CAÍDA PASIVA ==================== -->
  <rect x="15" y="54" width="425" height="252" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
  <rect x="16" y="55" width="423" height="32" rx="7" fill="#f0f9ff"/>
  <text x="228" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0369a1">A) Bel Canto: Suspensión Mandibular Libre y Elástica</text>

  <g transform="translate(30, 95)">
    <!-- Silueta Craneal y ATM libre -->
    <rect x="10" y="5" width="150" height="100" rx="6" fill="#f8fafc" stroke="#bae6fd"/>
    <text x="85" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">ATM en Reposo Funcional</text>
    
    <!-- Esquema Mandíbula y Cóndilo -->
    <path d="M 40 40 Q 90 35 125 45" stroke="#0284c7" stroke-width="2.5" fill="none"/>
    <!-- Cóndilo en la fosa temporal sin compresión -->
    <circle cx="125" cy="45" r="5" fill="#0284c7"/>
    <path d="M 40 40 L 40 70 Q 70 85 110 75 L 125 45" stroke="#0284c7" stroke-width="2" fill="none"/>
    <text x="85" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#0369a1">Apertura elástica</text>
    <text x="85" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748b">Maseteros sin tensión</text>

    <!-- Parámetros -->
    <rect x="175" y="5" width="205" height="100" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="185" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Mecánica Saludable</text>
    <text x="185" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Descenso condicionado por la vocal</text>
    <text x="185" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Espacio faríngeo libre y amplio</text>
    <text x="185" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Cóndilo rota naturalmente sin luxación</text>
    <text x="185" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Laringe en flotación elástica</text>
  </g>

  <!-- Valoración -->
  <rect x="25" y="210" width="405" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="228" y="228" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#1e293b">Doctrina de Francesco y G. B. Lamperti</text>
  <text x="228" y="246" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10" fill="#475569">"La mandíbula no debe ser empujada hacia abajo; debe colgar libremente del cráneo como suspendida por hilos invisibles."</text>
  <text x="228" y="266" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">Máxima agilidad en la dicción • Brillo armónico</text>
  <text x="228" y="282" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#0284c7">El Equilibrio Clásico</text>

  <!-- ==================== PANEL DERECHO: DESENCAJE FORZADO ==================== -->
  <rect x="460" y="54" width="425" height="252" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="461" y="55" width="423" height="32" rx="7" fill="#fef2f2"/>
  <text x="672" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">B) La Trampa del Jaw Drop Extremo (Tensión Isométrica)</text>

  <g transform="translate(475, 95)">
    <!-- Silueta con luxación forzada -->
    <rect x="10" y="5" width="150" height="100" rx="6" fill="#f8fafc" stroke="#fecaca"/>
    <text x="85" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#b91c1c">Luxación y Tracción Posterior</text>
    
    <path d="M 40 40 Q 80 30 115 35" stroke="#dc2626" stroke-width="2.5" fill="none"/>
    <circle cx="115" cy="35" r="5" fill="#dc2626"/>
    <!-- Mandíbula caída exagerada hacia abajo y atrás -->
    <path d="M 40 40 L 35 90 Q 75 105 110 85 L 115 35" stroke="#dc2626" stroke-width="2.2" fill="none"/>
    <!-- Flecha de empuje lingual contra faringe -->
    <path d="M 75 75 Q 110 70 125 75" stroke="#b91c1c" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="85" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#b91c1c">Empuje lingual</text>
    <text x="85" y="90" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#7f1d1d">Faringe colapsada</text>

    <!-- Parámetros -->
    <rect x="175" y="5" width="205" height="100" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="185" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Efectos Fisiopatológicos</text>
    <text x="185" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Contracción espasmódica de maseteros</text>
    <text x="185" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• La base lingual es forzada contra la epiglotis</text>
    <text x="185" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Tracción ascensional sobre el hueso hioides</text>
    <text x="185" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Bloqueo de la laringe e hiperpresión</text>
  </g>

  <!-- Valoración -->
  <rect x="470" y="210" width="405" height="85" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
  <text x="672" y="228" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">Diagnóstico de Richard Miller</text>
  <text x="672" y="246" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10" fill="#7f1d1d">"Dejar caer la mandíbula al máximo no abre la garganta; la cierra. Favorece la boca en detrimento del resonador faríngeo."</text>
  <text x="672" y="266" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">Pérdida de squillo • Trastornos de la articulación ATM</text>
  <text x="672" y="282" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#b91c1c">El Error del Desencaje Rígido</text>
</svg>