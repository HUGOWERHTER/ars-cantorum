<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchATM" width="5" height="5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#881337" stroke-width="0.8" stroke-opacity="0.22"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — CINEMÁTICA DE LA ATM: ROTACIÓN CONDILAR vs. JAW DROP EXTREMO</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Efecto de la traslación mandibular forzada sobre los músculos suprahioideos y el espacio faríngeo posterior</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <line x1="440" y1="90" x2="440" y2="345" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.25" stroke-dasharray="3,3"/>

  <!-- IZQUIERDA: ROTACIÓN LIBRE -->
  <text x="230" y="102" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="700" fill="#881337">I. SUSPENSIÓN GRAVITACIONAL (ROTACIÓN)</text>
  <g transform="translate(85, 125)">
    <!-- Fosa glenoidea -->
    <path d="M 165,28 Q 185,12 205,28" fill="none" stroke="#1C1B19" stroke-width="1.3"/>
    <!-- Rama y cuerpo mandibular rotando suavemente -->
    <circle cx="185" cy="30" r="6" fill="#881337"/>
    <path d="M 185,30 L 180,105 L 80,122" fill="none" stroke="#881337" stroke-width="2.2"/>
    <!-- Arco suave de descenso -->
    <path d="M 80,90 Q 75,108 80,122" fill="none" stroke="#881337" stroke-width="1.2" stroke-dasharray="3,3"/>
    <!-- Faringe libre detrás -->
    <rect x="215" y="45" width="28" height="115" fill="url(#hatchATM)" stroke="#881337" stroke-width="1"/>
    <line x1="185" y1="30" x2="130" y2="24" stroke="#881337" stroke-width="0.8"/>
    <text x="125" y="24" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="700" fill="#881337">Rotación pura en fosa</text>
    <text x="125" y="37" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">Maseteros pasivos</text>

    <line x1="243" y1="100" x2="262" y2="100" stroke="#881337" stroke-width="0.8"/>
    <text x="266" y="98" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#881337">Faringe</text>
    <text x="266" y="111" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">amplia y libre</text>
    <text x="145" y="188" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#881337">Apertura calibrada por vocal y tono (F1 tracking)</text>
  </g>

  <!-- DERECHA: TRASLACIÓN / JAW DROP FORZADO -->
  <text x="655" y="102" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="700" fill="#1C1B19">II. JAW DROP EXTREMO (TRASLACIÓN)</text>
  <g transform="translate(505, 125)">
    <path d="M 165,28 Q 185,12 205,28" fill="none" stroke="#1C1B19" stroke-width="1.3"/>
    <!-- Cóndilo desplazado fuera de la fosa hacia adelante -->
    <circle cx="155" cy="36" r="6" fill="#FAF8F5" stroke="#1C1B19" stroke-width="1.6"/>
    <path d="M 155,36 L 165,122 L 75,155" fill="none" stroke="#1C1B19" stroke-width="2" stroke-dasharray="5,3"/>
    <!-- Flecha de tracción hioidea posterior -->
    <path d="M 165,122 L 205,122 M 199,117 L 205,122 L 199,127" fill="none" stroke="#1C1B19" stroke-width="1.5"/>
    <!-- Faringe colapsada -->
    <rect x="215" y="45" width="12" height="115" fill="#1C1B19" fill-opacity="0.18" stroke="#1C1B19" stroke-width="1"/>
    <line x1="150" y1="34" x2="105" y2="24" stroke="#1C1B19" stroke-width="0.8"/>
    <text x="100" y="24" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#1C1B19">Subluxación anterior</text>
    <text x="100" y="37" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">Espasmo maseterino</text>

    <line x1="227" y1="105" x2="255" y2="105" stroke="#1C1B19" stroke-width="0.8"/>
    <text x="259" y="103" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#1C1B19">Estrechamiento</text>
    <text x="259" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">Tracción hioidea</text>
    <text x="145" y="188" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Raíz lingual empujada sobre la epiglotis (Knödel)</text>
  </g>

  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura anatómica:</tspan> La apertura moderada por rotación (burdeos) mantiene la faringe despejada; forzar el descenso extremo
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    luxa el cóndilo y activa los músculos suprahioideos, empujando la base lingual hacia atrás y bloqueando el tracto.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · CINEMÁTICA MANDIBULAR (LAMPERTI 1890 · MILLER 2008 · DIMON)</text>
</svg>
