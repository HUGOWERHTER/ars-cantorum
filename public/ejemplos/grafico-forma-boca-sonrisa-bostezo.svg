<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <!-- Barra superior del título -->
  <rect x="10" y="8" width="880" height="36" rx="6" fill="#0f172a"/>
  <text x="450" y="31" text-anchor="middle" font-family="'Cinzel', serif" font-size="13.5" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">LA FORMA DE LA BOCA EN EL CANTO: BOCCA RIDENTE (SONRISA) vs. BOCCA A TROMBA (BOSTEZO)</text>

  <!-- ==================== PANEL IZQUIERDO: BOCCA RIDENTE ==================== -->
  <rect x="15" y="54" width="425" height="252" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
  <rect x="16" y="55" width="423" height="32" rx="7" fill="#f0f9ff"/>
  <text x="228" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0369a1">A) Escuela Clásica Italiana: Bocca Ridente (Sonrisa Discreta)</text>

  <!-- Esquema Anatómico y Acústico Bocca Ridente -->
  <g transform="translate(30, 95)">
    <!-- Silueta Facial y Labios en Bocca Ridente -->
    <rect x="10" y="5" width="145" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="82" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Apertura Labial</text>
    
    <!-- Esquema de labios horizontales con elevación cigomática -->
    <path d="M 35 60 Q 82 48 130 60 Q 82 54 35 60 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="1.8"/>
    <path d="M 35 60 Q 82 74 130 60 Q 82 62 35 60 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="1.8"/>
    <!-- Comisuras elevadas por músculo cigomático -->
    <path d="M 32 58 Q 28 52 24 48" stroke="#0284c7" stroke-width="1.6" fill="none"/>
    <path d="M 133 58 Q 137 52 141 48" stroke="#0284c7" stroke-width="1.6" fill="none"/>
    <text x="82" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#0284c7">Músculos Cigomáticos Activos</text>

    <!-- Caja de Parámetros Biomecánicos -->
    <rect x="168" y="5" width="212" height="100" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="178" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Ajuste Acústico y Muscular</text>
    <text x="178" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Tracto vocal de longitud fisiológica neutra</text>
    <text x="178" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Realce del 2° formante (F2) y armónicos agudos</text>
    <text x="178" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Laringe suspendida elásticamente (sin tensión)</text>
    <text x="178" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Articulación diáfana de consonantes y vocales</text>
  </g>

  <!-- Valoración Estética y Crítica Histórica -->
  <rect x="25" y="208" width="405" height="88" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="228" y="226" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1e293b">Doctrina de Tosi (1723) y Mancini (1774)</text>
  <text x="228" y="244" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#475569">"La boca debe abrirse a foggia di chi ride discretamente: con naturalidad, sin muecas que deformen la palabra ni estrangulen la voz."</text>
  <text x="228" y="266" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">Riesgo si se exagera: Voz excesivamente abierta y blanca (voce sguaiata)</text>
  <text x="228" y="282" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#0284c7">Ideal: Chiaroscuro equilibrado con brillo frontal natural</text>

  <!-- ==================== PANEL DERECHO: BOCCA A TROMBA / BOSTEZO ==================== -->
  <rect x="460" y="54" width="425" height="252" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="461" y="55" width="423" height="32" rx="7" fill="#fef2f2"/>
  <text x="672" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">B) Escuela del Bostezo Permanente: Bocca a Tromba (Tubing)</text>

  <!-- Esquema Anatómico y Acústico Bocca a Tromba -->
  <g transform="translate(475, 95)">
    <!-- Silueta Facial y Labios en Bocca a Tromba -->
    <rect x="10" y="5" width="145" height="100" rx="6" fill="#f8fafc" stroke="#fee2e2"/>
    <text x="82" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#b91c1c">Apertura Labial</text>
    
    <!-- Esquema de labios redondeados/abocinados verticalmente (óvalo vertical pronunciado) -->
    <ellipse cx="82" cy="58" rx="28" ry="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <ellipse cx="82" cy="58" rx="16" ry="14" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
    <!-- Descenso forzado de la mandíbula -->
    <path d="M 82 82 L 82 92" stroke="#b91c1c" stroke-width="1.8" marker-end="url(#arrow)"/>
    <text x="82" y="99" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#b91c1c">Mandíbula Hundida / Abocinamiento</text>

    <!-- Caja de Parámetros Biomecánicos -->
    <rect x="168" y="5" width="212" height="100" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="178" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Ajuste Acústico y Muscular</text>
    <text x="178" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Elongación acústica artificial del tubo bucal</text>
    <text x="178" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Descenso general de todos los formantes (F1-F4)</text>
    <text x="178" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Contracción de maseteros y tracción lingual</text>
    <text x="178" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Pérdida del 'squillo' (timbre cavernoso y opaco)</text>
  </g>

  <!-- Valoración Estética y Crítica Histórica -->
  <rect x="470" y="208" width="405" height="88" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
  <text x="672" y="226" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">La Crítica de Richard Miller y G. B. Lamperti</text>
  <text x="672" y="244" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">"Dejar caer la mandíbula al extremo no abre la garganta; la estrangula al empujar la lengua hacia atrás y anular los armónicos del cantante."</text>
  <text x="672" y="266" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7f1d1d">Defecto resultante: Engolamiento crónico (Knödel) y dicción ininteligible</text>
  <text x="672" y="282" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#b91c1c">Pérdida de penetración acústica ante la orquesta</text>
</svg>