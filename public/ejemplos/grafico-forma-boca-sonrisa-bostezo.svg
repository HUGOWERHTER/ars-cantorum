<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Geometría labial y longitud acústica del tracto vocal: Bocca Ridente frente a Bocca a Tromba">
  <defs>
    <style>
      .title { font-family: 'Cinzel', Georgia, serif; font-size: 19px; font-weight: 700; fill: #1C1B19; letter-spacing: 0.6px; }
      .subtitle { font-family: 'Newsreader', Georgia, serif; font-size: 13px; font-style: italic; fill: #1C1B19; opacity: 0.78; }
      .plate-num { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.8px; fill: #881337; text-transform: uppercase; }
      .sec-head { font-family: 'Cinzel', Georgia, serif; font-size: 13px; font-weight: 700; fill: #1C1B19; letter-spacing: 0.4px; }
      .sec-head-acc { font-family: 'Cinzel', Georgia, serif; font-size: 13px; font-weight: 700; fill: #881337; letter-spacing: 0.4px; }
      .lbl { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; fill: #1C1B19; }
      .lbl-b { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; font-weight: 700; fill: #1C1B19; }
      .lbl-acc { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; font-weight: 700; fill: #881337; }
      .lbl-sm { font-family: 'Newsreader', Georgia, serif; font-size: 11px; fill: #1C1B19; opacity: 0.85; }
      .mag { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 600; fill: #1C1B19; }
      .mag-acc { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 700; fill: #881337; }
      .mag-muted { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9.5px; fill: #1C1B19; opacity: 0.65; }
      .caption { font-family: 'Newsreader', Georgia, serif; font-size: 11.5px; fill: #1C1B19; opacity: 0.86; }
      .caption-b { font-family: 'Newsreader', Georgia, serif; font-size: 11.5px; font-weight: 700; fill: #1C1B19; }
      .hair { stroke: #1C1B19; stroke-width: 1; fill: none; }
      .hair-light { stroke: #1C1B19; stroke-width: 0.7; stroke-opacity: 0.35; fill: none; }
      .hair-dash { stroke: #1C1B19; stroke-width: 1.1; stroke-dasharray: 4 3; fill: none; }
      .ink-line { stroke: #1C1B19; stroke-width: 1.4; fill: none; }
      .acc-line { stroke: #881337; stroke-width: 1.8; fill: none; }
      .acc-dash { stroke: #881337; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
      .leader { stroke: #1C1B19; stroke-width: 0.85; stroke-opacity: 0.65; fill: none; }
    </style>
    <pattern id="hatch-ink" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.22"/>
    </pattern>
    <pattern id="hatch-acc" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.8" stroke-opacity="0.24"/>
    </pattern>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#1C1B19"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#881337"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#FAF8F5"/>
  <rect x="12" y="12" width="856" height="476" fill="none" stroke="#DCD6CD" stroke-width="1"/>
  <text x="36" y="42" class="plate-num">LÁMINA XVII · ACÚSTICA DEL TRACTO ORAL</text>
  <text x="36" y="66" class="title">Bocca Ridente vs. Bocca a Tromba: Longitud L y Formantes</text>
  <text x="36" y="85" class="subtitle">Efecto de la conformación labial y mandibular sobre la resonancia f ∝ c / (4L)</text>
  <line x1="36" y1="98" x2="844" y2="98" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Left Panel: Bocca Ridente vs Bocca a Tromba Profiles -->
  <text x="36" y="122" class="sec-head-acc">A. GEOMETRÍA OROFACIAL Y LONGITUD EFECTIVA (L)</text>

  <!-- Profile 1: Bocca Ridente -->
  <g transform="translate(36, 138)">
    <rect x="0" y="0" width="380" height="145" fill="none" stroke="#DCD6CD" stroke-width="0.9"/>
    <text x="14" y="22" class="lbl-acc">1. Bocca Ridente (Sonrisa noble · Tosi / Mancini)</text>
    <!-- Stylized vocal tract tube L -->
    <path d="M 32,75 L 220,75" class="acc-line"/>
    <path d="M 32,99 L 220,99" class="acc-line"/>
    <rect x="32" y="75" width="188" height="24" fill="url(#hatch-acc)"/>
    <!-- Glottis end -->
    <line x1="32" y1="68" x2="32" y2="106" stroke="#1C1B19" stroke-width="1.6"/>
    <text x="20" y="60" class="mag-muted">Glotis</text>
    <!-- Lips slightly retracted (cheek lift) -->
    <path d="M 220,75 Q 232,70 226,64" class="acc-line"/>
    <path d="M 220,99 Q 232,104 226,110" class="acc-line"/>
    <text x="236" y="83" class="lbl-sm">Comisuras elevadas</text>
    <text x="236" y="98" class="lbl-sm">(fascia cigomática)</text>
    <!-- Dimension L -->
    <line x1="32" y1="122" x2="220" y2="122" stroke="#881337" stroke-width="1" marker-start="url(#arr-acc)" marker-end="url(#arr-acc)"/>
    <text x="106" y="136" class="mag-acc">L equilibrada (~17 cm)</text>
  </g>

  <!-- Profile 2: Bocca a Tromba -->
  <g transform="translate(36, 296)">
    <rect x="0" y="0" width="380" height="145" fill="none" stroke="#DCD6CD" stroke-width="0.9"/>
    <text x="14" y="22" class="lbl-b">2. Bocca a Tromba (Bostezo forzado · Tubing)</text>
    <!-- Lengthened vocal tract tube L + ΔL -->
    <path d="M 32,75 L 258,75" class="hair-dash"/>
    <path d="M 32,104 L 258,104" class="hair-dash"/>
    <rect x="32" y="75" width="226" height="29" fill="url(#hatch-ink)"/>
    <line x1="32" y1="68" x2="32" y2="111" stroke="#1C1B19" stroke-width="1.6"/>
    <!-- Protruded lips -->
    <path d="M 258,75 L 274,69" class="ink-line"/>
    <path d="M 258,104 L 274,110" class="ink-line"/>
    <line x1="220" y1="64" x2="220" y2="115" stroke="#1C1B19" stroke-width="0.8" stroke-dasharray="2 2"/>
    <text x="278" y="84" class="lbl-sm">Abocinamiento</text>
    <text x="278" y="99" class="lbl-sm">+ caída mandibular</text>
    <!-- Dimension L + ΔL -->
    <line x1="32" y1="124" x2="258" y2="124" stroke="#1C1B19" stroke-width="1" marker-start="url(#arr-ink)" marker-end="url(#arr-ink)"/>
    <text x="98" y="138" class="mag">L elongada (+2 a 3 cm)</text>
  </g>

  <!-- Right Panel: Spectral Formant Shift -->
  <text x="444" y="122" class="sec-head">B. DESPLAZAMIENTO ESPECTRAL DE FORMANTES</text>
  <g transform="translate(444, 138)">
    <rect x="0" y="0" width="400" height="303" fill="none" stroke="#DCD6CD" stroke-width="0.9"/>
    <!-- Axes -->
    <line x1="46" y1="255" x2="380" y2="255" stroke="#1C1B19" stroke-width="1.2"/>
    <line x1="46" y1="30" x2="46" y2="255" stroke="#1C1B19" stroke-width="1.2"/>
    <!-- Grid lines -->
    <line x1="46" y1="185" x2="380" y2="185" class="hair-light"/>
    <line x1="46" y1="115" x2="380" y2="115" class="hair-light"/>
    <line x1="46" y1="50" x2="380" y2="50" class="hair-light"/>
    <!-- Singing Formant shaded band 2.8-3.2 kHz -->
    <rect x="262" y="34" width="52" height="221" fill="url(#hatch-acc)"/>
    <text x="288" y="48" text-anchor="middle" class="mag-acc">2.8–3.2 kHz</text>
    <text x="288" y="61" text-anchor="middle" class="lbl-sm">Squillo</text>

    <!-- Curve 1: Bocca Ridente (burgundy solid) -->
    <path d="M 52,235 Q 80,105 104,112 Q 130,175 162,126 Q 192,188 228,162 Q 254,185 288,88 Q 320,170 368,225" class="acc-line"/>
    <!-- Curve 2: Bocca a Tromba (charcoal dashed, shifted left/down and damped at 3kHz) -->
    <path d="M 52,225 Q 72,118 90,124 Q 112,185 138,142 Q 168,200 202,184 Q 240,215 282,196 Q 324,218 368,242" class="hair-dash"/>

    <!-- Direct labels on peaks -->
    <text x="104" y="102" text-anchor="middle" class="mag-acc">F1</text>
    <text x="162" y="116" text-anchor="middle" class="mag-acc">F2</text>
    <text x="288" y="79" text-anchor="middle" class="mag-acc">F3–F5</text>

    <!-- Leader callout for attenuation -->
    <line x1="286" y1="195" x2="232" y2="226" class="leader"/>
    <text x="148" y="238" class="lbl-sm">Atenuación de brillo</text>
    <text x="148" y="250" class="mag-muted">(timbre Knödel)</text>

    <!-- X-axis ticks -->
    <text x="46" y="272" text-anchor="middle" class="mag-muted">0.2</text>
    <text x="130" y="272" text-anchor="middle" class="mag-muted">1.0</text>
    <text x="214" y="272" text-anchor="middle" class="mag-muted">2.0</text>
    <text x="298" y="272" text-anchor="middle" class="mag-muted">3.0</text>
    <text x="372" y="272" text-anchor="middle" class="mag-muted">4.0 kHz</text>
    <text x="24" y="145" text-anchor="middle" transform="rotate(-90 24 145)" class="mag-muted">Amplitud (dB)</text>

    <!-- Legend -->
    <line x1="56" y1="290" x2="80" y2="290" class="acc-line"/>
    <text x="86" y="294" class="lbl-sm">Bocca ridente (F2 y squillo)</text>
    <line x1="256" y1="290" x2="280" y2="290" class="hair-dash"/>
    <text x="286" y="294" class="lbl-sm">Tromba (caída global)</text>
  </g>

  <!-- Footer Caption -->
  <line x1="36" y1="456" x2="844" y2="456" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="474" class="caption-b">Lectura acústica:</text>
  <text x="148" y="474" class="caption">El abocinamiento alarga L y desplaza los formantes hacia abajo, atenuando la banda de 2.8–3.2 kHz (Sundberg; Miller).</text>
</svg>