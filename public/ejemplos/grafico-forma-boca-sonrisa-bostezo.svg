<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <!-- Barra superior del título -->
  <rect x="15" y="10" width="890" height="36" rx="6" fill="#0f172a"/>
  <text x="460" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">LA FORMA DE LA BOCA EN EL CANTO: BOCCA RIDENTE (SONRISA) vs. BOCCA A TROMBA (BOSTEZO)</text>

  <!-- ==================== PANEL IZQUIERDO: BOCCA RIDENTE ==================== -->
  <rect x="15" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
  <rect x="16" y="57" width="433" height="32" rx="7" fill="#f0f9ff"/>
  <text x="232" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0369a1">A) Escuela Clásica Italiana: Bocca Ridente (Sonrisa Discreta)</text>

  <!-- Esquema Anatómico y Acústico Bocca Ridente -->
  <g transform="translate(25, 100)">
    <!-- Silueta Facial y Labios en Bocca Ridente -->
    <rect x="0" y="0" width="150" height="115" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="75" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Apertura Labial</text>
    
    <!-- Esquema de labios horizontales con elevación cigomática -->
    <path d="M 30 60 Q 75 48 120 60 Q 75 54 30 60 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="1.8"/>
    <path d="M 30 60 Q 75 74 120 60 Q 75 62 30 60 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="1.8"/>
    <!-- Comisuras elevadas por músculo cigomático -->
    <path d="M 28 58 Q 24 52 20 48" stroke="#0284c7" stroke-width="1.6" fill="none"/>
    <path d="M 122 58 Q 126 52 130 48" stroke="#0284c7" stroke-width="1.6" fill="none"/>
    <text x="75" y="92" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#0284c7">Músculos Cigomáticos Activos</text>

    <!-- Caja de Parámetros Biomecánicos -->
    <rect x="162" y="0" width="250" height="115" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="174" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Ajuste Acústico y Muscular</text>
    <text x="174" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Tracto vocal de longitud neutra</text>
    <text x="174" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Realce del formante F2 y armónicos agudos</text>
    <text x="174" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Laringe suspendida elásticamente</text>
    <text x="174" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Articulación diáfana de las vocales</text>
    <text x="174" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Libertad en consonantes linguales</text>
  </g>

  <!-- Valoración Estética y Crítica Histórica -->
  <g transform="translate(25, 228)">
    <rect x="0" y="0" width="414" height="185" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="207" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1e293b">Doctrina de Tosi (1723) y Mancini (1774)</text>
    
    <!-- Cita histórica envuelta en líneas cortas -->
    <text x="207" y="46" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#475569">
      <tspan x="207" dy="0">"La boca debe abrirse a foggia di chi ride discretamente:</tspan>
      <tspan x="207" dy="16">con naturalidad, sin muecas que deformen la palabra</tspan>
      <tspan x="207" dy="16">ni estrangulen la voz en la garganta."</tspan>
    </text>

    <line x1="40" y1="95" x2="374" y2="95" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Puntos de valoración sin desbordar -->
    <text x="207" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">
      <tspan x="207" dy="0">Riesgo si se exagera la postura:</tspan>
      <tspan x="207" dy="15" font-weight="600" fill="#dc2626">Voz excesivamente blanca y estridente (voce sguaiata)</tspan>
    </text>

    <text x="207" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#0284c7">
      <tspan x="207" dy="0">Ideal Supremo: Chiaroscuro Equilibrado</tspan>
      <tspan x="207" dy="15" font-weight="500" fill="#0369a1">Brillo frontal natural acoplado a la profundidad faríngea</tspan>
    </text>
  </g>

  <!-- ==================== PANEL DERECHO: BOCCA A TROMBA / BOSTEZO ==================== -->
  <rect x="470" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="471" y="57" width="433" height="32" rx="7" fill="#fef2f2"/>
  <text x="687" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">B) Escuela del Bostezo Permanente: Bocca a Tromba (Tubing)</text>

  <!-- Esquema Anatómico y Acústico Bocca a Tromba -->
  <g transform="translate(480, 100)">
    <!-- Silueta Facial y Labios en Bocca a Tromba -->
    <rect x="0" y="0" width="150" height="115" rx="6" fill="#f8fafc" stroke="#fee2e2"/>
    <text x="75" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#b91c1c">Apertura Labial</text>
    
    <!-- Esquema de labios redondeados/abocinados verticalmente -->
    <ellipse cx="75" cy="58" rx="26" ry="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <ellipse cx="75" cy="58" rx="14" ry="14" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
    <!-- Descenso forzado de la mandíbula -->
    <path d="M 75 84 L 75 92" stroke="#b91c1c" stroke-width="1.8"/>
    <text x="75" y="104" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#b91c1c">Mandíbula Hundida / Tromba</text>

    <!-- Caja de Parámetros Biomecánicos -->
    <rect x="162" y="0" width="250" height="115" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="174" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Ajuste Acústico y Muscular</text>
    <text x="174" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Elongación acústica artificial del tubo bucal</text>
    <text x="174" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Descenso general de formantes (F1-F4)</text>
    <text x="174" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Contracción espasmódica de maseteros</text>
    <text x="174" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Tracción lingual hacia la faringe</text>
    <text x="174" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Pérdida de squillo (timbre cavernoso y sordo)</text>
  </g>

  <!-- Valoración Estética y Crítica Histórica -->
  <g transform="translate(480, 228)">
    <rect x="0" y="0" width="414" height="185" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
    <text x="207" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">La Crítica de Richard Miller y G. B. Lamperti</text>
    
    <!-- Cita histórica envuelta en líneas cortas -->
    <text x="207" y="46" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">
      <tspan x="207" dy="0">"Dejar caer la mandíbula al extremo no abre la garganta;</tspan>
      <tspan x="207" dy="16">la estrangula al empujar la lengua hacia atrás</tspan>
      <tspan x="207" dy="16">y anular los armónicos del cantante."</tspan>
    </text>

    <line x1="40" y1="95" x2="374" y2="95" stroke="#fecaca" stroke-width="1"/>

    <!-- Puntos de valoración sin desbordar -->
    <text x="207" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7f1d1d">
      <tspan x="207" dy="0">Defecto Resultante:</tspan>
      <tspan x="207" dy="15" font-weight="600" fill="#991b1b">Engolamiento crónico (Knödel) y dicción ininteligible</tspan>
    </text>

    <text x="207" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">
      <tspan x="207" dy="0">Fallo Acústico en el Escenario:</tspan>
      <tspan x="207" dy="15" font-weight="500" fill="#7f1d1d">Pérdida de penetración ante la masa orquestal moderna</tspan>
    </text>
  </g>
</svg>