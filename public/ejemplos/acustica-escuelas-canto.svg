<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 680" width="100%" height="auto" style="background:#fdfbf7; border:1px solid #dcd6cd; border-radius:4px; padding:6px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); font-family: 'Cinzel', 'Baskerville', 'Georgia', serif;">
  <defs>
    <pattern id="laidPaper_PLANCHE_XIX" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#f4efe6" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Fondo de papel antiguo verjurado -->
  <rect x="0" y="0" width="1040" height="680" fill="#fdfbf7"/>
  <rect x="0" y="0" width="1040" height="680" fill="url(#laidPaper_PLANCHE_XIX)"/>

  <!-- Doble marco clásico tipográfico estilo Diderot -->
  <rect x="12" y="12" width="1016" height="656" fill="none" stroke="#1e293b" stroke-width="2.5"/>
  <rect x="17" y="17" width="1006" height="646" fill="none" stroke="#475569" stroke-width="0.8"/>
  <rect x="21" y="21" width="998" height="638" fill="none" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="6,3"/>

  <!-- Viñetas en las esquinas -->
  <path d="M 23 35 L 35 23 M 23 23 L 35 35" stroke="#475569" stroke-width="0.8"/>
  <path d="M 1017 35 L 1005 23 M 1017 23 L 1005 35" stroke="#475569" stroke-width="0.8"/>
  <path d="M 23 645 L 35 657 M 23 657 L 35 645" stroke="#475569" stroke-width="0.8"/>
  <path d="M 1017 645 L 1005 657 M 1017 657 L 1005 645" stroke="#475569" stroke-width="0.8"/>

  <!-- Encabezado monumental enciclopédico -->
  <text x="520.0" y="44" text-anchor="middle" font-size="11" letter-spacing="0.2em" fill="#64748b" font-weight="600">ENCYCLOPÉDIE ANATOMIQUE ET MUSICOLOGIQUE DU BEL CANTO</text>
  <line x1="180" y1="52" x2="860" y2="52" stroke="#475569" stroke-width="0.8"/>
  <line x1="280" y1="55" x2="760" y2="55" stroke="#94a3b8" stroke-width="0.5"/>

  <text x="520.0" y="76" text-anchor="middle" font-size="15.5" letter-spacing="0.08em" fill="#0f172a" font-weight="700">PLANCHE XIX. — DES ÉCOLES HISTORIQUES ET DES RÉSONATEURS VOCAUX</text>
  <text x="520.0" y="95" text-anchor="middle" font-size="11.5" font-style="italic" fill="#475569">Profil spectral et conformation des cavités selon les écoles italienne, française et allemande</text>

  <!-- ==================== ÁREA DE ILUSTRACIÓN DEL GRABADO HISTÓRICO ==================== -->
  <g id="illustration">
    <!-- Marco del grabado -->
    <rect x="35" y="110" width="360" height="490" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
    <rect x="39" y="114" width="352" height="482" fill="none" stroke="#cbd5e1" stroke-width="0.6"/>

    <!-- Imagen calcográfica auténtica -->
    <image href="/ejemplos/grabado-tracto-vocal-sagital.png" x="45" y="120" width="340" height="470" preserveAspectRatio="xMidYMid meet"/>

    <!-- Rótulo de figura histórica -->
    <text x="215.0" y="613" text-anchor="middle" font-size="10.5" font-weight="700" letter-spacing="0.05em" fill="#334155">FIG. 1. — DÉTAIL ANATOMIQUE AU BURIN</text>

    <!-- Línea de llamada A -->
    <line x1="180" y1="210" x2="70" y2="180" stroke="#0f172a" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="180" cy="210" r="3" fill="#0f172a"/>
    <circle cx="70" cy="180" r="9" fill="#fdfbf7" stroke="#0f172a" stroke-width="1.2"/>
    <text x="70" y="183.5" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">A</text>

    <!-- Línea de llamada B -->
    <line x1="220" y1="310" x2="70" y2="300" stroke="#0f172a" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="220" cy="310" r="3" fill="#0f172a"/>
    <circle cx="70" cy="300" r="9" fill="#fdfbf7" stroke="#0f172a" stroke-width="1.2"/>
    <text x="70" y="303.5" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">B</text>

    <!-- Línea de llamada C -->
    <line x1="210" y1="430" x2="70" y2="430" stroke="#0f172a" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="210" cy="430" r="3" fill="#0f172a"/>
    <circle cx="70" cy="430" r="9" fill="#fdfbf7" stroke="#0f172a" stroke-width="1.2"/>
    <text x="70" y="433.5" text-anchor="middle" font-size="10" font-weight="700" fill="#0f172a">C</text>
  </g>

  <!-- ==================== COLUMNA DEDICADA DE LEYENDA CLÁSICA ==================== -->
  <g transform="translate(420, 110)">
    <!-- Marco de leyenda -->
    <rect x="0" y="0" width="590" height="508" fill="#fcfbfa" stroke="#475569" stroke-width="1"/>
    <rect x="4" y="4" width="582" height="500" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>

    <!-- Título de la leyenda -->
    <text x="295.0" y="24" text-anchor="middle" font-size="11.5" font-weight="700" letter-spacing="0.08em" fill="#0f172a">EXPLICATION DES FIGURES &amp; TRADITIONS</text>
    <line x1="20" y1="32" x2="570" y2="32" stroke="#64748b" stroke-width="0.8"/>

    <!-- Ítem A -->
    <circle cx="18" cy="46" r="8" fill="#0f172a"/>
    <text x="18" y="50" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">A</text>
    <text x="32" y="50" font-size="10.5" font-weight="700" fill="#0f172a">Escuela Italiana (Chiaroscuro &amp; Appoggio)</text>
    <text x="32" y="66" font-size="9.5" fill="#334155">Laringe flotante en suspensión neutra, faringe abierta y elevación cigomática.</text>
    <text x="32" y="80" font-size="9.5" fill="#334155">Formante del cantante potente (2.8-3.2 kHz) con balance tímbrico redondo y brillante.</text>

    <!-- Ítem B -->
    <circle cx="18" cy="96" r="8" fill="#0f172a"/>
    <text x="18" y="100" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">B</text>
    <text x="32" y="100" font-size="10.5" font-weight="700" fill="#0f172a">Escuela Francesa (Clarté &amp; Déclamation)</text>
    <text x="32" y="116" font-size="9.5" fill="#334155">Tracto vocal ligeramente acortado, laringe más alta y articulación lingual avanzada.</text>
    <text x="32" y="130" font-size="9.5" fill="#334155">Prioridad a la inteligibilidad del texto, timbre claro y uso de vocales mixtas.</text>

    <!-- Ítem C -->
    <circle cx="18" cy="146" r="8" fill="#0f172a"/>
    <text x="18" y="150" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">C</text>
    <text x="32" y="150" font-size="10.5" font-weight="700" fill="#0f172a">Escuela Alemana (Klangfarbe &amp; Tiefstellung)</text>
    <text x="32" y="166" font-size="9.5" fill="#334155">Hundimiento laríngeo pronunciado, velo del paladar muy elevado y oscurecimiento del timbre.</text>
    <text x="32" y="180" font-size="9.5" fill="#334155">Sonido amplio y cavernoso con mayor resistencia laríngea para atravesar orquestas wagnerianas.</text>

    <!-- Ítem D -->
    <circle cx="18" cy="196" r="8" fill="#0f172a"/>
    <text x="18" y="200" text-anchor="middle" font-size="9.5" font-weight="700" fill="#ffffff">D</text>
    <text x="32" y="200" font-size="10.5" font-weight="700" fill="#0f172a">Escuela Anglosajona (Purity &amp; Head Dominance)</text>
    <text x="32" y="216" font-size="9.5" fill="#334155">Enfoque en la emisión etérea de cabeza, restricción del registro de pecho y afinación impecable,</text>
    <text x="32" y="230" font-size="9.5" fill="#334155">ideal para la polifonía coral pero vulnerable en grandes teatros operísticos.</text>
  </g>

  <!-- Pie de imprenta de la lámina -->
  <line x1="30" y1="642" x2="1010" y2="642" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="35" y="656" font-size="9" font-style="italic" fill="#64748b">Ars Cantorum Archivo Histórico • Diderot, Bourgery &amp; Gray calcographie</text>
  <text x="1005" y="656" text-anchor="end" font-size="9" letter-spacing="0.05em" fill="#64748b">EXEMPLAIRE ACADÉMIQUE DE RÉFÉRENCE</text>
</svg>