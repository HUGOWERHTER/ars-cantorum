<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 255" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <!-- Barra superior del título -->
  <rect x="10" y="8" width="860" height="34" rx="6" fill="#0f172a"/>
  <text x="440" y="30" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.06em">CONFIGURACIÓN BIOMECÁNICA Y ACÚSTICA SEGÚN LA TÉCNICA VOCAL</text>

  <!-- ==================== TARJETA A (ESCUELA ITALIANA: CHIAROSCURO) ==================== -->
  <rect x="15" y="50" width="272" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="16" y="51" width="270" height="30" rx="7" fill="#f0fdf4"/>
  <text x="28" y="71" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#15803d">A) Scuola Tradizionale (Chiaroscuro)</text>

  <!-- Diagrama esquemático A: Laringe flotante baja y faringe abierta -->
  <g transform="translate(30, 90)">
    <!-- Silueta del tracto vocal esquemático -->
    <path d="M 15 10 C 25 10, 45 15, 60 25 C 75 35, 80 50, 75 75 C 70 85, 65 95, 60 100" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M 15 35 C 30 35, 40 40, 45 50 C 50 65, 45 80, 40 100" fill="none" stroke="#64748b" stroke-width="2"/>
    <!-- Laringe equilibrada (verde) -->
    <rect x="35" y="85" width="30" height="14" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.8"/>
    <text x="50" y="95" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#15803d">LARINGE FLOTANTE</text>
    <!-- Espectro / Onda de equilibrio chiaroscuro -->
    <path d="M 110 90 Q 130 30, 150 90 T 190 90" fill="none" stroke="#16a34a" stroke-width="2"/>
    <circle cx="130" cy="60" r="3" fill="#16a34a"/>
    <text x="130" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#15803d">2.8–3.2 kHz</text>
    <text x="130" y="25" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#334155">Singing Formant</text>
    <text x="130" y="102" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748b">Faringe dilatada 6:1</text>
  </g>

  <!-- Píldora explicativa A -->
  <rect x="22" y="196" width="258" height="34" rx="5" fill="#f8fafc"/>
  <text x="151" y="210" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#1e293b">Equilibrio acústico óptimo</text>
  <text x="151" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#16a34a">Brillo en máscara + calidez faríngea</text>


  <!-- ==================== TARJETA B (ESCUELA ALEMANA: KEHLTIEFSTAND) ==================== -->
  <rect x="302" y="50" width="272" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="303" y="51" width="270" height="30" rx="7" fill="#fef2f2"/>
  <text x="315" y="71" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#b91c1c">B) Deutsche Schule (Kehltiefstand)</text>

  <!-- Diagrama esquemático B: Laringe forzada hacia abajo -->
  <g transform="translate(317, 90)">
    <!-- Silueta del tracto vocal hiper-alargado -->
    <path d="M 15 10 C 25 10, 45 15, 60 25 C 80 40, 90 60, 85 90 C 80 102, 70 110, 60 115" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M 15 35 C 30 35, 40 40, 45 50 C 52 70, 48 90, 40 115" fill="none" stroke="#64748b" stroke-width="2"/>
    <!-- Flechas empujando hacia abajo -->
    <line x1="50" y1="78" x2="50" y2="92" stroke="#dc2626" stroke-width="2"/>
    <polygon points="46,92 54,92 50,98" fill="#dc2626"/>
    <!-- Laringe deprimida fija (roja) -->
    <rect x="35" y="100" width="30" height="14" rx="4" fill="#fee2e2" stroke="#dc2626" stroke-width="1.8"/>
    <text x="50" y="110" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#b91c1c">DEPRESIÓN FIJA</text>
    <!-- Espectro oscuro sin squillo agudo -->
    <path d="M 110 90 Q 140 55, 160 85 T 190 90" fill="none" stroke="#dc2626" stroke-width="2"/>
    <text x="150" y="48" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#b91c1c">Dunkel (Oscuro)</text>
    <text x="150" y="25" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#334155">Pérdida de squillo</text>
    <text x="150" y="102" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#991b1b">Riesgo de Knödel (gutural)</text>
  </g>

  <!-- Píldora explicativa B -->
  <rect x="309" y="196" width="258" height="34" rx="5" fill="#f8fafc"/>
  <text x="438" y="210" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#1e293b">Volumen y peso torácico</text>
  <text x="438" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#b91c1c">Sobredilatación faríngea y rigidez</text>


  <!-- ==================== TARJETA C (CCM: TWANG & BELTING) ==================== -->
  <rect x="589" y="50" width="276" height="190" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="590" y="51" width="274" height="30" rx="7" fill="#eef2ff"/>
  <text x="602" y="71" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#4338ca">C) Contemporáneo (Twang &amp; Belting)</text>

  <!-- Diagrama esquemático C: Embudo epilaríngeo estrecho -->
  <g transform="translate(605, 90)">
    <!-- Silueta del tracto corto con boca abierta -->
    <path d="M 15 5 C 30 10, 50 15, 60 25 C 70 35, 68 50, 62 65 C 58 75, 55 82, 52 86" fill="none" stroke="#64748b" stroke-width="2"/>
    <path d="M 15 42 C 28 40, 36 45, 42 55 C 46 65, 44 75, 42 86" fill="none" stroke="#64748b" stroke-width="2"/>
    <!-- Estrechamiento epilaríngeo (AES) -->
    <path d="M 43 72 Q 47 72 49 76" stroke="#4f46e5" stroke-width="2.5" fill="none"/>
    <path d="M 51 72 Q 47 72 45 76" stroke="#4f46e5" stroke-width="2.5" fill="none"/>
    <!-- Laringe neutra/alta (azul/índigo) -->
    <rect x="33" y="82" width="30" height="14" rx="4" fill="#e0e7ff" stroke="#4f46e5" stroke-width="1.8"/>
    <text x="48" y="92" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#3730a3">LARINGE NEUTRA</text>
    <!-- Espectro hiper-brillante pico 3kHz -->
    <path d="M 110 90 L 135 85 L 145 28 L 155 85 L 185 90" fill="none" stroke="#4f46e5" stroke-width="2"/>
    <circle cx="145" cy="28" r="3.5" fill="#4f46e5"/>
    <text x="145" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#4338ca">Pico AES ~3 kHz</text>
    <text x="145" y="44" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#334155">Twang resonante</text>
    <text x="145" y="102" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#4338ca">Tracto corto + boca megáfono</text>
  </g>

  <!-- Píldora explicativa C -->
  <rect x="598" y="196" width="258" height="34" rx="5" fill="#f8fafc"/>
  <text x="727" y="210" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#1e293b">Penetración acústica incisiva</text>
  <text x="727" y="222" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#4338ca">Predominio TA / Constricción epilaríngea</text>
</svg>
