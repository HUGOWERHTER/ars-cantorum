<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 170" width="100%" height="auto" style="background:#ffffff; border:1px solid #e5ded4; border-radius:8px; padding:10px;">
  <!-- Título del ejemplo -->
  <text x="30" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#0f172a">EJEMPLO 2: EL TRINO CADENCIAL CON GIRO (Resolución Clásica)</text>
  
  <!-- Subtítulos -->
  <text x="70" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#92400e">A) Como está escrito en partitura</text>
  <text x="420" y="46" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#059669">B) Realización con Messa di Voce y Giro final</text>

  <!-- PENTAGRAMA A -->
  <g stroke="#334155" stroke-width="1.2">
    <line x1="60" y1="65" x2="350" y2="65"/>
    <line x1="60" y1="77" x2="350" y2="77"/>
    <line x1="60" y1="89" x2="350" y2="89"/>
    <line x1="60" y1="101" x2="350" y2="101"/>
    <line x1="60" y1="113" x2="350" y2="113"/>
    <line x1="60" y1="65" x2="60" y2="113" stroke-width="2"/>
    <line x1="350" y1="65" x2="350" y2="113" stroke-width="2"/>
  </g>
  <!-- Clave de Sol A -->
  <text x="70" y="106" font-family="serif" font-size="46" fill="#0f172a">𝄞</text>
  <!-- Símbolo de Trino "tr~~~~" -->
  <text x="160" y="48" font-family="'Plus Jakarta Sans', serif" font-size="18" font-weight="700" font-style="italic" fill="#92400e">tr ~~~~~~</text>
  <!-- Nota con trino (Sol4) Blanca con puntillo -->
  <ellipse cx="170" cy="89" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 170 89)"/>
  <circle cx="184" cy="89" r="2.5" fill="#0f172a"/>
  <line x1="176" y1="89" x2="176" y2="55" stroke="#0f172a" stroke-width="1.8"/>
  <!-- Dos notas de adorno de salida (Fa#4 y Sol4 en semicorcheas) -->
  <ellipse cx="270" cy="95" rx="4.5" ry="3.5" fill="#92400e" transform="rotate(-15 270 95)"/>
  <line x1="274" y1="95" x2="274" y2="70" stroke="#92400e" stroke-width="1.5"/>
  <ellipse cx="290" cy="89" rx="4.5" ry="3.5" fill="#92400e" transform="rotate(-15 290 89)"/>
  <line x1="294" y1="89" x2="294" y2="70" stroke="#92400e" stroke-width="1.5"/>
  <line x1="274" y1="70" x2="294" y2="70" stroke="#92400e" stroke-width="2.5"/> <!-- Barra doble semicorchea -->
  <line x1="274" y1="75" x2="294" y2="75" stroke="#92400e" stroke-width="1.8"/>
  <text x="255" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#64748b">Notas de escape</text>

  <!-- PENTAGRAMA B -->
  <g stroke="#334155" stroke-width="1.2">
    <line x1="410" y1="65" x2="720" y2="65"/>
    <line x1="410" y1="77" x2="720" y2="77"/>
    <line x1="410" y1="89" x2="720" y2="89"/>
    <line x1="410" y1="101" x2="720" y2="101"/>
    <line x1="410" y1="113" x2="720" y2="113"/>
    <line x1="410" y1="65" x2="410" y2="113" stroke-width="2"/>
    <line x1="720" y1="65" x2="720" y2="113" stroke-width="2"/>
  </g>
  <!-- Clave de Sol B -->
  <text x="420" y="106" font-family="serif" font-size="46" fill="#0f172a">𝄞</text>
  <!-- Regulador de Messa di voce (< >) -->
  <path d="M 470 52 L 530 46 L 470 40" stroke="#059669" stroke-width="1.4" fill="none"/>
  <path d="M 530 46 L 590 52 M 530 46 L 590 40" stroke="#059669" stroke-width="1.4" fill="none"/>
  <text x="500" y="34" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#059669">Messa di voce (&lt; &gt;)</text>
  <!-- Oscilación rápida de trino (Sol-La-Sol-La) -->
  <g fill="#0f172a" stroke="#0f172a">
    <ellipse cx="480" cy="89" rx="4" ry="3"/>
    <line x1="483" y1="89" x2="483" y2="66" stroke-width="1.2"/>
    <ellipse cx="498" cy="83" rx="4" ry="3"/>
    <line x1="501" y1="83" x2="501" y2="66" stroke-width="1.2"/>
    <ellipse cx="516" cy="89" rx="4" ry="3"/>
    <line x1="519" y1="89" x2="519" y2="66" stroke-width="1.2"/>
    <ellipse cx="534" cy="83" rx="4" ry="3"/>
    <line x1="537" y1="83" x2="537" y2="66" stroke-width="1.2"/>
    <ellipse cx="552" cy="89" rx="4" ry="3"/>
    <line x1="555" y1="89" x2="555" y2="66" stroke-width="1.2"/>
    <ellipse cx="570" cy="83" rx="4" ry="3"/>
    <line x1="573" y1="83" x2="573" y2="66" stroke-width="1.2"/>
    <!-- Barra de fusa/semicorchea -->
    <line x1="483" y1="66" x2="573" y2="66" stroke-width="3"/>
    <line x1="483" y1="71" x2="573" y2="71" stroke-width="1.5"/>
  </g>
  <!-- Giro final (Fa#4 - Sol4) y reposo -->
  <ellipse cx="615" cy="95" rx="4.5" ry="3.5" fill="#059669"/>
  <line x1="619" y1="95" x2="619" y2="68" stroke="#059669" stroke-width="1.5"/>
  <ellipse cx="635" cy="89" rx="4.5" ry="3.5" fill="#059669"/>
  <line x1="639" y1="89" x2="639" y2="68" stroke="#059669" stroke-width="1.5"/>
  <line x1="619" y1="68" x2="639" y2="68" stroke="#059669" stroke-width="2.5"/>
  <text x="605" y="134" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#059669">Resolución con giro</text>
  <!-- Nota de llegada tónica Do5 Blanca -->
  <ellipse cx="680" cy="77" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 680 77)"/>
  <line x1="686" y1="77" x2="686" y2="45" stroke="#0f172a" stroke-width="1.8"/>
</svg>
