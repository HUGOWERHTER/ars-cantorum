<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 215" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:10px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <!-- Barra superior del título -->
  <rect x="10" y="8" width="740" height="34" rx="6" fill="#e2e8f0"/>
  <text x="380" y="30" text-anchor="middle" font-family="'Cinzel', serif" font-size="13.5" font-weight="700" fill="#0f172a" letter-spacing="0.05em">EJEMPLO 2: TRINO CADENCIAL CON GIRO</text>

  <!-- ==================== TARJETA A (CÓMO SE ESCRIBE) ==================== -->
  <rect x="15" y="50" width="355" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="16" y="51" width="353" height="28" rx="7" fill="#fff7ed"/>
  <text x="30" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" fill="#c2410c">A) Cómo se escribe</text>

  <!-- Pentagrama A (5 líneas) -->
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="35" y1="98" x2="350" y2="98"/>
    <line x1="35" y1="108" x2="350" y2="108"/>
    <line x1="35" y1="118" x2="350" y2="118"/>
    <line x1="35" y1="128" x2="350" y2="128"/>
    <line x1="35" y1="138" x2="350" y2="138"/>
  </g>
  <!-- Clave de Sol A -->
  <text x="40" y="133" font-family="serif" font-size="44" fill="#0f172a">𝄞</text>

  <!-- Símbolo de trino "tr" -->
  <text x="142" y="86" font-family="serif" font-style="italic" font-weight="bold" font-size="18" fill="#0f172a">tr</text>

  <!-- Si4 Blanca (3ra línea) con trino -->
  <ellipse cx="148" cy="118" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 148 118)"/>
  <line x1="154" y1="118" x2="154" y2="90" stroke="#0f172a" stroke-width="1.8"/>

  <!-- Giro escrito: La4 (2do espacio) y Si4 (3ra línea) en corcheas con barra -->
  <ellipse cx="236" cy="123" rx="5.5" ry="4" fill="#0f172a" transform="rotate(-15 236 123)"/>
  <line x1="241" y1="123" x2="241" y2="98" stroke="#0f172a" stroke-width="1.8"/>

  <ellipse cx="266" cy="118" rx="5.5" ry="4" fill="#0f172a" transform="rotate(-15 266 118)"/>
  <line x1="271" y1="118" x2="271" y2="98" stroke="#0f172a" stroke-width="1.8"/>

  <line x1="241" y1="98" x2="271" y2="98" stroke="#0f172a" stroke-width="2.6"/>

  <!-- Do5 Blanca (3er espacio, Resolución) -->
  <ellipse cx="320" cy="113" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 320 113)"/>
  <line x1="314" y1="113" x2="314" y2="141" stroke="#0f172a" stroke-width="1.8"/>

  <!-- Píldora explicativa A -->
  <rect x="25" y="162" width="335" height="28" rx="5" fill="#f1f5f9"/>
  <text x="192" y="180" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11.5" fill="#334155">trino sobre la nota principal con giro final antes de la resolución</text>


  <!-- ==================== TARJETA B (CÓMO SE REALIZA) ==================== -->
  <rect x="390" y="50" width="355" height="152" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="391" y="51" width="353" height="28" rx="7" fill="#f0fdf4"/>
  <text x="405" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="13" fill="#15803d">B) Cómo se realiza</text>

  <!-- Pentagrama B (5 líneas) -->
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="410" y1="98" x2="725" y2="98"/>
    <line x1="410" y1="108" x2="725" y2="108"/>
    <line x1="410" y1="118" x2="725" y2="118"/>
    <line x1="410" y1="128" x2="725" y2="128"/>
    <line x1="410" y1="138" x2="725" y2="138"/>
  </g>
  <!-- Clave de Sol B -->
  <text x="415" y="133" font-family="serif" font-size="44" fill="#0f172a">𝄞</text>

  <!-- Grupo 1: 4 Semicorcheas (Si4 - Do5 - Si4 - Do5) -->
  <g fill="#0f172a">
    <ellipse cx="460" cy="118" rx="4.5" ry="3.5" transform="rotate(-15 460 118)"/>
    <ellipse cx="478" cy="113" rx="4.5" ry="3.5" transform="rotate(-15 478 113)"/>
    <ellipse cx="496" cy="118" rx="4.5" ry="3.5" transform="rotate(-15 496 118)"/>
    <ellipse cx="514" cy="113" rx="4.5" ry="3.5" transform="rotate(-15 514 113)"/>
    <!-- Plicas -->
    <line x1="464" y1="118" x2="464" y2="96" stroke="#0f172a" stroke-width="1.4"/>
    <line x1="482" y1="113" x2="482" y2="96" stroke="#0f172a" stroke-width="1.4"/>
    <line x1="500" y1="118" x2="500" y2="96" stroke="#0f172a" stroke-width="1.4"/>
    <line x1="518" y1="113" x2="518" y2="96" stroke="#0f172a" stroke-width="1.4"/>
    <!-- Doble barra -->
    <line x1="464" y1="96" x2="518" y2="96" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="464" y1="101" x2="518" y2="101" stroke="#0f172a" stroke-width="1.8"/>
  </g>

  <!-- Grupo 2: 4 Semicorcheas (Si4 - Do5 - Si4 - Do5) -->
  <g fill="#0f172a">
    <ellipse cx="536" cy="118" rx="4.5" ry="3.5" transform="rotate(-15 536 118)"/>
    <ellipse cx="554" cy="113" rx="4.5" ry="3.5" transform="rotate(-15 554 113)"/>
    <ellipse cx="572" cy="118" rx="4.5" ry="3.5" transform="rotate(-15 572 118)"/>
    <ellipse cx="590" cy="113" rx="4.5" ry="3.5" transform="rotate(-15 590 113)"/>
    <!-- Plicas -->
    <line x1="540" y1="118" x2="540" y2="96" stroke="#0f172a" stroke-width="1.4"/>
    <line x1="558" y1="113" x2="558" y2="96" stroke="#0f172a" stroke-width="1.4"/>
    <line x1="576" y1="118" x2="576" y2="96" stroke="#0f172a" stroke-width="1.4"/>
    <line x1="594" y1="113" x2="594" y2="96" stroke="#0f172a" stroke-width="1.4"/>
    <!-- Doble barra -->
    <line x1="540" y1="96" x2="594" y2="96" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="540" y1="101" x2="594" y2="101" stroke="#0f172a" stroke-width="1.8"/>
  </g>

  <!-- Giro: La4 y Si4 en corcheas con barra -->
  <g fill="#0f172a">
    <ellipse cx="616" cy="123" rx="5" ry="3.8" transform="rotate(-15 616 123)"/>
    <ellipse cx="638" cy="118" rx="5" ry="3.8" transform="rotate(-15 638 118)"/>
    <line x1="620" y1="123" x2="620" y2="98" stroke="#0f172a" stroke-width="1.6"/>
    <line x1="642" y1="118" x2="642" y2="98" stroke="#0f172a" stroke-width="1.6"/>
    <line x1="620" y1="98" x2="642" y2="98" stroke="#0f172a" stroke-width="2.5"/>
  </g>

  <!-- Do5 Blanca (Resolución en tónica) -->
  <ellipse cx="682" cy="113" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="2" transform="rotate(-15 682 113)"/>
  <line x1="676" y1="113" x2="676" y2="141" stroke="#0f172a" stroke-width="1.8"/>

  <!-- Píldora explicativa B -->
  <rect x="400" y="162" width="335" height="28" rx="5" fill="#f1f5f9"/>
  <text x="567" y="180" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="12" fill="#334155">alternancia si–do, giro la–si y resolución en do</text>
</svg>