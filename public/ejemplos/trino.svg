<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 270" width="100%" height="auto" style="background:#fdfbf7; border:1px solid #dcd6cd; border-radius:4px; padding:6px; box-shadow: 0 4px 18px rgba(0,0,0,0.06); font-family: 'Cinzel', 'Baskerville', 'Georgia', serif;">
  <!-- Doble marco clásico tipográfico estilo Diderot -->
  <rect x="10" y="10" width="840" height="250" fill="none" stroke="#1e293b" stroke-width="2"/>
  <rect x="14" y="14" width="832" height="242" fill="none" stroke="#475569" stroke-width="0.8"/>
  <rect x="18" y="18" width="824" height="234" fill="none" stroke="#94a3b8" stroke-width="0.5" stroke-dasharray="6,3"/>

  <!-- Encabezado de la lámina -->
  <text x="430" y="40" text-anchor="middle" font-size="10.5" letter-spacing="0.2em" fill="#64748b" font-weight="600">ENCYCLOPÉDIE MUSICOLOGIQUE DU BEL CANTO</text>
  <line x1="200" y1="46" x2="660" y2="46" stroke="#475569" stroke-width="0.8"/>
  <text x="430" y="64" text-anchor="middle" font-size="13.5" letter-spacing="0.08em" fill="#0f172a" font-weight="700">PLANCHE XIV-B. — DU TRILLO AVEC TERMINAISON (GRUPPETTO)</text>

  <!-- ==================== FIGURA 1: NOTATION ÉCRITE ==================== -->
  <g transform="translate(30, 80)">
    <rect x="0" y="0" width="380" height="135" fill="#fcfbfa" stroke="#475569" stroke-width="1"/>
    <rect x="3" y="3" width="374" height="129" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    <text x="190" y="22" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.05em" fill="#0f172a">FIG. 1. — SIGNE DU TRILLE SIMPLE (tr)</text>
    <line x1="30" y1="28" x2="350" y2="28" stroke="#cbd5e1" stroke-width="0.6"/>

    <!-- Pentagrama (5 líneas) -->
    <g stroke="#334155" stroke-width="1">
      <line x1="25" y1="52" x2="355" y2="52"/>
      <line x1="25" y1="62" x2="355" y2="62"/>
      <line x1="25" y1="72" x2="355" y2="72"/>
      <line x1="25" y1="82" x2="355" y2="82"/>
      <line x1="25" y1="92" x2="355" y2="92"/>
    </g>
    <!-- Clave de Sol -->
    <text x="30" y="87" font-family="serif" font-size="42" fill="#0f172a">𝄞</text>

    <!-- Símbolo trille clásico -->
    <text x="180" y="44" font-family="'Baskerville', serif" font-size="24" font-weight="bold" font-style="italic" fill="#0f172a">tr</text>

    <!-- Nota Sol4 con trino (Blanca) -->
    <ellipse cx="190" cy="72" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="1.8" transform="rotate(-15 190 72)"/>
    <line x1="196" y1="72" x2="196" y2="44" stroke="#0f172a" stroke-width="1.6"/>

    <!-- Nota de resolución Fa4 (Blanca) -->
    <ellipse cx="280" cy="77" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="1.8" transform="rotate(-15 280 77)"/>
    <line x1="286" y1="77" x2="286" y2="49" stroke="#0f172a" stroke-width="1.6"/>

    <text x="190" y="118" text-anchor="middle" font-size="9.5" font-style="italic" fill="#475569">Abreviatura tradicional en la partitura vocal antigua.</text>
  </g>

  <!-- ==================== FIGURA 2: EXÉCUTION RÉELLE ==================== -->
  <g transform="translate(450, 80)">
    <rect x="0" y="0" width="380" height="135" fill="#fcfbfa" stroke="#475569" stroke-width="1"/>
    <rect x="3" y="3" width="374" height="129" fill="none" stroke="#e2e8f0" stroke-width="0.6"/>
    <text x="190" y="22" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="0.05em" fill="#0f172a">FIG. 2. — DÉVELOPPEMENT DES OSCILLATIONS</text>
    <line x1="30" y1="28" x2="350" y2="28" stroke="#cbd5e1" stroke-width="0.6"/>

    <!-- Pentagrama (5 líneas) -->
    <g stroke="#334155" stroke-width="1">
      <line x1="25" y1="52" x2="355" y2="52"/>
      <line x1="25" y1="62" x2="355" y2="62"/>
      <line x1="25" y1="72" x2="355" y2="72"/>
      <line x1="25" y1="82" x2="355" y2="82"/>
      <line x1="25" y1="92" x2="355" y2="92"/>
    </g>
    <!-- Clave de Sol -->
    <text x="30" y="87" font-family="serif" font-size="42" fill="#0f172a">𝄞</text>

    <!-- Fórmulas de alternancia rápida (La4 - Sol4 - La4 - Sol4) en fusas/semifusas -->
    <!-- Haz de plicas agrupadas -->
    <line x1="110" y1="42" x2="250" y2="42" stroke="#0f172a" stroke-width="2.5"/>
    <line x1="110" y1="47" x2="250" y2="47" stroke="#0f172a" stroke-width="1.8"/>

    <!-- La4 -->
    <ellipse cx="115" cy="67" rx="5" ry="3.8" fill="#0f172a" transform="rotate(-15 115 67)"/>
    <line x1="119" y1="67" x2="119" y2="42" stroke="#0f172a" stroke-width="1.4"/>
    <!-- Sol4 -->
    <ellipse cx="150" cy="72" rx="5" ry="3.8" fill="#0f172a" transform="rotate(-15 150 72)"/>
    <line x1="154" y1="72" x2="154" y2="42" stroke="#0f172a" stroke-width="1.4"/>
    <!-- La4 -->
    <ellipse cx="185" cy="67" rx="5" ry="3.8" fill="#0f172a" transform="rotate(-15 185 67)"/>
    <line x1="189" y1="67" x2="189" y2="42" stroke="#0f172a" stroke-width="1.4"/>
    <!-- Sol4 -->
    <ellipse cx="220" cy="72" rx="5" ry="3.8" fill="#0f172a" transform="rotate(-15 220 72)"/>
    <line x1="224" y1="72" x2="224" y2="42" stroke="#0f172a" stroke-width="1.4"/>
    <!-- Terminación Fa#4 - Sol4 -->
    <ellipse cx="250" cy="77" rx="5" ry="3.8" fill="#0f172a" transform="rotate(-15 250 77)"/>
    <line x1="254" y1="77" x2="254" y2="42" stroke="#0f172a" stroke-width="1.4"/>

    <!-- Resolución final en Fa4 -->
    <ellipse cx="305" cy="77" rx="6.5" ry="5" fill="none" stroke="#0f172a" stroke-width="1.8" transform="rotate(-15 305 77)"/>
    <line x1="311" y1="77" x2="311" y2="49" stroke="#0f172a" stroke-width="1.6"/>

    <text x="190" y="118" text-anchor="middle" font-size="9.5" font-style="italic" fill="#475569">Oscilación laríngea veloz e igual con terminación en gruppetto.</text>
  </g>

  <!-- Pie de imprenta -->
  <line x1="30" y1="236" x2="830" y2="236" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="35" y="249" font-size="9" font-style="italic" fill="#64748b">Ars Cantorum Archivo • Traités historiques de Tosi, Mancini et Agricola</text>
  <text x="825" y="249" text-anchor="end" font-size="9" letter-spacing="0.05em" fill="#64748b">GRAVURE MUSICALE SUR CUIVRE</text>
</svg>