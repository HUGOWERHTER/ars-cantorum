<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <!-- Título Superior -->
  <rect x="10" y="8" width="880" height="36" rx="6" fill="#0f172a"/>
  <text x="450" y="31" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">ANATOMÍA DEL VIBRATO: MODULACIÓN FISIOLÓGICA vs. DEFECTOS</text>

  <!-- ==================== PANEL 1: STRAIGHT TONE ==================== -->
  <rect x="15" y="54" width="210" height="240" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="16" y="55" width="208" height="32" rx="7" fill="#f8fafc"/>
  <text x="120" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#334155">1. Voz Recta (Straight-Tone)</text>

  <!-- Onda plana estática -->
  <g transform="translate(25, 95)">
    <line x1="10" y1="50" x2="175" y2="50" stroke="#64748b" stroke-width="2.5"/>
    <text x="95" y="35" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#64748b">Cero modulación (0 Hz)</text>
    <text x="95" y="70" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#475569">Rigidez muscular fija</text>
  </g>
  <rect x="22" y="185" width="196" height="95" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="120" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#1e293b">Dogma Historicista</text>
  <text x="120" y="223" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10" fill="#475569">Sonido blanco y desvitalizado</text>
  <text x="120" y="243" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#64748b">Inhibición artificial del reflejo</text>
  <text x="120" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#dc2626">Sobrecarga laríngea acumulada</text>

  <!-- ==================== PANEL 2: VIBRATO SALUDABLE ==================== -->
  <rect x="235" y="54" width="220" height="240" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="236" y="55" width="218" height="32" rx="7" fill="#f0fdf4"/>
  <text x="345" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#15803d">2. Vibrato Libre Canónico</text>

  <!-- Onda senoidal perfecta -->
  <g transform="translate(245, 95)">
    <path d="M 10 50 Q 25 25 40 50 T 70 50 T 100 50 T 130 50 T 160 50 T 190 50" stroke="#16a34a" stroke-width="2.2" fill="none"/>
    <text x="100" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#15803d">5.5 – 6.5 Hz (Ciclos/seg)</text>
    <text x="100" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#166534">Amplitud: ± 0.5 semitono</text>
  </g>
  <rect x="242" y="185" width="206" height="95" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="345" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#15803d">El Ideal del Bel Canto</text>
  <text x="345" y="223" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10" fill="#14532d">Relajación neuromuscular pura</text>
  <text x="345" y="243" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#14532d">Oscilación libre del cricotiroideo</text>
  <text x="345" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#15803d">Calidez, riqueza y salud cordal</text>

  <!-- ==================== PANEL 3: WOBBLE (OSCILACIÓN LENTA) ==================== -->
  <rect x="465" y="54" width="210" height="240" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.2"/>
  <rect x="466" y="55" width="208" height="32" rx="7" fill="#fffbeb"/>
  <text x="570" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#b45309">3. Oscilación Lenta (Wobble)</text>

  <!-- Onda lenta y desmedida -->
  <g transform="translate(475, 95)">
    <path d="M 10 50 Q 40 10 70 50 T 130 50 T 180 50" stroke="#f59e0b" stroke-width="2.5" fill="none"/>
    <text x="95" y="15" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#b45309">&lt; 4.5 Hz (Lenta y ancha)</text>
    <text x="95" y="80" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#92400e">Amplitud: &gt; 1.5 semitonos</text>
  </g>
  <rect x="472" y="185" width="196" height="95" rx="6" fill="#fffbeb" stroke="#fde68a"/>
  <text x="570" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#92400e">Voce Ballerina</text>
  <text x="570" y="223" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10" fill="#78350f">Tambaleo y pérdida de afinación</text>
  <text x="570" y="243" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#92400e">Fatiga en soporte respiratorio</text>
  <text x="570" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#b45309">Debilidad del tono tiroaritenoideo</text>

  <!-- ==================== PANEL 4: TRÉMOLO CAPRINO ==================== -->
  <rect x="685" y="54" width="200" height="240" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
  <rect x="686" y="55" width="198" height="32" rx="7" fill="#fef2f2"/>
  <text x="785" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#b91c1c">4. Trémolo Caprino (Bleat)</text>

  <!-- Onda nerviosa ultra rápida -->
  <g transform="translate(695, 95)">
    <path d="M 5 50 Q 15 35 25 50 T 45 50 T 65 50 T 85 50 T 105 50 T 125 50 T 145 50 T 165 50 T 175 50" stroke="#ef4444" stroke-width="1.8" fill="none"/>
    <text x="90" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#991b1b">&gt; 7.5 Hz (Rápida y temblorosa)</text>
    <text x="90" y="75" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#7f1d1d">Espasmo constrictor</text>
  </g>
  <rect x="692" y="185" width="186" height="95" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="785" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">Voz de Cabra</text>
  <text x="785" y="223" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10" fill="#7f1d1d">Afonía nerviosa y rigidez</text>
  <text x="785" y="243" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#7f1d1d">Constricción suprahioidea</text>
  <text x="785" y="258" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#991b1b">Condenado por Bovicelli (1594)</text>
</svg>