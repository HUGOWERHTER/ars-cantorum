<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="930" height="36" rx="6" fill="#0f172a"/>
  <text x="480" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">ANATOMÍA DEL VIBRATO: MODULACIÓN FISIOLÓGICA vs. DEFECTOS</text>

  <!-- COL 1: STRAIGHT TONE -->
  <rect x="15" y="56" width="220" height="370" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <rect x="16" y="57" width="218" height="32" rx="7" fill="#f8fafc"/>
  <text x="125" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#334155">1. Voz Recta (Straight-Tone)</text>

  <g transform="translate(25, 100)">
    <rect x="0" y="0" width="200" height="115" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <line x1="20" y1="58" x2="180" y2="58" stroke="#64748b" stroke-width="3"/>
    <text x="100" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#64748b">Cero modulación (0 Hz)</text>
    <text x="100" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#475569">Rigidez muscular fija</text>
    <text x="100" y="102" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748b">Inhibición refleja</text>
  </g>

  <g transform="translate(25, 228)">
    <rect x="0" y="0" width="200" height="185" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="100" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#1e293b">Dogma Historicista</text>
    <text x="100" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10" fill="#475569">
      <tspan x="100" dy="0">Sonido blanco y frío:</tspan>
      <tspan x="100" dy="15">la inmovilización rígida</tspan>
      <tspan x="100" dy="15">del reflejo acústico natural.</tspan>
    </text>
    <line x1="20" y1="95" x2="180" y2="95" stroke="#cbd5e1" stroke-width="1"/>
    <text x="100" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#475569">
      <tspan x="100" dy="0" font-weight="700" fill="#334155">Consecuencias:</tspan>
      <tspan x="100" dy="14">• Sobrecarga laríngea</tspan>
      <tspan x="100" dy="14">• Timbre desvitalizado</tspan>
      <tspan x="100" dy="14">• Fatiga fonatoria</tspan>
    </text>
  </g>

  <!-- COL 2: VIBRATO LIBRE (VERDE) -->
  <rect x="250" y="56" width="225" height="370" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <rect x="251" y="57" width="223" height="32" rx="7" fill="#f0fdf4"/>
  <text x="362" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#15803d">2. Vibrato Libre Canónico</text>

  <g transform="translate(260, 100)">
    <rect x="0" y="0" width="205" height="115" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <path d="M 15 58 Q 28 35 42 58 T 70 58 T 98 58 T 126 58 T 154 58 T 182 58" stroke="#16a34a" stroke-width="2.5" fill="none"/>
    <text x="102" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#15803d">5.5 – 6.5 Ciclos/seg (Hz)</text>
    <text x="102" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#166534">Amplitud: ± 0.5 semitono</text>
    <text x="102" y="102" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="600" fill="#15803d">Oscilación libre CT / TA</text>
  </g>

  <g transform="translate(260, 228)">
    <rect x="0" y="0" width="205" height="185" rx="6" fill="#f0fdf4" stroke="#dcfce7"/>
    <text x="102" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#15803d">El Ideal del Bel Canto</text>
    <text x="102" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10" fill="#14532d">
      <tspan x="102" dy="0">Relajación neuromuscular:</tspan>
      <tspan x="102" dy="15">la voz respira con vida,</tspan>
      <tspan x="102" dy="15">calidez y pureza tímbrica.</tspan>
    </text>
    <line x1="20" y1="95" x2="185" y2="95" stroke="#bbf7d0" stroke-width="1"/>
    <text x="102" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#14532d">
      <tspan x="102" dy="0" font-weight="700" fill="#15803d">Virtudes Acústicas:</tspan>
      <tspan x="102" dy="14">• Longevidad y salud</tspan>
      <tspan x="102" dy="14">• Afinación flexible y viva</tspan>
      <tspan x="102" dy="14">• Messa di voce plena</tspan>
    </text>
  </g>

  <!-- COL 3: WOBBLE -->
  <rect x="490" y="56" width="220" height="370" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/>
  <rect x="491" y="57" width="218" height="32" rx="7" fill="#fffbeb"/>
  <text x="600" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#b45309">3. Oscilación Lenta (Wobble)</text>

  <g transform="translate(500, 100)">
    <rect x="0" y="0" width="200" height="115" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <path d="M 15 58 Q 50 15 85 58 T 155 58 T 185 58" stroke="#f59e0b" stroke-width="2.8" fill="none"/>
    <text x="100" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#b45309">&lt; 4.5 Hz (Lenta y ancha)</text>
    <text x="100" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#92400e">Amplitud: &gt; 1.5 semitonos</text>
    <text x="100" y="102" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#78350f">Pérdida de control motor</text>
  </g>

  <g transform="translate(500, 228)">
    <rect x="0" y="0" width="200" height="185" rx="6" fill="#fffbeb" stroke="#fef3c7"/>
    <text x="100" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#92400e">Voce Ballerina</text>
    <text x="100" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10" fill="#78350f">
      <tspan x="100" dy="0">Tambaleo y descontrol:</tspan>
      <tspan x="100" dy="15">el tono oscila sin rumbo,</tspan>
      <tspan x="100" dy="15">destruyendo la afinación.</tspan>
    </text>
    <line x1="20" y1="95" x2="180" y2="95" stroke="#fde68a" stroke-width="1"/>
    <text x="100" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#78350f">
      <tspan x="100" dy="0" font-weight="700" fill="#b45309">Causas Fisiológicas:</tspan>
      <tspan x="100" dy="14">• Fatiga del soporte respiratorio</tspan>
      <tspan x="100" dy="14">• Hipotonía tiroaritenoidea</tspan>
      <tspan x="100" dy="14">• Desgaste senil o por sobrepresión</tspan>
    </text>
  </g>

  <!-- COL 4: TREMOLO CAPRINO -->
  <rect x="725" y="56" width="220" height="370" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.3"/>
  <rect x="726" y="57" width="218" height="32" rx="7" fill="#fef2f2"/>
  <text x="835" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#b91c1c">4. Trémolo Caprino (Bleat)</text>

  <g transform="translate(735, 100)">
    <rect x="0" y="0" width="200" height="115" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <path d="M 10 58 Q 20 40 30 58 T 50 58 T 70 58 T 90 58 T 110 58 T 130 58 T 150 58 T 170 58 T 190 58" stroke="#ef4444" stroke-width="2" fill="none"/>
    <text x="100" y="25" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#991b1b">&gt; 7.5 Hz (Rápido y espasmódico)</text>
    <text x="100" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#7f1d1d">Espasmo constrictor laríngeo</text>
    <text x="100" y="102" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#991b1b">Tensión de base lingual</text>
  </g>

  <g transform="translate(735, 228)">
    <rect x="0" y="0" width="200" height="185" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
    <text x="100" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">Voz de Cabra</text>
    <text x="100" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10" fill="#7f1d1d">
      <tspan x="100" dy="0">Afonía nerviosa y rigidez:</tspan>
      <tspan x="100" dy="15">temblor convulsivo que</tspan>
      <tspan x="100" dy="15">denota constricción extrema.</tspan>
    </text>
    <line x1="20" y1="95" x2="180" y2="95" stroke="#fecaca" stroke-width="1"/>
    <text x="100" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#7f1d1d">
      <tspan x="100" dy="0" font-weight="700" fill="#b91c1c">Condena Histórica:</tspan>
      <tspan x="100" dy="14">• Bovicelli (1594): vicio capital</tspan>
      <tspan x="100" dy="14">• Rigidez suprahioidea</tspan>
      <tspan x="100" dy="14">• Cierre espasmódico</tspan>
    </text>
  </g>
</svg>