<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <!-- Barra superior del título -->
  <rect x="10" y="8" width="880" height="36" rx="6" fill="#0f172a"/>
  <text x="450" y="31" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">LA REVOLUCIÓN DEL DO DE PECHO: NOURRIT vs. DUPREZ (1837)</text>

  <!-- ==================== PANEL IZQUIERDO: NOURRIT (FALSETTONE / VOIX MIXTE) ==================== -->
  <rect x="15" y="54" width="425" height="240" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="16" y="55" width="423" height="32" rx="7" fill="#f8fafc"/>
  <text x="228" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#334155">A) Tradición Clásica: Adolphe Nourrit (Voix Mixte / Falsettone)</text>

  <!-- Esquema Mecánico Nourrit -->
  <g transform="translate(30, 95)">
    <!-- Pentagrama con agudo etéreo -->
    <line x1="10" y1="20" x2="160" y2="20" stroke="#94a3b8" stroke-width="1"/>
    <line x1="10" y1="30" x2="160" y2="30" stroke="#94a3b8" stroke-width="1"/>
    <line x1="10" y1="40" x2="160" y2="40" stroke="#94a3b8" stroke-width="1"/>
    <line x1="10" y1="50" x2="160" y2="50" stroke="#94a3b8" stroke-width="1"/>
    <line x1="10" y1="60" x2="160" y2="60" stroke="#94a3b8" stroke-width="1"/>
    <text x="12" y="55" font-family="serif" font-size="32" fill="#475569">𝄞</text>
    <!-- Do5 / Do4 agudo ligero -->
    <ellipse cx="100" cy="10" rx="5.5" ry="4" fill="none" stroke="#0284c7" stroke-width="1.8" transform="rotate(-15 100 10)"/>
    <line x1="105" y1="10" x2="105" y2="35" stroke="#0284c7" stroke-width="1.5"/>
    <text x="118" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0284c7">Do4 / Ut4</text>

    <!-- Caja de Parámetros -->
    <rect x="180" y="5" width="195" height="75" rx="5" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="190" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Masa cordal delgada (M2)</text>
    <text x="190" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Predominio del músculo cricotiroideo</text>
    <text x="190" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Laringe en posición neutra-alta</text>
    <text x="190" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Timbre dulce, etéreo, menor volumen</text>
  </g>

  <!-- Espectro / Dinámica Nourrit -->
  <rect x="25" y="195" width="405" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="228" y="213" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1e293b">Estética del Bel Canto Rossiniano</text>
  <text x="228" y="230" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#475569">"La voz conserva la flexibilidad para filados, trinos y ornamentaciones ágiles."</text>
  <text x="228" y="248" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">Potencia sonora moderada • No compite con orquestas densas</text>
  <text x="228" y="264" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#0284c7">Rossini: El ideal de gracia, elegancia y pureza afectiva</text>

  <!-- ==================== PANEL DERECHO: DUPREZ (DO DI PETTO / VOCE COPERTA) ==================== -->
  <rect x="460" y="54" width="425" height="240" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.4"/>
  <rect x="461" y="55" width="423" height="32" rx="7" fill="#fef2f2"/>
  <text x="672" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">B) La Revolución: Gilbert Duprez (Do di Petto / Cobertura)</text>

  <!-- Esquema Mecánico Duprez -->
  <g transform="translate(475, 95)">
    <!-- Pentagrama con agudo heroico -->
    <line x1="10" y1="20" x2="160" y2="20" stroke="#94a3b8" stroke-width="1"/>
    <line x1="10" y1="30" x2="160" y2="30" stroke="#94a3b8" stroke-width="1"/>
    <line x1="10" y1="40" x2="160" y2="40" stroke="#94a3b8" stroke-width="1"/>
    <line x1="10" y1="50" x2="160" y2="50" stroke="#94a3b8" stroke-width="1"/>
    <line x1="10" y1="60" x2="160" y2="60" stroke="#94a3b8" stroke-width="1"/>
    <text x="12" y="55" font-family="serif" font-size="32" fill="#475569">𝄞</text>
    <!-- Do5 / Do4 agudo masivo -->
    <ellipse cx="100" cy="10" rx="6" ry="4.5" fill="#dc2626" stroke="#991b1b" stroke-width="1.8" transform="rotate(-15 100 10)"/>
    <line x1="105" y1="10" x2="105" y2="35" stroke="#991b1b" stroke-width="2"/>
    <text x="118" y="14" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#dc2626">Do4 Heroico</text>

    <!-- Caja de Parámetros -->
    <rect x="180" y="5" width="195" height="75" rx="5" fill="#fef2f2" stroke="#fecaca"/>
    <text x="190" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Masa cordal robusta (M1 activo)</text>
    <text x="190" y="39" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Músculo tiroaritenoideo anclado</text>
    <text x="190" y="52" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Laringe baja y faringe ensanchada</text>
    <text x="190" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Presión acústica masiva (Formante)</text>
  </g>

  <!-- Espectro / Dinámica Duprez -->
  <rect x="470" y="195" width="405" height="85" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
  <text x="672" y="213" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">El Nacimiento del Tenor Dramático Moderno</text>
  <text x="672" y="230" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11" fill="#7f1d1d">"El Do en voz de pecho atraviesa el tutti orquestal de Verdi y el Grand Opéra."</text>
  <text x="672" y="248" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#991b1b">Máxima penetración acústica • Pérdida de agilidad extrema</text>
  <text x="672" y="264" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#b91c1c">Rossini: 'El grito de un capón degollado' (El fin de una era)</text>
</svg>