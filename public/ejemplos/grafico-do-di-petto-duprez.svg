<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Revolución del Do de Pecho: Voix Mixte de Nourrit frente a Voce Coperta de Duprez">
  <defs>
    <style>
      .title { font-family: 'Cinzel', Georgia, serif; font-size: 19px; font-weight: 700; fill: #1C1B19; letter-spacing: 0.6px; }
      .subtitle { font-family: 'Newsreader', Georgia, serif; font-size: 13px; font-style: italic; fill: #1C1B19; opacity: 0.78; }
      .plate-num { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.8px; fill: #881337; text-transform: uppercase; }
      .sec-head { font-family: 'Cinzel', Georgia, serif; font-size: 13px; font-weight: 700; fill: #1C1B19; letter-spacing: 0.4px; }
      .sec-head-acc { font-family: 'Cinzel', Georgia, serif; font-size: 13px; font-weight: 700; fill: #881337; letter-spacing: 0.4px; }
      .lbl { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; fill: #1C1B19; }
      .lbl-b { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; font-weight: 700; fill: #1C1B19; }
      .lbl-acc { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; font-weight: 700; fill: #881337; }
      .lbl-sm { font-family: 'Newsreader', Georgia, serif; font-size: 11px; fill: #1C1B19; opacity: 0.85; }
      .mag { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 600; fill: #1C1B19; }
      .mag-acc { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 700; fill: #881337; }
      .mag-muted { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9.5px; fill: #1C1B19; opacity: 0.65; }
      .caption { font-family: 'Newsreader', Georgia, serif; font-size: 11.5px; fill: #1C1B19; opacity: 0.86; }
      .caption-b { font-family: 'Newsreader', Georgia, serif; font-size: 11.5px; font-weight: 700; fill: #1C1B19; }
      .hair { stroke: #1C1B19; stroke-width: 1; fill: none; }
      .hair-light { stroke: #1C1B19; stroke-width: 0.7; stroke-opacity: 0.35; fill: none; }
      .hair-dash { stroke: #1C1B19; stroke-width: 1.1; stroke-dasharray: 4 3; fill: none; }
      .ink-line { stroke: #1C1B19; stroke-width: 1.4; fill: none; }
      .acc-line { stroke: #881337; stroke-width: 1.8; fill: none; }
      .acc-dash { stroke: #881337; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
      .leader { stroke: #1C1B19; stroke-width: 0.85; stroke-opacity: 0.65; fill: none; }
    </style>
    <pattern id="hatch-ink" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.22"/>
    </pattern>
    <pattern id="hatch-acc" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.8" stroke-opacity="0.24"/>
    </pattern>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#1C1B19"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#881337"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#FAF8F5"/>
  <rect x="12" y="12" width="856" height="476" fill="none" stroke="#DCD6CD" stroke-width="1"/>
  <text x="36" y="42" class="plate-num">LÁMINA XXIII · ESTÉTICA Y BIOMECÁNICA DEL TENOR</text>
  <text x="36" y="66" class="title">El Do₄ de Guillaume Tell: Voix Mixte vs. Do di Petto</text>
  <text x="36" y="85" class="subtitle">París, 17 de abril de 1837: transición del mecanismo M2 al predominio M1 con cobertura acústica</text>
  <line x1="36" y1="98" x2="844" y2="98" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Left Panel: Musical Staff Engraving (Tenor 8vb, Fa#3 passaggio to Do4) -->
  <text x="36" y="122" class="sec-head">A. TESITURA Y ZONA DE PASAJE (TENOR 8vb)</text>
  <g transform="translate(36, 138)">
    <rect x="0" y="0" width="380" height="300" fill="none" stroke="#DCD6CD" stroke-width="0.9"/>
    <!-- 5 staff lines -->
    <line x1="28" y1="140" x2="352" y2="140" class="hair"/>
    <line x1="28" y1="156" x2="352" y2="156" class="hair"/>
    <line x1="28" y1="172" x2="352" y2="172" class="hair"/>
    <line x1="28" y1="188" x2="352" y2="188" class="hair"/>
    <line x1="28" y1="204" x2="352" y2="204" class="hair"/>
    <text x="42" y="190" font-family="'Newsreader', Georgia, serif" font-size="52" fill="#1C1B19">𝄞</text>
    <text x="53" y="220" class="mag-muted">8</text>

    <!-- Passaggio Note: Fa#3 (top line y=140) -->
    <text x="115" y="145" font-family="'Newsreader', Georgia, serif" font-size="18" fill="#1C1B19">♯</text>
    <ellipse cx="140" cy="140" rx="8" ry="6" transform="rotate(-18 140 140)" fill="#1C1B19"/>
    <line x1="147" y1="140" x2="147" y2="190" class="ink-line"/>
    <text x="140" y="242" text-anchor="middle" class="lbl-b">Fa♯₃ (Passaggio)</text>
    <text x="140" y="258" text-anchor="middle" class="mag-muted">~370 Hz · límite M1 abierto</text>

    <!-- Ascending slur / arrow -->
    <path d="M 162,130 Q 210,85 262,92" class="acc-dash" marker-end="url(#arr-acc)"/>

    <!-- High C (Do4): two ledger lines above staff (y=124, y=108; note at y=108) -->
    <line x1="264" y1="124" x2="296" y2="124" class="ink-line"/>
    <line x1="264" y1="108" x2="296" y2="108" class="ink-line"/>
    <ellipse cx="280" cy="108" rx="9" ry="6.5" transform="rotate(-18 280 108)" fill="#881337"/>
    <line x1="288" y1="108" x2="288" y2="158" class="acc-line"/>
    <text x="280" y="72" text-anchor="middle" class="lbl-acc">Do₄ («Suivez-moi!»)</text>
    <text x="280" y="88" text-anchor="middle" class="mag-acc">523 Hz (f₀)</text>

    <text x="190" y="284" text-anchor="middle" class="lbl-sm">El pasaje separa el pecho abierto del agudo heroico.</text>
  </g>

  <!-- Right Panel: Mechanistic & Acoustic Contrast -->
  <text x="438" y="122" class="sec-head-acc">B. DOS RESPUESTAS AL MISMO DO₄</text>
  <g transform="translate(438, 138)">
    <!-- Box 1: Nourrit -->
    <rect x="0" y="0" width="406" height="142" fill="none" stroke="#1C1B19" stroke-width="1"/>
    <rect x="0" y="0" width="406" height="28" fill="url(#hatch-ink)"/>
    <text x="16" y="19" class="sec-head">1. NOURRIT / RUBINI (VOIX MIXTE · M2)</text>
    <text x="16" y="48" class="lbl-b">Mecanismo cordal:</text>
    <text x="162" y="48" class="lbl-sm">Cricotiroideo dominante; bordes finos</text>
    <text x="16" y="72" class="lbl-b">Acústica (F1 vs 2f₀):</text>
    <text x="162" y="72" class="lbl-sm">F1 elevado · escasa carga epilaríngea</text>
    <text x="16" y="96" class="lbl-b">Timbre resultante:</text>
    <text x="162" y="96" class="lbl-sm">Dulce, plateado, ágil en coloratura</text>
    <text x="16" y="124" class="mag-muted">Ideal de Rossini: disimular el esfuerzo (celar l'arte)</text>

    <!-- Box 2: Duprez -->
    <rect x="0" y="158" width="406" height="142" fill="none" stroke="#881337" stroke-width="1.3"/>
    <rect x="0" y="158" width="406" height="28" fill="url(#hatch-acc)"/>
    <text x="16" y="177" class="sec-head-acc">2. DUPREZ (VOCE COPERTA · DO DI PETTO)</text>
    <text x="16" y="206" class="lbl-b">Mecanismo cordal:</text>
    <text x="150" y="206" class="lbl-acc">Tiroaritenoideo (M1) en el agudo</text>
    <text x="16" y="230" class="lbl-b">Acústica (F1 vs 2f₀):</text>
    <text x="150" y="230" class="lbl-sm">F1 &lt; 2f₀ (cobertura) + squillo 2.8–3.2 kHz</text>
    <text x="16" y="254" class="lbl-b">Timbre resultante:</text>
    <text x="150" y="254" class="lbl-acc">Compacto, metálico, gran squillo</text>
    <text x="16" y="282" class="mag-acc">Abre la vía al tenor dramático verdiano (Manrico, Otello)</text>
  </g>

  <line x1="36" y1="456" x2="844" y2="456" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="474" class="caption-b">Lectura histórico-acústica:</text>
  <text x="202" y="474" class="caption">La cobertura (aggiustamento) baja F1 por debajo del segundo armónico, permitiendo sostener M1 sin quiebre (Titze; Miller).</text>
</svg>