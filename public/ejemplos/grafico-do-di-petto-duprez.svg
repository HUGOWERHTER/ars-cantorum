<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="890" height="36" rx="6" fill="#0f172a"/>
  <text x="460" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">LA REVOLUCIÓN DEL DO DE PECHO: NOURRIT vs. DUPREZ (1837)</text>

  <!-- PANEL IZQUIERDO: NOURRIT -->
  <rect x="15" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
  <rect x="16" y="57" width="433" height="32" rx="7" fill="#f0f9ff"/>
  <text x="232" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0369a1">A) Tradición Clásica: Adolphe Nourrit (Voix Mixte / Falsettone)</text>

  <g transform="translate(25, 100)">
    <!-- Pentagrama -->
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="10" y1="28" x2="165" y2="28"/>
      <line x1="10" y1="38" x2="165" y2="38"/>
      <line x1="10" y1="48" x2="165" y2="48"/>
      <line x1="10" y1="58" x2="165" y2="58"/>
      <line x1="10" y1="68" x2="165" y2="68"/>
    </g>
    <!-- Clave de Sol tenor (8vb) -->
    <text x="12" y="62" font-family="serif" font-size="34" fill="#475569">𝄞</text>
    <text x="21" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#64748b">8</text>

    <!-- Líneas adicionales (La5 y Do6) -->
    <line x1="84" y1="18" x2="114" y2="18" stroke="#64748b" stroke-width="1.3"/>
    <line x1="84" y1="8" x2="114" y2="8" stroke="#64748b" stroke-width="1.3"/>

    <!-- Nota Do4 (Blanca, plica a la izquierda hacia abajo) -->
    <ellipse cx="99" cy="8" rx="5.5" ry="4" fill="none" stroke="#0284c7" stroke-width="1.8" transform="rotate(-15 99 8)"/>
    <line x1="93.5" y1="8" x2="93.5" y2="48" stroke="#0284c7" stroke-width="1.6"/>

    <text x="122" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#0284c7">Do4 / Ut4</text>
    <text x="122" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#64748b">2ª lín. adicional</text>

    <!-- Caja de Parámetros -->
    <rect x="175" y="0" width="235" height="115" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="187" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Masa Cordal Delgada (M2)</text>
    <text x="187" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Predominio del músculo cricotiroideo</text>
    <text x="187" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Laringe en suspensión neutra</text>
    <text x="187" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Timbre dulce, etéreo y flexible</text>
    <text x="187" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Presión subglótica moderada</text>
    <text x="187" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Máxima agilidad en coloraturas</text>
  </g>

  <g transform="translate(25, 228)">
    <rect x="0" y="0" width="414" height="185" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="207" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1e293b">Estética del Bel Canto Rossiniano</text>
    <text x="207" y="46" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#475569">
      <tspan x="207" dy="0">"La voz conserva la flexibilidad suprema</tspan>
      <tspan x="207" dy="16">para filados, trinos y ornamentaciones ágiles,</tspan>
      <tspan x="207" dy="16">manteniendo la dulzura en el sobreagudo."</tspan>
    </text>
    <line x1="40" y1="95" x2="374" y2="95" stroke="#e2e8f0" stroke-width="1"/>
    <text x="207" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">
      <tspan x="207" dy="0">Dinámica de Proyección Acústica:</tspan>
      <tspan x="207" dy="15" font-weight="600" fill="#0369a1">Volumen moderado • Orquestas clásicas transparentes</tspan>
    </text>
    <text x="207" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#0284c7">
      <tspan x="207" dy="0">El Juicio de Gioachino Rossini</tspan>
      <tspan x="207" dy="15" font-weight="500" fill="#334155">El ideal supremo de gracia, elegancia y pureza afectiva</tspan>
    </text>
  </g>

  <!-- PANEL DERECHO: DUPREZ -->
  <rect x="470" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="471" y="57" width="433" height="32" rx="7" fill="#fef2f2"/>
  <text x="687" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">B) La Revolución: Gilbert Duprez (Do di Petto / Cobertura)</text>

  <g transform="translate(480, 100)">
    <!-- Pentagrama -->
    <g stroke="#94a3b8" stroke-width="1">
      <line x1="10" y1="28" x2="165" y2="28"/>
      <line x1="10" y1="38" x2="165" y2="38"/>
      <line x1="10" y1="48" x2="165" y2="48"/>
      <line x1="10" y1="58" x2="165" y2="58"/>
      <line x1="10" y1="68" x2="165" y2="68"/>
    </g>
    <!-- Clave de Sol tenor (8vb) -->
    <text x="12" y="62" font-family="serif" font-size="34" fill="#475569">𝄞</text>
    <text x="21" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#64748b">8</text>

    <!-- Líneas adicionales (La5 y Do6) -->
    <line x1="84" y1="18" x2="114" y2="18" stroke="#64748b" stroke-width="1.3"/>
    <line x1="84" y1="8" x2="114" y2="8" stroke="#64748b" stroke-width="1.3"/>

    <!-- Nota Do4 Heroico (Negra, plica a la izquierda hacia abajo) -->
    <ellipse cx="99" cy="8" rx="5.8" ry="4.2" fill="#dc2626" stroke="#991b1b" stroke-width="1.8" transform="rotate(-15 99 8)"/>
    <line x1="93.5" y1="8" x2="93.5" y2="48" stroke="#991b1b" stroke-width="2"/>

    <text x="122" y="11" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#dc2626">Do4 Heroico</text>
    <text x="122" y="23" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#991b1b">2ª lín. adicional</text>

    <!-- Caja de Parámetros -->
    <rect x="175" y="0" width="235" height="115" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="187" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Masa Cordal Robusta (M1 Activo)</text>
    <text x="187" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Músculo tiroaritenoideo anclado</text>
    <text x="187" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Laringe baja y ensanchamiento faríngeo</text>
    <text x="187" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Formante del cantante (2.8–3.2 kHz)</text>
    <text x="187" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Presión acústica masiva sobre el tutti</text>
    <text x="187" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Pérdida irreversible de la coloratura fina</text>
  </g>

  <g transform="translate(480, 228)">
    <rect x="0" y="0" width="414" height="185" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
    <text x="207" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">El Nacimiento del Tenor Dramático</text>
    <text x="207" y="46" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">
      <tspan x="207" dy="0">"El Do en voz de pecho atraviesa el tutti</tspan>
      <tspan x="207" dy="16">orquestal de Verdi y el Grand Opéra,</tspan>
      <tspan x="207" dy="16">marcando el triunfo del poder heroico."</tspan>
    </text>
    <line x1="40" y1="95" x2="374" y2="95" stroke="#fecaca" stroke-width="1"/>
    <text x="207" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#7f1d1d">
      <tspan x="207" dy="0">Consecuencia Dramática y Fisiológica:</tspan>
      <tspan x="207" dy="15" font-weight="600" fill="#b91c1c">Máxima penetración acústica • Enorme fatiga muscular</tspan>
    </text>
    <text x="207" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#991b1b">
      <tspan x="207" dy="0">La Sentencia Histórica de Rossini</tspan>
      <tspan x="207" dy="15" font-weight="500" fill="#7f1d1d">'El grito de un capón degollado' (El fin del clasicismo)</tspan>
    </text>
  </g>
</svg>