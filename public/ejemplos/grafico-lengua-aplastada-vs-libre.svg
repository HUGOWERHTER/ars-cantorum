<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchTongue" width="5" height="5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#881337" stroke-width="0.8" stroke-opacity="0.22"/>
    </pattern>
    <pattern id="hatchBad" width="5" height="5" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.15"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — BIOMECÁNICA SAGITAL: DEPRESIÓN LINGUAL vs. BASE LIBRE</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Por qué aplastar la lengua delante empuja su masa hidrostática contra la epiglotis y ancla el hueso hioides</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- DIVISOR CENTRAL FINO -->
  <line x1="440" y1="90" x2="440" y2="345" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.25" stroke-dasharray="3,3"/>

  <!-- IZQUIERDA: LENGUA APLASTADA (CONSTRICCIÓN) -->
  <text x="230" y="102" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="700" fill="#1C1B19">I. DEPRESIÓN FORZADA (SPOON-SHAPED)</text>
  <g transform="translate(80, 115)">
    <!-- Bóveda palatina y pared faríngea posterior -->
    <path d="M 35,45 Q 110,10 190,45 L 205,205" fill="none" stroke="#1C1B19" stroke-width="1.3"/>
    <!-- Mandíbula / incisivo inferior -->
    <path d="M 35,115 L 55,115 L 55,175" fill="none" stroke="#1C1B19" stroke-width="1.3"/>
    <!-- Epiglotis empujada hacia atrás -->
    <path d="M 188,165 Q 178,195 170,210" fill="none" stroke="#1C1B19" stroke-width="1.8"/>
    <!-- Lengua hundida adelante y abultada atrás -->
    <path d="M 55,125 Q 105,148 155,118 Q 192,115 190,165 Q 165,192 95,180 Z" fill="url(#hatchBad)" stroke="#1C1B19" stroke-width="1.5"/>
    <!-- Flechas de retroceso y tracción hioidea -->
    <path d="M 105,122 L 105,138 M 100,132 L 105,138 L 110,132" fill="none" stroke="#1C1B19" stroke-width="1.3"/>
    <path d="M 155,145 L 184,145 M 178,140 L 184,145 L 178,150" fill="none" stroke="#1C1B19" stroke-width="1.3"/>
    <!-- Leader lines -->
    <line x1="186" y1="138" x2="225" y2="112" stroke="#1C1B19" stroke-width="0.8"/>
    <text x="230" y="108" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#1C1B19">Colapso faríngeo</text>
    <text x="230" y="121" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">Raíz empuja epiglotis</text>

    <line x1="120" y1="184" x2="120" y2="212" stroke="#1C1B19" stroke-width="0.8"/>
    <text x="120" y="224" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#1C1B19">Hioides anclado</text>
  </g>

  <!-- DERECHA: BASE LINGUAL LIBRE -->
  <text x="655" y="102" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="700" fill="#881337">II. LENGUA ANTERIOR ELÁSTICA</text>
  <g transform="translate(505, 115)">
    <path d="M 35,45 Q 110,10 190,45 L 205,205" fill="none" stroke="#1C1B19" stroke-width="1.3"/>
    <path d="M 35,115 L 55,115 L 55,175" fill="none" stroke="#1C1B19" stroke-width="1.3"/>
    <!-- Epiglotis erguida, amplio espacio faríngeo -->
    <path d="M 162,165 Q 162,192 164,210" fill="none" stroke="#881337" stroke-width="1.8"/>
    <!-- Lengua arqueada hacia delante, ápice en incisivo -->
    <path d="M 55,115 Q 95,82 142,118 Q 158,145 156,172 Q 115,180 75,165 Z" fill="url(#hatchTongue)" stroke="#881337" stroke-width="1.6"/>
    <!-- Vector hacia delante -->
    <path d="M 110,98 L 78,98 M 84,93 L 78,98 L 84,103" fill="none" stroke="#881337" stroke-width="1.3"/>
    <!-- Leader lines -->
    <line x1="184" y1="115" x2="222" y2="108" stroke="#881337" stroke-width="0.9"/>
    <text x="227" y="108" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="700" fill="#881337">Faringe despejada</text>
    <text x="227" y="121" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">Relación 6:1 intacta</text>

    <line x1="55" y1="115" x2="22" y2="88" stroke="#881337" stroke-width="0.8"/>
    <text x="18" y="84" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#881337">Ápice suave</text>
    <text x="18" y="96" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">en incisivos</text>

    <line x1="118" y1="178" x2="118" y2="212" stroke="#881337" stroke-width="0.8"/>
    <text x="118" y="224" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#881337">Basculación libre</text>
  </g>

  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura anatómica:</tspan> Como hidrostato muscular, el volumen de la lengua es constante; hundir su dorso delante (izquierda)
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    desplaza su masa hacia la orofaringe, mientras que el arco anterior elástico (derecha) despeja la vía acústica posterior.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · LÁMINA SAGITAL FUNCIONAL (VENNARD 1967 · MCKINNEY · MILLER)</text>
</svg>
