<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="890" height="36" rx="6" fill="#0f172a"/>
  <text x="460" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">LA LENGUA EN EL CANTO: DEPRESIÓN FORZADA vs. BASE LINGUAL ELÁSTICA</text>

  <!-- PANEL A: LENGUA APLASTADA -->
  <rect x="15" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="16" y="57" width="433" height="32" rx="7" fill="#fef2f2"/>
  <text x="232" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">A) El Dogma de la Lengua Aplastada (Spoon-Shaped)</text>

  <g transform="translate(28, 102)">
    <rect x="0" y="0" width="160" height="118" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="80" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Tracción Retrógrada</text>
    <!-- Lengua hundida y retraída -->
    <path d="M 35 55 Q 80 72 125 50" stroke="#dc2626" stroke-width="3" fill="none"/>
    <path d="M 105 55 L 130 55 M 124 50 L 130 55 L 124 60" stroke="#991b1b" stroke-width="1.8" fill="none"/>
    <text x="80" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">Colapso Faríngeo</text>
    <text x="80" y="103" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#7f1d1d">Empuje sobre epiglotis</text>

    <rect x="172" y="0" width="236" height="118" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="184" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Efectos Biomecánicos:</text>
    <text x="184" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Contracción espasmódica del hiogloso</text>
    <text x="184" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Bloqueo del hueso hioides y tiroides</text>
    <text x="184" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Cierre parcial del tubo epilaríngeo</text>
    <text x="184" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Vocales indistinguibles y opacas</text>
    <text x="184" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#b91c1c">• Síndrome típico de voz engolada</text>
  </g>

  <g transform="translate(28, 232)">
    <rect x="0" y="0" width="408" height="180" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="204" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">Advertencia de McKinney y Miller</text>
    <text x="204" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">
      <tspan x="204" dy="0">"Presionar la lengua hacia abajo con una cuchara</tspan>
      <tspan x="204" dy="16">no crea espacio en la garganta: empuja la masa</tspan>
      <tspan x="204" dy="16">lingual hacia atrás y estrangula la faringe."</tspan>
    </text>
    <line x1="35" y1="94" x2="373" y2="94" stroke="#fecaca" stroke-width="1"/>
    <text x="204" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">
      <tspan x="204" dy="0">Consecuencia Fonética:</tspan>
      <tspan x="204" dy="14" font-weight="700" fill="#b91c1c">Destrucción de F2 en vocales anteriores (/i/, /e/)</tspan>
    </text>
    <text x="204" y="154" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#991b1b">
      <tspan x="204" dy="0">Trampa Pedagógica</tspan>
      <tspan x="204" dy="14" font-weight="500" fill="#7f1d1d">El alumno confunde sensación de "hueco" con rigidez muscular</tspan>
    </text>
  </g>

  <!-- PANEL B: LENGUA LIBRE -->
  <rect x="470" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
  <rect x="471" y="57" width="433" height="32" rx="7" fill="#f0fdf4"/>
  <text x="687" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#15803d">B) Lengua Anterior Elástica y Base Lingual Libre</text>

  <g transform="translate(483, 102)">
    <rect x="0" y="0" width="160" height="118" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="80" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#15803d">Postura Funcional</text>
    <!-- Lengua arqueada suavemente hacia delante -->
    <path d="M 35 60 Q 75 35 125 58" stroke="#16a34a" stroke-width="3" fill="none"/>
    <path d="M 55 42 L 35 42 M 41 37 L 35 42 L 41 47" stroke="#15803d" stroke-width="1.8" fill="none"/>
    <text x="80" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#15803d">Faringe Despejada</text>
    <text x="80" y="103" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#166534">Ápice en incisivos</text>

    <rect x="172" y="0" width="236" height="118" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="184" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#15803d">Fisiología Óptima:</text>
    <text x="184" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#166534">• Punta suave tras incisivos inferiores</text>
    <text x="184" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#166534">• Dorso libre para articular cada vocal</text>
    <text x="184" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#166534">• Espacio orofaríngeo abierto por reflejo</text>
    <text x="184" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#166534">• Laringe libre de tracción hioidea</text>
    <text x="184" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#15803d">• Máxima claridad de dicción y squillo</text>
  </g>

  <g transform="translate(483, 232)">
    <rect x="0" y="0" width="408" height="180" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="204" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803d">Consenso de Vennard y Doscher</text>
    <text x="204" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#166534">
      <tspan x="204" dy="0">"En las vocales agudas e incisivas (/i/, /e/),</tspan>
      <tspan x="204" dy="16">el dorso lingual debe arquearse libremente hacia</tspan>
      <tspan x="204" dy="16">adelante, despejando la cavidad faríngea posterior."</tspan>
    </text>
    <line x1="35" y1="94" x2="373" y2="94" stroke="#bbf7d0" stroke-width="1"/>
    <text x="204" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#166534">
      <tspan x="204" dy="0">Efecto en la Resonancia:</tspan>
      <tspan x="204" dy="14" font-weight="700" fill="#15803d">Proporción faríngea 6:1 intacta y timbre brillante</tspan>
    </text>
    <text x="204" y="154" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#16a34a">
      <tspan x="204" dy="0">Principio Rector</tspan>
      <tspan x="204" dy="14" font-weight="500" fill="#166534">La lengua es articuladora, jamás un depresor laríngeo</tspan>
    </text>
  </g>
</svg>
