<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" role="img" aria-label="Voce in maschera: conducción ósea desde el paladar duro frente a la imposibilidad acústica de los senos paranasales">
  <defs>
    <style>
      .title { font-family: 'Cinzel', Georgia, serif; font-size: 19px; font-weight: 700; fill: #1C1B19; letter-spacing: 0.6px; }
      .subtitle { font-family: 'Newsreader', Georgia, serif; font-size: 13px; font-style: italic; fill: #1C1B19; opacity: 0.78; }
      .plate-num { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 1.8px; fill: #881337; text-transform: uppercase; }
      .sec-head { font-family: 'Cinzel', Georgia, serif; font-size: 13px; font-weight: 700; fill: #1C1B19; letter-spacing: 0.4px; }
      .sec-head-acc { font-family: 'Cinzel', Georgia, serif; font-size: 13px; font-weight: 700; fill: #881337; letter-spacing: 0.4px; }
      .lbl { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; fill: #1C1B19; }
      .lbl-b { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; font-weight: 700; fill: #1C1B19; }
      .lbl-acc { font-family: 'Newsreader', Georgia, serif; font-size: 12.5px; font-weight: 700; fill: #881337; }
      .lbl-sm { font-family: 'Newsreader', Georgia, serif; font-size: 11px; fill: #1C1B19; opacity: 0.85; }
      .mag { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 600; fill: #1C1B19; }
      .mag-acc { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 10.5px; font-weight: 700; fill: #881337; }
      .mag-muted { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 9.5px; fill: #1C1B19; opacity: 0.65; }
      .caption { font-family: 'Newsreader', Georgia, serif; font-size: 11.5px; fill: #1C1B19; opacity: 0.86; }
      .caption-b { font-family: 'Newsreader', Georgia, serif; font-size: 11.5px; font-weight: 700; fill: #1C1B19; }
      .hair { stroke: #1C1B19; stroke-width: 1; fill: none; }
      .hair-light { stroke: #1C1B19; stroke-width: 0.7; stroke-opacity: 0.35; fill: none; }
      .hair-dash { stroke: #1C1B19; stroke-width: 1.1; stroke-dasharray: 4 3; fill: none; }
      .ink-line { stroke: #1C1B19; stroke-width: 1.4; fill: none; }
      .acc-line { stroke: #881337; stroke-width: 1.8; fill: none; }
      .acc-dash { stroke: #881337; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
      .leader { stroke: #1C1B19; stroke-width: 0.85; stroke-opacity: 0.65; fill: none; }
    </style>
    <pattern id="hatch-ink" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.22"/>
    </pattern>
    <pattern id="hatch-acc" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.8" stroke-opacity="0.24"/>
    </pattern>
    <marker id="arr-ink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#1C1B19"/>
    </marker>
    <marker id="arr-acc" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 2 L 8 5 L 1 8 z" fill="#881337"/>
    </marker>
  </defs>
  <rect width="880" height="500" fill="#FAF8F5"/>
  <rect x="12" y="12" width="856" height="476" fill="none" stroke="#DCD6CD" stroke-width="1"/>
  <text x="36" y="42" class="plate-num">LÁMINA XVIII · CONDUCCIÓN ÓSEA Y RESONANCIA</text>
  <text x="36" y="66" class="title">Voce in Maschera: Vibración Ósea vs. Fuga Nasal</text>
  <text x="36" y="85" class="subtitle">Por qué los senos paranasales son acústicamente inertes y qué origina el cosquilleo facial</text>
  <line x1="36" y1="98" x2="844" y2="98" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.3"/>

  <!-- Left Panel: Diderot-style Sagittal Schematic -->
  <text x="36" y="122" class="sec-head-acc">A. CORTE SAGITAL: CONDUCCIÓN ÓSEA vs. SENOS INERTES</text>
  <g transform="translate(36, 136)">
    <rect x="0" y="0" width="460" height="305" fill="none" stroke="#DCD6CD" stroke-width="0.9"/>

    <!-- Stylized sagittal profile outline (fine engraving ink) -->
    <path d="M 155,34 C 110,34 80,68 78,108 L 54,155 L 76,164 L 74,185 L 88,195 L 82,228 L 106,245 L 116,292" class="ink-line"/>
    <!-- Posterior pharyngeal wall -->
    <path d="M 272,42 C 294,95 292,185 282,292" class="ink-line"/>

    <!-- Frontal & Maxillary Sinuses (hatched absorbent mucosa + 1-3mm ostium) -->
    <path d="M 96,74 C 110,64 128,74 124,94 C 118,104 98,102 96,74 Z" fill="url(#hatch-ink)" stroke="#1C1B19" stroke-width="1"/>
    <path d="M 134,116 C 154,110 168,124 162,142 C 152,150 132,144 134,116 Z" fill="url(#hatch-ink)" stroke="#1C1B19" stroke-width="1"/>

    <!-- Hard Palate (curved bone reflector) -->
    <path d="M 96,178 Q 145,156 196,164" stroke="#1C1B19" stroke-width="2.4" fill="none"/>

    <!-- Soft Palate (Velum) ELEVATED sealing nasopharynx -->
    <path d="M 196,164 Q 242,146 276,136" class="acc-line"/>
    <circle cx="276" cy="136" r="3" fill="#881337"/>

    <!-- Velum LOWERED comparison (dashed) -->
    <path d="M 196,164 Q 228,176 238,202" class="hair-dash"/>

    <!-- Acoustic Energy rising from larynx/pharynx toward hard palate -->
    <path d="M 216,282 C 214,232 186,198 144,174" class="acc-line" marker-end="url(#arr-acc)"/>
    <path d="M 232,282 C 228,236 204,202 162,172" class="acc-dash" marker-end="url(#arr-acc)"/>

    <!-- Bone conduction vibrotactile ripples into cheekbones / nasal bridge -->
    <path d="M 136,164 Q 112,138 92,126" class="acc-dash" marker-end="url(#arr-acc)"/>
    <path d="M 142,162 Q 134,126 114,98" class="acc-dash"/>

    <!-- Oral radiation out through lips -->
    <path d="M 144,186 L 52,186" class="acc-line" marker-end="url(#arr-acc)"/>
    <text x="14" y="182" class="mag-acc">99.9%</text>
    <text x="14" y="196" class="lbl-sm">oral</text>

    <!-- Leader lines & annotations -->
    <line x1="124" y1="78" x2="284" y2="54" class="leader"/>
    <text x="288" y="52" class="lbl-b">Senos paranasales</text>
    <text x="288" y="66" class="lbl-sm">Ostia 1–3 mm · mucosa</text>
    <text x="288" y="80" class="mag-muted">Radiación externa: 0 dB</text>

    <line x1="246" y1="145" x2="284" y2="122" class="leader"/>
    <text x="288" y="120" class="lbl-acc">Velo elevado (sellado)</text>
    <text x="288" y="134" class="lbl-sm">Bloquea fuga a cavidad nasal</text>

    <line x1="236" y1="192" x2="284" y2="176" class="leader"/>
    <text x="288" y="174" class="lbl-sm">Velo caído (punteado)</text>
    <text x="288" y="188" class="mag-muted">Genera voce di naso</text>

    <line x1="146" y1="168" x2="284" y2="232" class="leader"/>
    <text x="288" y="230" class="lbl-b">Paladar duro y maxilar</text>
    <text x="288" y="244" class="lbl-sm">Impacto 2.8–3.2 kHz →</text>
    <text x="288" y="258" class="lbl-acc">conducción ósea facial</text>

    <text x="174" y="294" class="mag-muted">Hacia laringe (2.8–3.2 kHz)</text>
  </g>

  <!-- Right Panel: Diagnostic Matrix -->
  <text x="518" y="122" class="sec-head">B. DIAGNÓSTICO DIFERENCIAL</text>
  <g transform="translate(518, 136)">
    <rect x="0" y="0" width="326" height="145" fill="none" stroke="#881337" stroke-width="1.2"/>
    <rect x="0" y="0" width="326" height="28" fill="url(#hatch-acc)"/>
    <text x="14" y="19" class="sec-head-acc">MÁSCARA VERDADERA (ÓSEA)</text>
    <text x="14" y="48" class="lbl-b">1. Velo del paladar:</text>
    <text x="156" y="48" class="lbl-sm">elevado y hermético</text>
    <text x="14" y="72" class="lbl-b">2. Salida del sonido:</text>
    <text x="156" y="72" class="lbl-sm">100% por los labios</text>
    <text x="14" y="96" class="lbl-b">3. Test pinzamiento:</text>
    <text x="156" y="96" class="lbl-acc">timbre inalterado</text>
    <text x="14" y="122" class="lbl-sm">Síntoma reflejo del formante del cantante.</text>

    <rect x="0" y="160" width="326" height="145" fill="none" stroke="#1C1B19" stroke-width="1"/>
    <rect x="0" y="160" width="326" height="28" fill="url(#hatch-ink)"/>
    <text x="14" y="179" class="sec-head">FALSA MÁSCARA (NASALIZACIÓN)</text>
    <text x="14" y="208" class="lbl-b">1. Velo del paladar:</text>
    <text x="156" y="208" class="lbl-sm">descendido / abierto</text>
    <text x="14" y="232" class="lbl-b">2. Salida del sonido:</text>
    <text x="156" y="232" class="lbl-sm">fuga por fosas nasales</text>
    <text x="14" y="256" class="lbl-b">3. Test pinzamiento:</text>
    <text x="156" y="256" class="lbl-b">el sonido se ahoga</text>
    <text x="14" y="282" class="lbl-sm">Cornetes absorben armónicos agudos.</text>
  </g>

  <line x1="36" y1="456" x2="844" y2="456" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="474" class="caption-b">Lectura fisiológica:</text>
  <text x="160" y="474" class="caption">La sensación en la máscara es retroalimentación vibrotáctil ósea del paladar duro, no resonancia paranasal (Sundberg; Titze).</text>
</svg>