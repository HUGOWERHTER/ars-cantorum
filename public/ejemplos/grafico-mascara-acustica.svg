<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="890" height="36" rx="6" fill="#0f172a"/>
  <text x="460" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">"CANTAR EN LA MÁSCARA": ILUSIÓN SENSORIAL vs. REALIDAD ACÚSTICA</text>

  <!-- PANEL IZQUIERDO: EL MITO -->
  <rect x="15" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#ef4444" stroke-width="1.3"/>
  <rect x="16" y="57" width="433" height="32" rx="7" fill="#fef2f2"/>
  <text x="232" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">A) El Mito: Senos como Cajas de Resonancia</text>

  <g transform="translate(25, 100)">
    <!-- Perfil esquemático cabeza (x: 10 a 120) -->
    <path d="M 15 90 Q 15 15 60 15 Q 100 15 100 45 L 115 65 L 95 70 L 105 85 L 80 90 L 75 110" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <ellipse cx="82" cy="35" rx="10" ry="7" fill="#fecaca" stroke="#ef4444" stroke-width="1.2"/>
    <text x="82" y="38" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#991b1b">Frontal</text>
    <ellipse cx="88" cy="60" rx="11" ry="8" fill="#fecaca" stroke="#ef4444" stroke-width="1.2"/>
    <text x="88" y="63" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#991b1b">Maxilar</text>

    <!-- Caja Explicación (x: 140) -->
    <rect x="140" y="0" width="275" height="115" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="152" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Imposibilidad Física (Sundberg):</text>
    <text x="152" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Senos con orificios mínimos (ostia &lt; 2 mm)</text>
    <text x="152" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Tapizados de mucosa esponjosa absorbente</text>
    <text x="152" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Radiación acústica hacia el exterior: 0 dB</text>
    <text x="152" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• No pueden reforzar el volumen vocal</text>
    <text x="152" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#b91c1c">• Amplificación acústica exterior nula</text>
  </g>

  <g transform="translate(25, 228)">
    <rect x="0" y="0" width="414" height="185" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
    <text x="207" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">El Riesgo Pedagógico: La Voz Nasalizada</text>
    <text x="207" y="46" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">
      <tspan x="207" dy="0">"Intentar 'meter la voz en la nariz' fuerza</tspan>
      <tspan x="207" dy="16">el descenso del velo del paladar, produciendo</tspan>
      <tspan x="207" dy="16">una emisión gangosa, opaca y sin armónicos."</tspan>
    </text>
    <line x1="40" y1="92" x2="374" y2="92" stroke="#fecaca" stroke-width="1"/>
    <text x="207" y="114" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">
      <tspan x="207" dy="0">Consecuencia Fonética Directa:</tspan>
      <tspan x="207" dy="14" font-weight="600" fill="#b91c1c">Asfixia del formante del cantante y sonido opaco</tspan>
    </text>
    <text x="207" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#991b1b">
      <tspan x="207" dy="0">Condena Clásica de Pier Francesco Tosi (1723)</tspan>
      <tspan x="207" dy="14" font-weight="500" fill="#7f1d1d">«Il difetto del naso è fra i più abominevoli nel cantante»</tspan>
    </text>
  </g>

  <!-- PANEL DERECHO: LA REALIDAD CIENTIFICA -->
  <rect x="470" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.3"/>
  <rect x="471" y="57" width="433" height="32" rx="7" fill="#f0fdf4"/>
  <text x="687" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#15803d">B) Realidad: Retroalimentación Vibrotáctil</text>

  <g transform="translate(480, 100)">
    <!-- Perfil esquemático tracto libre (x: 10 a 115) -->
    <path d="M 15 90 Q 15 15 60 15 Q 100 15 100 45 L 115 65 L 95 70 L 105 85 L 80 90 L 75 110" fill="none" stroke="#16a34a" stroke-width="1.5"/>
    <path d="M 68 52 Q 80 52 94 54" stroke="#15803d" stroke-width="3" fill="none"/>
    <path d="M 68 52 Q 63 44 58 44" stroke="#22c55e" stroke-width="3" fill="none"/>
    <text x="50" y="40" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#15803d">Velo Alto</text>

    <!-- Ondas de vibración ósea y texto limpio SIN solapar -->
    <path d="M 98 44 Q 103 44 105 50 M 102 39 Q 108 39 110 47" stroke="#16a34a" stroke-width="2" fill="none" stroke-dasharray="2,2"/>
    <text x="100" y="30" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#15803d">Vibración</text>

    <!-- Caja Explicación (x: 140) -->
    <rect x="140" y="0" width="275" height="115" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="152" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#166534">Conducción Ósea y Acústica:</text>
    <text x="152" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• El paladar duro recibe ondas intensas</text>
    <text x="152" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Conducción ósea hacia maxilar y nasales</text>
    <text x="152" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• Squillo óptimo (clúster formántico 3 kHz)</text>
    <text x="152" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">• La vibración facial es síntoma, no causa</text>
    <text x="152" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#15803d">• El tracto bucofaríngeo es el resonador real</text>
  </g>

  <g transform="translate(480, 228)">
    <rect x="0" y="0" width="414" height="185" rx="6" fill="#f0fdf4" stroke="#dcfce7"/>
    <text x="207" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#15803d">La Regla Canónica: Sensación vs. Emisión</text>
    <text x="207" y="46" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#14532d">
      <tspan x="207" dy="0">"Canta en la sensación de la máscara,</tspan>
      <tspan x="207" dy="16">pero jamás a través de las fosas nasales:</tspan>
      <tspan x="207" dy="16">el velo sella el paso y la boca irradia el sonido."</tspan>
    </text>
    <line x1="40" y1="92" x2="374" y2="92" stroke="#bbf7d0" stroke-width="1"/>
    <text x="207" y="114" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#14532d">
      <tspan x="207" dy="0">Síntesis Acústica Superior:</tspan>
      <tspan x="207" dy="14" font-weight="600" fill="#15803d">Gola aperta en faringe + foco propioceptivo anterior</tspan>
    </text>
    <text x="207" y="152" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#166534">
      <tspan x="207" dy="0">Axioma Pedagógico del Bel Canto</tspan>
      <tspan x="207" dy="14" font-weight="500" fill="#14532d">Claridad frontal diamantina sustentada en amplio espacio interno</tspan>
    </text>
  </g>
</svg>