<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchOrq" width="5" height="5" patternTransform="rotate(-45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.16"/>
    </pattern>
    <pattern id="hatchFormant" width="5" height="5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#881337" stroke-width="0.9" stroke-opacity="0.22"/>
    </pattern>
  </defs>

  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Encabezado -->
  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — ENVOLVENTE ESPECTRAL: HABLA COTIDIANA vs. CANTO IMPOSTADO</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Distribución de energía acústica (dB) frente al espectro medio de una orquesta sinfónica (Sundberg)</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- GRILLA ESPECTRAL -->
  <g stroke="#1C1B19" stroke-opacity="0.12" stroke-width="0.8">
    <line x1="90" y1="130" x2="820" y2="130" stroke-dasharray="2,3"/>
    <line x1="90" y1="190" x2="820" y2="190" stroke-dasharray="2,3"/>
    <line x1="90" y1="250" x2="820" y2="250" stroke-dasharray="2,3"/>
    <!-- Verticales kHz: 1, 2, 3, 4 kHz (rango 0 a 4.5 kHz sobre x=90..820 -> 162px/kHz) -->
    <line x1="252" y1="100" x2="252" y2="310" stroke-dasharray="2,3"/>
    <line x1="414" y1="100" x2="414" y2="310" stroke-dasharray="2,3"/>
    <line x1="576" y1="100" x2="576" y2="310" stroke-dasharray="2,3"/>
    <line x1="738" y1="100" x2="738" y2="310" stroke-dasharray="2,3"/>
  </g>

  <!-- Ejes -->
  <line x1="90" y1="100" x2="90" y2="310" stroke="#1C1B19" stroke-width="1.2"/>
  <line x1="90" y1="310" x2="825" y2="310" stroke="#1C1B19" stroke-width="1.2"/>

  <!-- Etiquetas Eje Y -->
  <text x="78" y="134" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">90 dB</text>
  <text x="78" y="194" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">70 dB</text>
  <text x="78" y="254" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">50 dB</text>
  <text x="38" y="205" text-anchor="middle" transform="rotate(-90 38 205)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#57534E" letter-spacing="0.06em">ENERGÍA ACÚSTICA (dB)</text>

  <!-- Etiquetas Eje X (Frecuencia) -->
  <text x="90" y="328" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">0 Hz</text>
  <text x="252" y="328" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">1.0 kHz</text>
  <text x="414" y="328" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">2.0 kHz</text>
  <text x="576" y="328" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#881337">3.0 kHz</text>
  <text x="738" y="328" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">4.0 kHz</text>

  <!-- ÁREA DE LA ORQUESTA SINFÓNICA (pico en 400-600 Hz, cae tras 1.5 kHz) -->
  <path d="M 90,310 L 90,220 C 130,132 185,126 230,152 C 300,192 380,255 490,285 C 600,302 720,308 820,310 Z"
        fill="url(#hatchOrq)" stroke="#1C1B19" stroke-width="1" stroke-opacity="0.45"/>

  <!-- CURVA HABLA COTIDIANA (Marafioti literal: cae por debajo de la orquesta tras 1.5 kHz) -->
  <path d="M 90,238 C 140,175 200,172 260,205 C 330,242 420,278 540,295 C 650,305 740,309 820,310"
        fill="none" stroke="#1C1B19" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- ZONA DESTACADA DEL FORMANTE DEL CANTANTE (2.8 - 3.2 kHz) -->
  <path d="M 485,236 C 520,210 550,132 576,130 C 602,132 632,208 665,244 L 665,305 L 485,284 Z"
        fill="url(#hatchFormant)"/>

  <!-- CURVA CANTO IMPOSTADO (Singing Formant) -->
  <path d="M 90,235 C 145,148 210,145 270,185 C 340,232 420,242 485,230 C 525,212 550,132 576,130 C 602,132 632,212 675,252 C 725,285 775,298 820,304"
        fill="none" stroke="#881337" stroke-width="2.2"/>
  <circle cx="576" cy="130" r="4" fill="#881337"/>

  <!-- ANOTACIONES DIRECTAS CON LEADER LINES -->
  <line x1="172" y1="138" x2="205" y2="104" stroke="#1C1B19" stroke-width="0.9" stroke-opacity="0.6"/>
  <text x="210" y="102" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="600" fill="#1C1B19">Masa orquestal (400–600 Hz)</text>
  <text x="210" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Enmascara el habla sin impostar</text>

  <line x1="395" y1="264" x2="395" y2="176" stroke="#1C1B19" stroke-width="0.9" stroke-opacity="0.7"/>
  <text x="395" y="156" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="600" fill="#1C1B19">Habla cotidiana (caída &gt;1.5 kHz)</text>
  <text x="395" y="170" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Faringe estrecha · Sin tubo epilaríngeo</text>

  <line x1="576" y1="130" x2="612" y2="104" stroke="#881337" stroke-width="1"/>
  <text x="617" y="102" font-family="'Newsreader', Georgia, serif" font-size="12" font-weight="700" fill="#881337">Formante del Cantante (+20–30 dB)</text>
  <text x="617" y="116" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Clúster F3–F5 (2.8–3.2 kHz) · Relación 6:1</text>

  <!-- PIE DE FIGURA EDITORIAL -->
  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura espectral:</tspan> Por debajo de 1.5 kHz la orquesta cubre la emisión hablada; solo la reorganización epilaríngea
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    de la impostación lírica (curva burdeos) abre una ventana acústica de +20 a +30 dB alrededor de los 3.000 Hz.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · ANÁLISIS ESPECTRAL COMPARATIVO (MARAFIOTI 1922 · SUNDBERG 1987)</text>
</svg>
