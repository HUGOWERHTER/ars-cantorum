<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="890" height="36" rx="6" fill="#0f172a"/>
  <text x="460" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">EL DOGMA DE LA "VOZ NATURAL": HABLA COTIDIANA (MARAFIOTI) vs. ACÚSTICA OPERÍSTICA</text>

  <!-- PANEL A: HABLA -->
  <rect x="15" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <rect x="16" y="57" width="433" height="32" rx="7" fill="#fffbeb"/>
  <text x="232" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b45309">A) Emisión Hablada (Tesis de Mario Marafioti)</text>

  <g transform="translate(28, 102)">
    <rect x="0" y="0" width="160" height="118" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="80" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#b45309">Espectro del Habla</text>
    <line x1="20" y1="74" x2="140" y2="74" stroke="#92400e" stroke-width="1"/>
    <path d="M 22 40 Q 65 48 135 72" stroke="#d97706" stroke-width="2.5" fill="none"/>
    <text x="80" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#b45309">Cae tras 1.5 kHz</text>
    <text x="80" y="103" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#92400e">Sin pico de proyección</text>

    <rect x="172" y="0" width="236" height="118" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="184" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#b45309">Realidad del Habla:</text>
    <text x="184" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Laringe en posición alta/neutra móvil</text>
    <text x="184" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Faringe estrecha, sin tubo epilaríngeo</text>
    <text x="184" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Presión subglótica baja (6–8 cm H₂O)</text>
    <text x="184" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Enmascarada por la orquesta (500 Hz)</text>
    <text x="184" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#b45309">• Válida para micrófono, nula en teatro</text>
  </g>

  <g transform="translate(28, 232)">
    <rect x="0" y="0" width="408" height="180" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="204" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#b45309">La Paradoja del Método de Caruso</text>
    <text x="204" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#92400e">
      <tspan x="204" dy="0">"Marafioti confundió la naturalidad expresiva</tspan>
      <tspan x="204" dy="16">de la dicción de Caruso con la fisiología simple</tspan>
      <tspan x="204" dy="16">del habla cotidiana sin impostación."</tspan>
    </text>
    <line x1="35" y1="94" x2="373" y2="94" stroke="#fde68a" stroke-width="1"/>
    <text x="204" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">
      <tspan x="204" dy="0">Límite Acústico:</tspan>
      <tspan x="204" dy="14" font-weight="700" fill="#b45309">Hablar sobre 90 músicos requiere gritar y daña la voz</tspan>
    </text>
    <text x="204" y="154" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#d97706">
      <tspan x="204" dy="0">Valor Didáctico Real</tspan>
      <tspan x="204" dy="14" font-weight="500" fill="#92400e">Útil solo para liberar consonantes y evitar afectación</tspan>
    </text>
  </g>

  <!-- PANEL B: IMPOSTACIÓN -->
  <rect x="470" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
  <rect x="471" y="57" width="433" height="32" rx="7" fill="#f0f9ff"/>
  <text x="687" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0369a1">B) Tracto Vocal Impostado (Acústica Operística)</text>

  <g transform="translate(483, 102)">
    <rect x="0" y="0" width="160" height="118" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="80" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Singing Formant</text>
    <line x1="20" y1="74" x2="140" y2="74" stroke="#0369a1" stroke-width="1"/>
    <path d="M 22 45 Q 65 65 98 30 L 135 72" stroke="#0284c7" stroke-width="2.5" fill="none"/>
    <circle cx="98" cy="30" r="3.8" fill="#0284c7"/>
    <text x="80" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#0369a1">+20–30 dB a 3 kHz</text>
    <text x="80" y="103" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#0c4a6e">Relación faríngea 6:1</text>

    <rect x="172" y="0" width="236" height="118" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="184" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Transformación del Filtro:</text>
    <text x="184" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Descenso elástico de la laringe</text>
    <text x="184" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Expansión faríngea vs. tubo epilaríngeo</text>
    <text x="184" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Sintonización de formantes en el agudo</text>
    <text x="184" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Energía acústica donde la orquesta cae</text>
    <text x="184" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0369a1">• Proyección en sala de 3.000 butacas</text>
  </g>

  <g transform="translate(483, 232)">
    <rect x="0" y="0" width="408" height="180" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="204" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0369a1">Demostración Física de Johan Sundberg</text>
    <text x="204" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#0c4a6e">
      <tspan x="204" dy="0">"El canto lírico no es habla amplificada: es una</tspan>
      <tspan x="204" dy="16">reorganización geométrica del tracto vocal que</tspan>
      <tspan x="204" dy="16">crea un resonador independiente a 3.000 Hz."</tspan>
    </text>
    <line x1="35" y1="94" x2="373" y2="94" stroke="#bae6fd" stroke-width="1"/>
    <text x="204" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">
      <tspan x="204" dy="0">Síntesis Pedagógica:</tspan>
      <tspan x="204" dy="14" font-weight="700" fill="#0369a1">Naturalidad en la palabra + Impostación en la resonancia</tspan>
    </text>
    <text x="204" y="154" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#0284c7">
      <tspan x="204" dy="0">Principio Rector</tspan>
      <tspan x="204" dy="14" font-weight="500" fill="#0c4a6e">El instrumento se construye; la expresión permanece natural</tspan>
    </text>
  </g>
</svg>
