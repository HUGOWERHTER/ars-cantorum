<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchBelt" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.9" stroke-opacity="0.2"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — FRONTERAS DEL REGISTRO FEMENINO: MARCHESI vs. BELTING</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Distribución de los mecanismos M1 (pecho) y M2 (cabeza) según tres paradigmas estéticos y acústicos</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- EJE TONAL BASE -->
  <line x1="90" y1="305" x2="815" y2="305" stroke="#1C1B19" stroke-width="1.2"/>
  <g stroke="#1C1B19" stroke-opacity="0.16" stroke-width="0.8">
    <line x1="120" y1="110" x2="120" y2="305" stroke-dasharray="2,3"/>
    <line x1="250" y1="110" x2="250" y2="305" stroke-dasharray="2,3"/>
    <line x1="380" y1="100" x2="380" y2="305" stroke="#881337" stroke-opacity="0.55" stroke-width="1.2"/>
    <line x1="560" y1="110" x2="560" y2="305" stroke-dasharray="2,3"/>
    <line x1="760" y1="110" x2="760" y2="305" stroke-dasharray="2,3"/>
  </g>
  <text x="120" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Fa3</text>
  <text x="250" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Do4</text>
  <text x="380" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#881337">Mi4–Fa4 (Frontera Marchesi)</text>
  <text x="560" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Do5</text>
  <text x="760" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Do6</text>

  <!-- FILA 1: ESCUELA PURITANA VICTORIANA -->
  <text x="90" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#57534E">1. ESCUELA SIN PECHO (VICTORIANA)</text>
  <rect x="120" y="136" width="640" height="22" fill="none" stroke="#1C1B19" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="440" y="151" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11" fill="#57534E">M2 exclusivo en toda la escala (graves huecos y sin cuerpo)</text>

  <!-- FILA 2: BEL CANTO CLÁSICO (MARCHESI) -->
  <text x="90" y="188" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#881337">2. BEL CANTO CLÁSICO (MARCHESI)</text>
  <rect x="120" y="196" width="260" height="24" fill="url(#hatchBelt)" stroke="#881337" stroke-width="1.3"/>
  <rect x="380" y="196" width="380" height="24" fill="none" stroke="#881337" stroke-width="1.3"/>
  <text x="250" y="212" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="700" fill="#881337">M1 (Pecho limpio)</text>
  <text x="570" y="212" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#1C1B19">Voix mixte + M2 (Cabeza libre)</text>

  <!-- FILA 3: BELTING CONTEMPORÁNEO -->
  <text x="90" y="248" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#1C1B19">3. BELTING CONTEMPORÁNEO (BROADWAY)</text>
  <rect x="120" y="256" width="510" height="24" fill="#1C1B19" fill-opacity="0.08" stroke="#1C1B19" stroke-width="1.3"/>
  <text x="375" y="272" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#1C1B19">Extensión de M1 con F1 ≈ f0 (contacto &gt;65%) hasta Do5–Mi5</text>

  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura comparada:</tspan> Mientras la escuela victoriana suprimía el pecho y el belting lo extiende hasta Do5–Mi5 mediante
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    sintonía F1≈f0, el Bel Canto clásico (burdeos) usa M1 como cimiento grave y transiciona a M2 en Mi4–Fa4.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · REGISTROS FEMENINOS (MARCHESI OP. 31 · MILLER · TITZE · LEBORGNE)</text>
</svg>
