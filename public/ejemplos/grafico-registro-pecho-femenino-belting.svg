<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="890" height="36" rx="6" fill="#0f172a"/>
  <text x="460" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">EL REGISTRO DE PECHO FEMENINO: BEL CANTO CLÁSICO vs. LA CONTROVERSIA DEL BELTING</text>

  <!-- PANEL IZQUIERDO -->
  <rect x="15" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
  <rect x="16" y="57" width="433" height="32" rx="7" fill="#f0f9ff"/>
  <text x="232" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0369a1">A) Bel Canto Clásico: Marchesi y García (Pecho Integrado)</text>

  <g transform="translate(25, 100)">
    <rect x="0" y="0" width="414" height="115" rx="6" fill="#f8fafc" stroke="#bae6fd"/>
    <text x="15" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#0369a1">Zona Tradicional de Uso: Do3 a Mi4/Fa4</text>
    <text x="15" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Transición obligada al registro medio (M2) en Fa4</text>
    <text x="15" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Masa cordal plena que se aligera antes del pasaje</text>
    <text x="15" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Preservación absoluta de la voz de cabeza y sobreagudos</text>
    <text x="15" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Aporta cuerpo, nobleza y dramatismo sin estridencia</text>
    <text x="15" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#0284c7">Criterio estético: Base física indispensable del chiaroscuro</text>
  </g>

  <g transform="translate(25, 228)">
    <rect x="0" y="0" width="414" height="185" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="207" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#1e293b">Doctrina de Mathilde Marchesi</text>
    <text x="207" y="46" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#475569">
      <tspan x="207" dy="0">"Prohibir el pecho a la mujer destruye los cimientos</tspan>
      <tspan x="207" dy="16">del edificio vocal; pero llevarlo más allá de Fa4</tspan>
      <tspan x="207" dy="16">arruina irremediablemente el registro de cabeza."</tspan>
    </text>
    <line x1="40" y1="95" x2="374" y2="95" stroke="#e2e8f0" stroke-width="1"/>
    <text x="207" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#64748b">
      <tspan x="207" dy="0">Riesgo del Tabú Anglosajón:</tspan>
      <tspan x="207" dy="15" font-weight="600" fill="#0369a1">Voces huecas, descoloridas y sin fuerza dramática</tspan>
    </text>
    <text x="207" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#0284c7">
      <tspan x="207" dy="0">Integración Orgánica de Registros</tspan>
      <tspan x="207" dy="15" font-weight="500" fill="#334155">Graduación del tiroaritenoideo al cricotiroideo sin quiebre</tspan>
    </text>
  </g>

  <!-- PANEL DERECHO -->
  <rect x="470" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <rect x="471" y="57" width="433" height="32" rx="7" fill="#fffbeb"/>
  <text x="687" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b45309">B) La Controversia del Belting Moderno</text>

  <g transform="translate(480, 100)">
    <rect x="0" y="0" width="414" height="115" rx="6" fill="#f8fafc" stroke="#fde68a"/>
    <text x="15" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#b45309">Extensión Forzada de M1 hasta Do5 / Mi5</text>
    <text x="15" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#78350f">• Cociente de contacto glótico elevado (&gt; 65%)</text>
    <text x="15" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#78350f">• Presión subglótica duplicada respecto al lírico</text>
    <text x="15" y="76" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#78350f">• Acústica de habla amplificada (primer formante F1 sintonizado con 2f0)</text>
    <text x="15" y="92" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#78350f">• Laringe elevada y estrechamiento faríngeo intencional</text>
    <text x="15" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="600" fill="#b45309">Estilo predominante en teatro musical y música comercial</text>
  </g>

  <g transform="translate(480, 228)">
    <rect x="0" y="0" width="414" height="185" rx="6" fill="#fffbeb" stroke="#fef3c7"/>
    <text x="207" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#92400e">Análisis Acústico de Ingo Titze</text>
    <text x="207" y="46" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#78350f">
      <tspan x="207" dy="0">"El belting no es un defecto salvaje, sino una sintonía</tspan>
      <tspan x="207" dy="16">acústica precisa de alta energía; su peligro reside</tspan>
      <tspan x="207" dy="16">en el impacto mecánico por hiperpresión cordal."</tspan>
    </text>
    <line x1="40" y1="95" x2="374" y2="95" stroke="#fde68a" stroke-width="1"/>
    <text x="207" y="118" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#92400e">
      <tspan x="207" dy="0">Advertencia Foniátrica:</tspan>
      <tspan x="207" dy="15" font-weight="600" fill="#b45309">Riesgo elevado de fatiga y edema si carece de apoyo flexible</tspan>
    </text>
    <text x="207" y="156" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#92400e">
      <tspan x="207" dy="0">Diferencia de Paradigma Estético</tspan>
      <tspan x="207" dy="15" font-weight="500" fill="#78350f">Lírico: Chiaroscuro redondo • Belting: Proyección directa hiper-brillante</tspan>
    </text>
  </g>
</svg>