<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="910" height="36" rx="6" fill="#0f172a"/>
  <text x="470" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">EL ESPECTRO DEL CHIAROSCURO: LA SÍNTESIS ACÚSTICA DEL BEL CANTO</text>

  <!-- PANEL 1: SCURO -->
  <rect x="15" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#1e293b" stroke-width="1.3"/>
  <rect x="16" y="57" width="288" height="32" rx="7" fill="#0f172a"/>
  <text x="160" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#f8fafc">1. Polo Scuro (Profundidad / Cuerpo)</text>

  <g transform="translate(25, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="15" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0f172a">Configuración Acústica Grave:</text>
    <text x="15" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#334155">• Faringe amplia y flexible (gola aperta)</text>
    <text x="15" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#334155">• Laringe baja de forma elástica</text>
    <text x="15" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#334155">• Refuerzo armónico de F1 (300–600 Hz)</text>
    <text x="15" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#334155">• Amplitud del tracto posterior</text>
    <text x="15" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#0f172a">• Calidez, redondez y peso noble</text>
  </g>

  <g transform="translate(25, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0f172a">Aporte al Timbre Vocal</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#334155">
      <tspan x="135" dy="0">Nobleza, redondez y calidez:</tspan>
      <tspan x="135" dy="16">el terciopelo acústico</tspan>
      <tspan x="135" dy="16">que sostiene la estructura.</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#cbd5e1" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#475569">
      <tspan x="135" dy="0" font-weight="700" fill="#b91c1c">Riesgo si se desequilibra:</tspan>
      <tspan x="135" dy="15">• Si falta: voz infantil o estridente</tspan>
      <tspan x="135" dy="15">• Si abusa: voz engolada y sorda</tspan>
      <tspan x="135" dy="15" font-style="italic">(voce ingolata / caverna)</tspan>
    </text>
  </g>

  <!-- PANEL 2: SINTESIS EQUILIBRADA -->
  <rect x="325" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.4"/>
  <rect x="326" y="57" width="288" height="32" rx="7" fill="#f0f9ff"/>
  <text x="470" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#0369a1">2. Envolvente Espectral Equilibrada</text>

  <g transform="translate(335, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <!-- Ejes -->
    <line x1="25" y1="85" x2="245" y2="85" stroke="#64748b" stroke-width="1.2"/>
    <line x1="25" y1="85" x2="25" y2="15" stroke="#64748b" stroke-width="1.2"/>
    <text x="55" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#64748b">500 Hz</text>
    <text x="125" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" fill="#64748b">1.5 kHz</text>
    <text x="195" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-size="7.5" font-weight="700" fill="#0284c7">3 kHz</text>

    <!-- Curva Chiaroscuro -->
    <path d="M 30 80 Q 55 25 75 62 Q 110 75 145 70 Q 175 65 195 20 Q 210 45 235 83" stroke="#0284c7" stroke-width="2.5" fill="none"/>
    <circle cx="58" cy="30" r="4" fill="#1e293b"/>
    <text x="58" y="20" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#1e293b">Scuro</text>

    <circle cx="195" cy="20" r="4" fill="#0284c7"/>
    <text x="195" y="12" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="700" fill="#0284c7">Squillo</text>
  </g>

  <g transform="translate(335, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#0369a1">La Síntesis Canónica</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#0c4a6e">
      <tspan x="135" dy="0">"La luz dentro de la sombra:</tspan>
      <tspan x="135" dy="16">el squillo penetrante montado</tspan>
      <tspan x="135" dy="16">sobre la calidez profunda."</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#bae6fd" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">
      <tspan x="135" dy="0" font-weight="700" fill="#0284c7">Rendimiento Acústico:</tspan>
      <tspan x="135" dy="15">• Formante de 3 kHz viaja pleno</tspan>
      <tspan x="135" dy="15">• Atraviesa orquestas sin esfuerzo</tspan>
      <tspan x="135" dy="15" font-weight="600" fill="#0369a1">• Máxima longevidad vocal</tspan>
    </text>
  </g>

  <!-- PANEL 3: CHIARO -->
  <rect x="635" y="56" width="290" height="370" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.3"/>
  <rect x="636" y="57" width="288" height="32" rx="7" fill="#fffbeb"/>
  <text x="780" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11.5" fill="#b45309">3. Polo Chiaro (Claridad / Squillo)</text>

  <g transform="translate(645, 100)">
    <rect x="0" y="0" width="270" height="115" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="15" y="22" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#92400e">Configuración Acústica Aguda:</text>
    <text x="15" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#78350f">• Estrechamiento epilaríngeo (AES)</text>
    <text x="15" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#78350f">• Elevación cigomática (sonrisa noble)</text>
    <text x="15" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#78350f">• Clúster armónico F3–F5 (~3.000 Hz)</text>
    <text x="15" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#78350f">• Mordiente anterior proyectado</text>
    <text x="15" y="106" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#92400e">• Máxima inteligibilidad de texto</text>
  </g>

  <g transform="translate(645, 228)">
    <rect x="0" y="0" width="270" height="185" rx="6" fill="#fffbeb" stroke="#fef3c7"/>
    <text x="135" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#b45309">Aporte al Timbre Vocal</text>
    <text x="135" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#78350f">
      <tspan x="135" dy="0">Brillo metálico, filo y mordiente:</tspan>
      <tspan x="135" dy="16">la punta acústica que corta</tspan>
      <tspan x="135" dy="16">el espacio del teatro.</tspan>
    </text>
    <line x1="25" y1="98" x2="245" y2="98" stroke="#fde68a" stroke-width="1"/>
    <text x="135" y="122" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#78350f">
      <tspan x="135" dy="0" font-weight="700" fill="#b45309">Riesgo si se desequilibra:</tspan>
      <tspan x="135" dy="15">• Si falta: la voz se pierde (velata)</tspan>
      <tspan x="135" dy="15">• Si abusa: voz chillona y dura</tspan>
      <tspan x="135" dy="15" font-style="italic">(voce sguaiata / estridencia)</tspan>
    </text>
  </g>
</svg>