<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <!-- Trama de grabado fino para envolvente dinámica -->
    <pattern id="hatchBurdeos" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.9" stroke-opacity="0.22"/>
    </pattern>
  </defs>

  <!-- Marco fino editorial -->
  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Encabezado editorial -->
  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — ARQUITECTURA NEUROMUSCULAR DE LA MESSA DI VOCE</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Evolución simultánea de la presión sonora (dB), estabilidad de afinación (f0) y relevo cordal (M2 ↔ M1) en un solo aliento</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- GRILLA MUSICAL / TEMPORAL MINIMALISTA -->
  <g stroke="#1C1B19" stroke-opacity="0.12" stroke-width="0.8">
    <!-- Líneas horizontales de referencia dinámica/tonal -->
    <line x1="88" y1="125" x2="820" y2="125" stroke-dasharray="2,3"/>
    <line x1="88" y1="185" x2="820" y2="185"/>
    <line x1="88" y1="245" x2="820" y2="245" stroke-dasharray="2,3"/>
    <!-- Líneas verticales de fases temporales -->
    <line x1="210" y1="100" x2="210" y2="310" stroke-dasharray="3,4"/>
    <line x1="454" y1="100" x2="454" y2="310" stroke-dasharray="3,4"/>
    <line x1="698" y1="100" x2="698" y2="310" stroke-dasharray="3,4"/>
  </g>

  <!-- Ejes principales -->
  <line x1="88" y1="100" x2="88" y2="310" stroke="#1C1B19" stroke-width="1.2"/>
  <line x1="88" y1="310" x2="825" y2="310" stroke="#1C1B19" stroke-width="1.2"/>

  <!-- Etiquetas de Eje Y -->
  <text x="76" y="129" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12" fill="#1C1B19">ff</text>
  <text x="76" y="189" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12" fill="#1C1B19">mf</text>
  <text x="76" y="249" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12" fill="#1C1B19">pp</text>
  <text x="42" y="205" text-anchor="middle" transform="rotate(-90 42 205)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#57534E" letter-spacing="0.06em">AMPLITUD / DINÁMICA</text>

  <!-- Etiquetas de Eje X (Tiempo) -->
  <text x="148" y="328" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">0 s · Ataque</text>
  <text x="332" y="328" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">2–4 s · Crescendo</text>
  <text x="576" y="328" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">5–7 s · Diminuendo</text>
  <text x="760" y="328" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">8 s · Morendo</text>

  <!-- ENVOLVENTE CANÓNICA (pp -> ff -> pp) con trama de grabado -->
  <path d="M 110,185 C 180,183 310,130 454,122 C 598,130 728,183 798,185 C 728,187 598,240 454,248 C 310,240 180,187 110,185 Z"
        fill="url(#hatchBurdeos)" stroke="#881337" stroke-width="1.6"/>

  <!-- Línea central de afinación estable f0 (Canónica) -->
  <line x1="110" y1="185" x2="798" y2="185" stroke="#881337" stroke-width="1.3"/>
  <circle cx="110" cy="185" r="3.5" fill="#881337"/>
  <circle cx="454" cy="122" r="3.5" fill="#881337"/>
  <circle cx="798" cy="185" r="3.5" fill="#881337"/>

  <!-- TRAZO COMPARATIVO PUNTEADO: FALLO MODERNO (Quiebre y calado en el diminuendo) -->
  <path d="M 110,185 C 190,185 330,138 454,132 L 540,148 L 555,212 C 620,225 690,234 745,238"
        fill="none" stroke="#1C1B19" stroke-width="1.4" stroke-dasharray="5,4" stroke-opacity="0.75"/>
  <circle cx="548" cy="180" r="4" fill="#FAF8F5" stroke="#1C1B19" stroke-width="1.4"/>

  <!-- ANOTACIONES DIRECTAS CON LEADER LINES -->
  <!-- Anotación 1: Ataque M2 -->
  <line x1="110" y1="185" x2="132" y2="120" stroke="#881337" stroke-width="0.9"/>
  <text x="136" y="114" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="600" fill="#881337">Inicio en M2 fino</text>
  <text x="136" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Cierre limpio sin escape aéreo</text>

  <!-- Anotación 2: Cuspide M1+M2 -->
  <line x1="454" y1="122" x2="436" y2="96" stroke="#881337" stroke-width="0.9"/>
  <text x="430" y="96" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="600" fill="#881337">Plenitud (M1 + M2)</text>
  <text x="430" y="110" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Aducción máxima sin ascenso laríngeo</text>

  <!-- Anotación 3: Quiebre moderno -->
  <line x1="552" y1="210" x2="585" y2="270" stroke="#1C1B19" stroke-width="0.9" stroke-opacity="0.7"/>
  <text x="590" y="274" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#1C1B19">Fallo moderno: quiebre y calado</text>
  <text x="590" y="288" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Salto brusco M1 → M2 al ceder presión</text>

  <!-- Anotación 4: Appoggio en diminuendo -->
  <line x1="765" y1="185" x2="738" y2="128" stroke="#881337" stroke-width="0.9"/>
  <text x="734" y="114" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="600" fill="#881337">Retorno al filato (pp)</text>
  <text x="734" y="128" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Retención costal máxima · f0 inalterada</text>

  <!-- PIE DE FIGURA EDITORIAL -->
  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura acústica:</tspan> La envolvente continua (burdeos) exige que el <tspan font-style="italic">appoggio</tspan> retenga el aire con mayor firmeza durante el <tspan font-style="italic">diminuendo</tspan>;
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    cuando la caja torácica colapsa antes de tiempo (línea punteada), la glotis se desengancha y la afinación desciende.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · LÁMINA COMPARATIVA DE DINÁMICA VOCAL (CACCINI 1601 · TOSI 1723 · GARCÍA II 1894)</text>
</svg>
