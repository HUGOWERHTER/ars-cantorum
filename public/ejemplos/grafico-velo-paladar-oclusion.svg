<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <!-- Barra superior del título -->
  <rect x="10" y="8" width="880" height="36" rx="6" fill="#0f172a"/>
  <text x="450" y="31" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">EL VELO DEL PALADAR EN EL CANTO: ELEVACIÓN ELÁSTICA vs. CONSTRICCIÓN FARÍNGEA</text>

  <!-- ==================== PANEL IZQUIERDO: ELEVACIÓN ELÁSTICA ==================== -->
  <rect x="15" y="54" width="425" height="252" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.3"/>
  <rect x="16" y="55" width="423" height="32" rx="7" fill="#f0f9ff"/>
  <text x="228" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#0369a1">A) Cierre Velofaríngeo Elástico y Saludable</text>

  <g transform="translate(30, 95)">
    <!-- Diagrama Anatómico Sagital: Velo en reposo elevado elásticamente -->
    <rect x="10" y="5" width="150" height="100" rx="6" fill="#f8fafc" stroke="#bae6fd"/>
    <text x="85" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Esquema Sagital</text>
    
    <!-- Conducto nasal y faringe -->
    <path d="M 30 35 Q 70 30 110 35" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <!-- Velo del paladar cerrando suavemente contra pared posterior -->
    <path d="M 50 55 Q 90 45 130 50" stroke="#0284c7" stroke-width="3" fill="none"/>
    <circle cx="130" cy="50" r="4" fill="#0284c7"/>
    <!-- Pared faríngea posterior elástica y amplia -->
    <line x1="135" y1="30" x2="135" y2="90" stroke="#64748b" stroke-width="2"/>
    <text x="85" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#0369a1">Oclusión hermética</text>
    <text x="85" y="90" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#64748b">Faringe elástica y libre</text>

    <!-- Parámetros Biomecánicos -->
    <rect x="175" y="5" width="205" height="100" rx="6" fill="#f0f9ff" stroke="#bae6fd"/>
    <text x="185" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#0369a1">Fisiología Óptima</text>
    <text x="185" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Sellado velofaríngeo completo sin tensión</text>
    <text x="185" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Espacio orofaríngeo amplio y flexible</text>
    <text x="185" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Pilares palatinos relajados</text>
    <text x="185" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#0c4a6e">• Sin fuga de aire nasal en vocales orales</text>
  </g>

  <!-- Valoración -->
  <rect x="25" y="210" width="405" height="85" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="228" y="228" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#1e293b">Efecto Tímbrico: Resonancia Oral Pura</text>
  <text x="228" y="246" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10" fill="#475569">"El velo se eleva como un reflejo involuntario de la inhalación profunda y la fonación concebida con brillo."</text>
  <text x="228" y="266" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#64748b">Tracto libre de constricciones • Articulación flexible</text>
  <text x="228" y="282" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#0284c7">Doctrina Clásica de la Gola Aperta</text>

  <!-- ==================== PANEL DERECHO: HIPER-ELEVACIÓN FORZADA ==================== -->
  <rect x="460" y="54" width="425" height="252" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="461" y="55" width="423" height="32" rx="7" fill="#fef2f2"/>
  <text x="672" y="76" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">B) Hiper-Elevación Rígida (Tensión Constrictora)</text>

  <g transform="translate(475, 95)">
    <!-- Diagrama Sagital: Velo contraído y faringe constreñida -->
    <rect x="10" y="5" width="150" height="100" rx="6" fill="#f8fafc" stroke="#fecaca"/>
    <text x="85" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#b91c1c">Esquema Sagital</text>
    
    <path d="M 30 35 Q 70 30 110 35" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <!-- Velo forzado violentamente hacia arriba y atrás -->
    <path d="M 50 65 Q 100 25 125 35" stroke="#dc2626" stroke-width="3.5" fill="none"/>
    <!-- Pared faríngea espasmódica, estrechada hacia adelante -->
    <path d="M 125 30 Q 115 60 125 90" stroke="#b91c1c" stroke-width="2.5" fill="none"/>
    <text x="85" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#b91c1c">Constricción en cadena</text>
    <text x="85" y="90" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" fill="#7f1d1d">Faringe estrangulada</text>

    <!-- Parámetros Biomecánicos -->
    <rect x="175" y="5" width="205" height="100" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="185" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Patología Funcional</text>
    <text x="185" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Activación violenta del palatofaríngeo</text>
    <text x="185" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Constricción de los músculos de la garganta</text>
    <text x="185" y="74" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Tracción refleja y rigidez en la laringe</text>
    <text x="185" y="90" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Timbre entubado, opaco y engolado (Knödel)</text>
  </g>

  <!-- Valoración -->
  <rect x="470" y="210" width="405" height="85" rx="6" fill="#fef2f2" stroke="#fee2e2"/>
  <text x="672" y="228" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#991b1b">Advertencia de Vennard y McKinney</text>
  <text x="672" y="246" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10" fill="#7f1d1d">"Intentar levantar conscientemente el paladar como una compuerta rígida paraliza la faringe y ahoga los armónicos."</text>
  <text x="672" y="266" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#991b1b">Pérdida de penetración acústica • Tensión crónica</text>
  <text x="672" y="282" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#b91c1c">El Error del Bostezo Forzado</text>
</svg>