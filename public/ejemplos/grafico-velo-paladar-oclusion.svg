<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchVelum" width="5" height="5" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#881337" stroke-width="0.8" stroke-opacity="0.22"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — ESQUEMA VELOFARÍNGEO: SELLADO ELÁSTICO vs. TENSIÓN EN CADENA</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Conexión anatómica entre el elevador del velo, los pilares palatofaríngeos y la pared posterior (Vennard · Dimon)</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <line x1="440" y1="90" x2="440" y2="345" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.25" stroke-dasharray="3,3"/>

  <!-- IZQUIERDA: SELLADO ELÁSTICO -->
  <text x="230" y="102" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="700" fill="#881337">I. SELLADO ELÁSTICO REFLEJO</text>
  <g transform="translate(80, 120)">
    <!-- Pared faríngea posterior -->
    <line x1="215" y1="20" x2="215" y2="185" stroke="#1C1B19" stroke-width="1.5"/>
    <!-- Paladar duro + Velo blando elástico contactando suavemente -->
    <path d="M 45,55 Q 115,45 145,55" fill="none" stroke="#1C1B19" stroke-width="2.2"/>
    <path d="M 145,55 Q 185,48 214,62" fill="none" stroke="#881337" stroke-width="2.5"/>
    <circle cx="214" cy="62" r="4" fill="#881337"/>
    <!-- Pilar palatofaríngeo relajado -->
    <path d="M 180,55 Q 192,115 198,175" fill="none" stroke="#881337" stroke-width="1.2" stroke-dasharray="3,3"/>
    <!-- Espacio orofaríngeo -->
    <rect x="135" y="75" width="76" height="95" fill="url(#hatchVelum)"/>
    <line x1="214" y1="62" x2="245" y2="42" stroke="#881337" stroke-width="0.9"/>
    <text x="249" y="42" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="700" fill="#881337">Cierre hermético</text>
    <text x="249" y="55" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">Sin fuga nasal en vocales</text>

    <line x1="172" y1="130" x2="115" y2="148" stroke="#881337" stroke-width="0.8"/>
    <text x="110" y="148" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#881337">Gola aperta</text>
    <text x="110" y="161" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">Pilares sin rigidez</text>
    <text x="145" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#881337">Elevación refleja por inhalación silenciosa</text>
  </g>

  <!-- DERECHA: HIPER-ELEVACIÓN RÍGIDA -->
  <text x="655" y="102" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="700" fill="#1C1B19">II. HIPER-ELEVACIÓN FORZADA (BOSTEZO)</text>
  <g transform="translate(505, 120)">
    <line x1="215" y1="20" x2="215" y2="185" stroke="#1C1B19" stroke-width="1.5"/>
    <path d="M 45,55 Q 115,45 145,55" fill="none" stroke="#1C1B19" stroke-width="2.2"/>
    <!-- Velo retraído en exceso hacia arriba -->
    <path d="M 145,55 Q 178,22 214,42" fill="none" stroke="#1C1B19" stroke-width="2.5" stroke-dasharray="5,3"/>
    <!-- Pilar palatofaríngeo en espasmo tirando de la laringe -->
    <line x1="185" y1="36" x2="202" y2="170" stroke="#1C1B19" stroke-width="2"/>
    <path d="M 197,118 L 191,92 M 187,99 L 191,92 L 197,98" fill="none" stroke="#1C1B19" stroke-width="1.3"/>
    <line x1="185" y1="36" x2="242" y2="34" stroke="#1C1B19" stroke-width="0.8"/>
    <text x="246" y="34" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#1C1B19">Espasmo del velo</text>
    <text x="246" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">Bostezo congelado</text>

    <line x1="194" y1="118" x2="128" y2="132" stroke="#1C1B19" stroke-width="0.8"/>
    <text x="124" y="130" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="11" font-weight="600" fill="#1C1B19">Tracción palatofaríngea</text>
    <text x="124" y="143" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#57534E">Estrecha y fija la laringe</text>
    <text x="145" y="205" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Genera timbre entubado (Knödel) y pérdida de brillo</text>
  </g>

  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura anatómica:</tspan> Como el músculo palatofaríngeo une el velo blando con el cartílago tiroides, tirar del paladar a la fuerza
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    agarrota las paredes de la faringe; un contacto elástico reflejo (izquierda) sella la nariz sin sacrificar libertad.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · ANATOMÍA VELOFARÍNGEA (LAMPERTI 1931 · VENNARD 1967 · SUNDBERG)</text>
</svg>
