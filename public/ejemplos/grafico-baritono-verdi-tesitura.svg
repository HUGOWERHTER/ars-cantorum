<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchSquillo" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.9" stroke-opacity="0.22"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — TESITURA Y PASAJES DEL BARÍTONO VERDIANO (MILLER · FRISELL)</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Por qué oscurecer el registro medio bloquea el secondo passaggio (Re4–Mib4) e impide alcanzar Fa4–Lab4</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- EJE TONAL HORIZONTAL (La2 -> Lab4, x=80..800) -->
  <line x1="70" y1="220" x2="810" y2="220" stroke="#1C1B19" stroke-width="1.2"/>

  <!-- Marcas de notas clave -->
  <g stroke="#1C1B19" stroke-width="1">
    <line x1="95" y1="214" x2="95" y2="226"/>
    <line x1="255" y1="214" x2="255" y2="226"/>
    <line x1="400" y1="205" x2="400" y2="235" stroke-dasharray="2,2"/>
    <line x1="560" y1="200" x2="560" y2="240" stroke="#881337" stroke-width="1.4"/>
    <line x1="690" y1="214" x2="690" y2="226" stroke="#881337"/>
    <line x1="785" y1="214" x2="785" y2="226" stroke="#881337"/>
  </g>
  <text x="95" y="244" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">La2</text>
  <text x="255" y="244" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Mi3</text>
  <text x="400" y="248" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#1C1B19">Sib3 · 1º Passaggio</text>
  <text x="560" y="254" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#881337">Mib4 · 2º Passaggio</text>
  <text x="690" y="244" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#881337">Fa4–Sol4</text>
  <text x="785" y="244" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#881337">Lab4</text>

  <!-- ZONA TESITURA VERDIANA (La3 a Sol4) destacada -->
  <rect x="375" y="135" width="350" height="72" fill="url(#hatchSquillo)" stroke="#881337" stroke-width="1" stroke-opacity="0.5"/>
  <text x="550" y="154" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11.5" font-weight="700" fill="#881337">ZONA DE TESITURA VERDIANA (LA3 – SOL4)</text>
  <text x="550" y="172" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" fill="#1C1B19">Cobertura elástica + punta metálica (2.6–3.0 kHz)</text>
  <text x="550" y="190" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Rigoletto · Conte di Luna · Germont · Posa</text>

  <!-- BARRA INFERIOR: ESTEREOTIPO CAVERNOSO (Colapso en el 2º passaggio) -->
  <path d="M 95,285 L 550,285" stroke="#1C1B19" stroke-width="2" stroke-dasharray="5,4" stroke-opacity="0.7"/>
  <line x1="550" y1="274" x2="550" y2="296" stroke="#1C1B19" stroke-width="1.8"/>
  <circle cx="550" cy="285" r="4" fill="#FAF8F5" stroke="#1C1B19" stroke-width="1.6"/>
  <text x="320" y="308" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" fill="#1C1B19">Estereotipo «bajo disfrazado»: sobrecarga del TA en el centro</text>
  <text x="670" y="289" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#57534E">Techo bloqueado (wobble o grito abierto)</text>

  <!-- Nota superior izquierda -->
  <line x1="255" y1="214" x2="220" y2="148" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.6"/>
  <text x="215" y="136" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="600" fill="#1C1B19">Centro claro y ágil</text>
  <text x="215" y="150" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Herencia directa de Donizetti</text>

  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura vocal:</tspan> Verdi sitúa el centro de gravedad dramático alrededor del <tspan font-style="italic">secondo passaggio</tspan> (Re4–Mib4); solo quien mantiene
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    claro el centro y libre la basculación tiroidea logra sostener el Fa4–Sol4 con <tspan font-style="italic">squillo</tspan> y flexibilidad cantabile.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · CARTOGRAFÍA DE TESITURA BARITONAL (CELLETTI · MILLER 2008 · FRISELL)</text>
</svg>
