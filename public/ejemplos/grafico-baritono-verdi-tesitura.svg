<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 440" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <rect x="15" y="10" width="890" height="36" rx="6" fill="#0f172a"/>
  <text x="460" y="33" text-anchor="middle" font-family="'Cinzel', serif" font-size="13" font-weight="700" fill="#f8fafc" letter-spacing="0.05em">EL BARÍTONO VERDIANO: EL MITO CAVERNOSO vs. LA TESITURA BELCANTISTA</text>

  <!-- PANEL A: BARÍTONO ENGOLADO -->
  <rect x="15" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#dc2626" stroke-width="1.3"/>
  <rect x="16" y="57" width="433" height="32" rx="7" fill="#fef2f2"/>
  <text x="232" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b91c1c">A) El Estereotipo Moderno (Voz Oscurecida y Pesada)</text>

  <g transform="translate(28, 102)">
    <rect x="0" y="0" width="160" height="118" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="80" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Techo Limitado</text>
    <rect x="25" y="42" width="110" height="22" rx="4" fill="#fee2e2" stroke="#dc2626"/>
    <text x="80" y="57" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#991b1b">Falsa gravedad</text>
    <text x="80" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#b91c1c">Tensión en Fa4–Sol4</text>
    <text x="80" y="103" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#7f1d1d">Wobble y calado</text>

    <rect x="172" y="0" width="236" height="118" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="184" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#991b1b">Defectos de Fabricación:</text>
    <text x="184" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Imitación artificial de timbre de bajo</text>
    <text x="184" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Depresión forzada de raíz lingual</text>
    <text x="184" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Incapacidad para agilidades de Rossini</text>
    <text x="184" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">• Pérdida de squillo ante la orquesta</text>
    <text x="184" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#b91c1c">• Agudos ahogados o gritados</text>
  </g>

  <g transform="translate(28, 232)">
    <rect x="0" y="0" width="408" height="180" rx="6" fill="#fef2f2" stroke="#fecaca"/>
    <text x="204" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#991b1b">La Crítica de Anthony Frisell y Miller</text>
    <text x="204" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#7f1d1d">
      <tspan x="204" dy="0">"Fabricar un volumen oscuro en el centro</tspan>
      <tspan x="204" dy="16">bloquea el mecanismo cricotiroideo e impide</tspan>
      <tspan x="204" dy="16">cantar la verdadera tesitura aguda verdiana."</tspan>
    </text>
    <line x1="35" y1="94" x2="373" y2="94" stroke="#fecaca" stroke-width="1"/>
    <text x="204" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#7f1d1d">
      <tspan x="204" dy="0">Fallo Estilístico:</tspan>
      <tspan x="204" dy="14" font-weight="700" fill="#b91c1c">Rigoletto o Luna cantados como si fueran Wotán</tspan>
    </text>
    <text x="204" y="154" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#991b1b">
      <tspan x="204" dy="0">Pérdida de Flexibilidad</tspan>
      <tspan x="204" dy="14" font-weight="500" fill="#7f1d1d">Imposibilidad de ejecutar el canto spianato y las medias voces</tspan>
    </text>
  </g>

  <!-- PANEL B: VERDADERO BARÍTONO VERDI -->
  <rect x="470" y="56" width="435" height="370" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.3"/>
  <rect x="471" y="57" width="433" height="32" rx="7" fill="#fffbeb"/>
  <text x="687" y="78" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#b45309">B) El Barítono Verdi Canónico (Ronconi / Warren)</text>

  <g transform="translate(483, 102)">
    <rect x="0" y="0" width="160" height="118" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="80" y="18" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#b45309">Tesitura de Oro</text>
    <path d="M 28 65 L 70 46 L 132 34" stroke="#d97706" stroke-width="2.8" fill="none"/>
    <circle cx="70" cy="46" r="3.5" fill="#d97706"/>
    <circle cx="132" cy="34" r="4" fill="#b45309"/>
    <text x="80" y="88" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#b45309">Re4–Mi♭4 → Sol4–La♭4</text>
    <text x="80" y="103" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" fill="#92400e">Squillo incisivo y noble</text>

    <rect x="172" y="0" width="236" height="118" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="184" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#b45309">Exigencia Verdiana Real:</text>
    <text x="184" y="38" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Centro claro, ágil y rico en armónicos</text>
    <text x="184" y="54" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Secondo passaggio cubierto en Mi♭4</text>
    <text x="184" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Agudos fáciles y brillantes (Fa4–La♭4)</text>
    <text x="184" y="86" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">• Herencia directa de Donizetti y Bellini</text>
    <text x="184" y="102" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#b45309">• Modelos: Battistini, Ruffo, Warren</text>
  </g>

  <g transform="translate(483, 232)">
    <rect x="0" y="0" width="408" height="180" rx="6" fill="#fffbeb" stroke="#fde68a"/>
    <text x="204" y="24" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" fill="#b45309">La Escuela de Giorgio Ronconi</text>
    <text x="204" y="48" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="10.5" fill="#92400e">
      <tspan x="204" dy="0">"Verdi no creó un bajo disfrazado, sino una voz</tspan>
      <tspan x="204" dy="16">baritonal de gran extensión superior, capaz de</tspan>
      <tspan x="204" dy="16">unir la ternura paterna con el acento heroico."</tspan>
    </text>
    <line x1="35" y1="94" x2="373" y2="94" stroke="#fde68a" stroke-width="1"/>
    <text x="204" y="116" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#92400e">
      <tspan x="204" dy="0">Llave Acústica (Miller):</tspan>
      <tspan x="204" dy="14" font-weight="700" fill="#b45309">Equilibrio chiaroscuro sin perder la punta metálica</tspan>
    </text>
    <text x="204" y="154" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#d97706">
      <tspan x="204" dy="0">Roles Emblemáticos</tspan>
      <tspan x="204" dy="14" font-weight="500" fill="#92400e">Rigoletto, Conte di Luna, Germont, Posa, Renato</tspan>
    </text>
  </g>
</svg>
