<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <!-- Barra superior del título -->
  <rect x="10" y="8" width="840" height="34" rx="6" fill="#e2e8f0"/>
  <text x="430" y="30" text-anchor="middle" font-family="'Cinzel', serif" font-size="13.5" font-weight="700" fill="#0f172a" letter-spacing="0.05em">COMPARATIVA TÉCNICA: LEGATO vs. PORTAMENTO vs. SCOOPING</text>

  <!-- ==================== TARJETA A (LEGATO PURO) ==================== -->
  <rect x="15" y="50" width="265" height="165" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="16" y="51" width="263" height="28" rx="7" fill="#f8fafc"/>
  <text x="28" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#0f172a">A) Legato Puro</text>

  <!-- Pentagrama A (5 líneas) -->
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="25" y1="100" x2="265" y2="100"/>
    <line x1="25" y1="110" x2="265" y2="110"/>
    <line x1="25" y1="120" x2="265" y2="120"/>
    <line x1="25" y1="130" x2="265" y2="130"/>
    <line x1="25" y1="140" x2="265" y2="140"/>
  </g>
  <text x="28" y="135" font-family="serif" font-size="42" fill="#0f172a">𝄞</text>

  <!-- Ligadura de legato pura -->
  <path d="M 100 92 Q 155 78 210 92" stroke="#0f172a" stroke-width="1.6" fill="none"/>

  <!-- Do4 a Sol4 en blancas -->
  <!-- Do4 con línea adicional -->
  <line x1="90" y1="150" x2="114" y2="150" stroke="#0f172a" stroke-width="1.4"/>
  <ellipse cx="102" cy="150" rx="6" ry="4.5" fill="none" stroke="#0f172a" stroke-width="1.8" transform="rotate(-15 102 150)"/>
  <line x1="107" y1="150" x2="107" y2="122" stroke="#0f172a" stroke-width="1.6"/>

  <!-- Sol4 (2da línea) -->
  <ellipse cx="205" cy="130" rx="6" ry="4.5" fill="none" stroke="#0f172a" stroke-width="1.8" transform="rotate(-15 205 130)"/>
  <line x1="210" y1="130" x2="210" y2="102" stroke="#0f172a" stroke-width="1.6"/>

  <!-- Píldora explicativa A -->
  <rect x="22" y="172" width="251" height="32" rx="5" fill="#f1f5f9"/>
  <text x="147" y="186" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11.5" fill="#334155">Tránsito instantáneo y limpio</text>
  <text x="147" y="198" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#64748b">Sin frecuencias intermedias</text>


  <!-- ==================== TARJETA B (PORTAMENTO NOBLE) ==================== -->
  <rect x="295" y="50" width="270" height="165" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.2"/>
  <rect x="296" y="51" width="268" height="28" rx="7" fill="#f0fdf4"/>
  <text x="308" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#15803d">B) Portamento Belcantista</text>

  <!-- Pentagrama B (5 líneas) -->
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="305" y1="100" x2="550" y2="100"/>
    <line x1="305" y1="110" x2="550" y2="110"/>
    <line x1="305" y1="120" x2="550" y2="120"/>
    <line x1="305" y1="130" x2="550" y2="130"/>
    <line x1="305" y1="140" x2="550" y2="140"/>
  </g>
  <text x="308" y="135" font-family="serif" font-size="42" fill="#0f172a">𝄞</text>

  <!-- Do4 inicial con línea adicional -->
  <line x1="370" y1="150" x2="394" y2="150" stroke="#0f172a" stroke-width="1.4"/>
  <ellipse cx="382" cy="150" rx="6" ry="4.5" fill="none" stroke="#0f172a" stroke-width="1.8" transform="rotate(-15 382 150)"/>
  <line x1="387" y1="150" x2="387" y2="122" stroke="#0f172a" stroke-width="1.6"/>

  <!-- Línea de deslizamiento sutil (Glide) hacia Sol4 -->
  <path d="M 388 147 L 460 132" stroke="#059669" stroke-width="1.6" stroke-dasharray="3,2" fill="none"/>
  <!-- Pequeña nota de anticipación sutil (cercar la nota) en Sol4 -->
  <ellipse cx="465" cy="130" rx="4" ry="3" fill="#059669" transform="rotate(-15 465 130)"/>
  <!-- Ligadura elegante -->
  <path d="M 382 142 Q 430 118 495 125" stroke="#059669" stroke-width="1.5" fill="none"/>

  <!-- Sol4 final -->
  <ellipse cx="500" cy="130" rx="6" ry="4.5" fill="none" stroke="#0f172a" stroke-width="1.8" transform="rotate(-15 500 130)"/>
  <line x1="505" y1="130" x2="505" y2="102" stroke="#0f172a" stroke-width="1.6"/>

  <!-- Píldora explicativa B -->
  <rect x="302" y="172" width="256" height="32" rx="5" fill="#f0fdf4"/>
  <text x="430" y="186" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11.5" fill="#047857">Deslizamiento sutil y rápido</text>
  <text x="430" y="198" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#059669">Conexión noble y expresiva</text>


  <!-- ==================== TARJETA C (DEFECTO DEL SCOOPING) ==================== -->
  <rect x="580" y="50" width="265" height="165" rx="8" fill="#ffffff" stroke="#b91c1c" stroke-width="1.2"/>
  <rect x="581" y="51" width="263" height="28" rx="7" fill="#fef2f2"/>
  <text x="593" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="700" font-size="12" fill="#b91c1c">C) El Vicio del Scooping</text>

  <!-- Pentagrama C (5 líneas) -->
  <g stroke="#64748b" stroke-width="1.2">
    <line x1="590" y1="100" x2="830" y2="100"/>
    <line x1="590" y1="110" x2="830" y2="110"/>
    <line x1="590" y1="120" x2="830" y2="120"/>
    <line x1="590" y1="130" x2="830" y2="130"/>
    <line x1="590" y1="140" x2="830" y2="140"/>
  </g>
  <text x="593" y="135" font-family="serif" font-size="42" fill="#0f172a">𝄞</text>

  <!-- Do4 inicial -->
  <line x1="655" y1="150" x2="679" y2="150" stroke="#0f172a" stroke-width="1.4"/>
  <ellipse cx="667" cy="150" rx="6" ry="4.5" fill="none" stroke="#0f172a" stroke-width="1.8" transform="rotate(-15 667 150)"/>
  <line x1="672" y1="150" x2="672" y2="122" stroke="#0f172a" stroke-width="1.6"/>

  <!-- Ataque perezoso arrastrado por debajo de la nota (Scoop marcado con aspa roja) -->
  <path d="M 725 142 Q 745 138 765 130" stroke="#dc2626" stroke-width="2.2" fill="none"/>
  <!-- Flecha curva ascendente indicando arrastre descontrolado -->
  <path d="M 725 142 L 733 140 M 725 142 L 728 148" stroke="#dc2626" stroke-width="1.8" fill="none"/>

  <!-- Sol4 alcanzado tardíamente -->
  <ellipse cx="770" cy="130" rx="6" ry="4.5" fill="none" stroke="#b91c1c" stroke-width="1.8" transform="rotate(-15 770 130)"/>
  <line x1="775" y1="130" x2="775" y2="102" stroke="#b91c1c" stroke-width="1.6"/>

  <!-- Marca de advertencia (aspa) -->
  <text x="740" y="94" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="900" fill="#dc2626">✕</text>

  <!-- Píldora explicativa C -->
  <rect x="587" y="172" width="251" height="32" rx="5" fill="#fef2f2"/>
  <text x="712" y="186" text-anchor="middle" font-family="'Newsreader', serif" font-style="italic" font-size="11.5" fill="#991b1b">Ataque arrastrado por debajo</text>
  <text x="712" y="198" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="600" fill="#dc2626">Falta de appoggio y afinación perezosa</text>
</svg>
