<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchSynth" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.8" stroke-opacity="0.16"/>
    </pattern>
  </defs>

  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Encabezado -->
  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — MAPA PEDAGÓGICO: ENTRE EL OÍDO EMPÍRICO Y LA CIENCIA VOCAL</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Relación entre el conocimiento fisiológico objetivo (eje horizontal) y la libertad expresiva en escena (eje vertical)</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- ZONA SÍNTESIS (Cuadrante superior derecho destacado con trama sutil) -->
  <rect x="440" y="96" width="384" height="122" fill="url(#hatchSynth)" stroke="#881337" stroke-width="1" stroke-opacity="0.45"/>

  <!-- Ejes cartesianos conceptuales -->
  <line x1="440" y1="92" x2="440" y2="344" stroke="#1C1B19" stroke-width="1.2"/>
  <line x1="56" y1="218" x2="824" y2="218" stroke="#1C1B19" stroke-width="1.2"/>

  <!-- Puntas de flecha finas -->
  <path d="M 436,99 L 440,91 L 444,99" fill="none" stroke="#1C1B19" stroke-width="1.2"/>
  <path d="M 817,214 L 825,218 L 817,222" fill="none" stroke="#1C1B19" stroke-width="1.2"/>
  <path d="M 63,214 L 55,218 L 63,222" fill="none" stroke="#1C1B19" stroke-width="1.2"/>

  <!-- Etiquetas de los Ejes -->
  <text x="440" y="86" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">LIBERTAD ARTÍSTICA Y ESPONTANEIDAD VOCAL (+)</text>
  <text x="440" y="357" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#57534E" letter-spacing="0.06em">RIGIDEZ MUSCULAR / BLOQUEO EXPRESIVO (−)</text>
  <text x="56" y="210" text-anchor="start" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#57534E">EMPIRISMO PURO</text>
  <text x="824" y="210" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="700" fill="#881337">FUNDAMENTO CIENTÍFICO</text>

  <!-- CUADRANTE 1 (Superior Izquierdo): Empirismo intuitivo -->
  <circle cx="245" cy="148" r="4" fill="#1C1B19"/>
  <text x="245" y="132" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12" font-weight="700" fill="#1C1B19">INTUICIÓN TRADICIONAL</text>
  <text x="245" y="168" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" fill="#1C1B19">Oído educado y musicalidad viva;</text>
  <text x="245" y="184" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">eficaz por imitación, pero vulnerable a mitos falsos</text>

  <!-- CUADRANTE 2 (Superior Derecho - DESTACADO): Síntesis Moderna -->
  <circle cx="632" cy="142" r="4.5" fill="#881337"/>
  <text x="632" y="124" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="12.5" font-weight="700" fill="#881337">SÍNTESIS PEDAGÓGICA</text>
  <text x="632" y="162" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="600" fill="#1C1B19">Ciencia en el criterio del maestro;</text>
  <text x="632" y="178" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="600" fill="#1C1B19">sensación clara y música en el alumno.</text>
  <text x="632" y="198" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#881337">Seguridad clínica + libertad escénica</text>

  <!-- CUADRANTE 3 (Inferior Izquierdo): Dogma empírico dañino -->
  <circle cx="245" cy="272" r="4" fill="#1C1B19" fill-opacity="0.65"/>
  <text x="245" y="256" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11.5" font-weight="700" fill="#1C1B19">EMPIRISMO CIEGO</text>
  <text x="245" y="292" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" fill="#57534E">Consignas anatómicas imposibles</text>
  <text x="245" y="308" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C">«Aplastar la lengua» · «Respirar al 100%»</text>

  <!-- CUADRANTE 4 (Inferior Derecho): Cientificismo en aula -->
  <circle cx="632" cy="272" r="4" fill="#1C1B19" fill-opacity="0.65"/>
  <text x="632" y="256" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11.5" font-weight="700" fill="#1C1B19">PARALYSIS BY ANALYSIS</text>
  <text x="632" y="292" text-anchor="middle" font-family="'Newsreader', Georgia, serif" font-size="11.5" fill="#57534E">Microcontrol muscular consciente en escena</text>
  <text x="632" y="308" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C">Jerga EGG/Hz directa que congela el fraseo</text>

  <!-- PIE DE FIGURA EDITORIAL -->
  <line x1="36" y1="376" x2="844" y2="376" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="398" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura del mapa:</tspan> La ciencia vocal (Titze, Sundberg) alcanza su máximo valor en el cuadrante superior derecho cuando sirve
  </text>
  <text x="36" y="416" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    como brújula diagnóstica del docente sin sobrecargar la atención propioceptiva del cantante durante el fraseo.
  </text>
  <text x="36" y="438" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · CARTOGRAFÍA PEDAGÓGICA (TAYLOR · TITZE · HERBERT-CAESARI)</text>
</svg>
