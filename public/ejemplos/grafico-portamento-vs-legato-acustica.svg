<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="100%" height="auto" style="background:#ffffff; border:1px solid #cbd5e1; border-radius:10px; padding:12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
  <!-- ENCABEZADO MONUMENTAL -->
  <rect x="15" y="10" width="950" height="48" rx="6" fill="#0f172a"/>
  <text x="490" y="31" text-anchor="middle" fill="#f8fafc" font-family="'Cinzel', serif" font-size="13.5" font-weight="700" letter-spacing="0.04em">FISIOLOGÍA Y ACÚSTICA DEL PORTAMENTO BELCANTISTA</text>
  <text x="490" y="48" text-anchor="middle" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10">Mecánica de ligadura aerodinámica continua frente a la fragmentación moderna</text>

  <!-- PANEL IZQUIERDO -->
  <g transform="translate(30, 72)">
    <rect width="445" height="470" fill="#ffffff" stroke="#16a34a" stroke-width="1.4" rx="8" />
    
    <rect x="1" y="1" width="443" height="34" fill="#f0fdf4" rx="7" />
    <text x="222" y="23" text-anchor="middle" fill="#15803d" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">1. PORTAMENTO BELCANTISTA (García / Vaccai)</text>

    <!-- Eje Acústico F0 vs Tiempo -->
    <rect x="20" y="48" width="405" height="165" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
    <line x1="45" y1="185" x2="390" y2="185" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="45" y1="185" x2="45" y2="65" stroke="#94a3b8" stroke-width="1.5" />
    <text x="390" y="202" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" text-anchor="end">Tiempo (t)</text>
    <text x="40" y="60" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5">Tono (f0)</text>

    <!-- Curva de Portamento -->
    <line x1="60" y1="145" x2="160" y2="145" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />
    <path d="M 160,145 C 205,145 220,95 265,95" stroke="#d97706" stroke-width="3.5" fill="none" />
    <line x1="265" y1="95" x2="370" y2="95" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />

    <circle cx="160" cy="145" r="4.5" fill="#0284c7" />
    <circle cx="265" cy="95" r="4.5" fill="#0284c7" />

    <text x="110" y="133" fill="#0369a1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Nota Inicial</text>
    <text x="320" y="83" fill="#0369a1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Nota Destino</text>
    <text x="178" y="103" fill="#b45309" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Glissando veloz</text>

    <!-- Línea de flujo aéreo y texto SEPARADOS SIN SUPERPONER -->
    <line x1="60" y1="162" x2="370" y2="162" stroke="#16a34a" stroke-width="2" stroke-dasharray="3,3" />
    <text x="215" y="177" text-anchor="middle" fill="#15803d" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600">Presión Subglótica Ininterrumpida (Legato Real)</text>

    <!-- Características Técnicas -->
    <g transform="translate(20, 228)">
      <rect width="405" height="220" fill="#f0fdf4" stroke="#bbf7d0" rx="6" />
      
      <text x="15" y="30" fill="#15803d" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700">• Anticipación Vocal:</text>
      <text x="150" y="30" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5">Se liga sobre la vocal de partida</text>

      <text x="15" y="68" fill="#15803d" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700">• Acción Muscular:</text>
      <text x="150" y="68" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5">Transición gradual CT / TA continua</text>

      <text x="15" y="106" fill="#15803d" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700">• Apoyo Respiratorio:</text>
      <text x="150" y="106" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5">Appoggio constante sin micro-apneas</text>

      <text x="15" y="144" fill="#15803d" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700">• Efecto Estético:</text>
      <text x="150" y="144" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5">Nobleza afectiva, alma de la melodía</text>

      <text x="15" y="182" fill="#15803d" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700">• Velocidad:</text>
      <text x="150" y="182" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5">Ágil y transparente al oído</text>
    </g>
  </g>

  <!-- PANEL DERECHO -->
  <g transform="translate(505, 72)">
    <rect width="445" height="470" fill="#ffffff" stroke="#dc2626" stroke-width="1.4" rx="8" />
    
    <rect x="1" y="1" width="443" height="34" fill="#fef2f2" rx="7" />
    <text x="222" y="23" text-anchor="middle" fill="#b91c1c" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">2. DEGENERACIÓN MODERNA (Slur / Salto Rígido)</text>

    <!-- Eje Acústico F0 vs Tiempo -->
    <rect x="20" y="48" width="405" height="165" fill="#f8fafc" stroke="#e2e8f0" rx="6" />
    <line x1="45" y1="185" x2="390" y2="185" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="45" y1="185" x2="45" y2="65" stroke="#94a3b8" stroke-width="1.5" />
    <text x="390" y="202" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" text-anchor="end">Tiempo (t)</text>
    <text x="40" y="60" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5">Tono (f0)</text>

    <!-- Salto seco con corte -->
    <line x1="60" y1="145" x2="180" y2="145" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
    <line x1="180" y1="145" x2="230" y2="145" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="2,2" />
    <path d="M 230,130 Q 250,110 270,95" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />
    <line x1="270" y1="95" x2="370" y2="95" stroke="#dc2626" stroke-width="3" stroke-linecap="round" />

    <circle cx="180" cy="145" r="4.5" fill="#dc2626" />
    <circle cx="270" cy="95" r="4.5" fill="#dc2626" />
    <text x="195" y="122" fill="#b91c1c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Colapso / Golpe</text>

    <!-- Línea punteada y texto SEPARADOS SIN SUPERPONER -->
    <line x1="60" y1="162" x2="370" y2="162" stroke="#dc2626" stroke-width="2" stroke-dasharray="3,3" />
    <text x="215" y="177" text-anchor="middle" fill="#b91c1c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="600">Micro-apnea o Golpe Glótico en la llegada</text>

    <!-- Características Técnicas -->
    <g transform="translate(20, 228)">
      <rect width="405" height="220" fill="#fef2f2" stroke="#fecaca" rx="6" />
      
      <text x="15" y="30" fill="#b91c1c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700">• Degeneración 1 (Slur):</text>
      <text x="165" y="30" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5">Arrastre gutural viscoso (scooping)</text>

      <text x="15" y="68" fill="#b91c1c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700">• Degeneración 2 (Corte):</text>
      <text x="165" y="68" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5">Salto seco desconectado, anti-vocal</text>

      <text x="15" y="106" fill="#b91c1c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700">• Falla Laríngea:</text>
      <text x="165" y="106" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5">Golpe glótico compensatorio en agudo</text>

      <text x="15" y="144" fill="#b91c1c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700">• Prejuicio Moderno:</text>
      <text x="165" y="144" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5">Terror al arrastre confunde portamento</text>

      <text x="15" y="182" fill="#b91c1c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="700">• Pérdida Estética:</text>
      <text x="165" y="182" fill="#1e293b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5">Canto instrumentalizado, frío y plano</text>
    </g>
  </g>

  <!-- PIE DE PAGINA -->
  <text x="490" y="564" text-anchor="middle" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10">Ars Cantorum © 2026 • Análisis Musicológico e Histórico del Bel Canto</text>
</svg>
