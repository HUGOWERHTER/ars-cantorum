<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="100%" height="auto" style="background:#0f172a; border:1px solid #334155; border-radius:10px; padding:12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3);">
  <text x="490" y="32" text-anchor="middle" fill="#f8fafc" font-family="'Cinzel', serif" font-size="13.5" font-weight="700" letter-spacing="0.04em">FISIOLOGÍA Y ACÚSTICA DEL PORTAMENTO BELCANTISTA</text>
  <text x="490" y="50" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5">Mecánica de ligadura aerodinámica continua frente a la fragmentación moderna</text>

  <!-- PANEL IZQUIERDO -->
  <g transform="translate(30, 70)">
    <rect width="445" height="470" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="8" />
    
    <rect width="445" height="34" fill="#d97706" rx="8" />
    <rect y="26" width="445" height="8" fill="#d97706" />
    <text x="222" y="22" text-anchor="middle" fill="#ffffff" font-family="'Cinzel', serif" font-size="12" font-weight="bold">1. PORTAMENTO BELCANTISTA (García / Vaccai)</text>

    <!-- Eje Acústico F0 vs Tiempo -->
    <rect x="20" y="48" width="405" height="165" fill="#0f172a" stroke="#334155" rx="6" />
    <line x1="45" y1="185" x2="390" y2="185" stroke="#64748b" stroke-width="1.5" />
    <line x1="45" y1="185" x2="45" y2="65" stroke="#64748b" stroke-width="1.5" />
    <text x="390" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">Tiempo (t)</text>
    <text x="40" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Tono (f0)</text>

    <!-- Curva de Portamento -->
    <line x1="60" y1="145" x2="160" y2="145" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M 160,145 C 205,145 220,95 265,95" stroke="#f59e0b" stroke-width="3.5" fill="none" />
    <line x1="265" y1="95" x2="370" y2="95" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

    <circle cx="160" cy="145" r="4.5" fill="#38bdf8" />
    <circle cx="265" cy="95" r="4.5" fill="#38bdf8" />

    <text x="110" y="135" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Nota Inicial</text>
    <text x="320" y="85" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Nota Destino</text>
    <text x="215" y="112" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Glissando veloz</text>

    <!-- Línea de flujo aéreo y texto SEPARADOS SIN SUPERPONER -->
    <line x1="60" y1="165" x2="370" y2="165" stroke="#22c55e" stroke-width="2" stroke-dasharray="3,3" />
    <text x="215" y="180" text-anchor="middle" fill="#86efac" font-family="system-ui, sans-serif" font-size="9.5">Presión Subglótica Ininterrumpida (Legato Real)</text>

    <!-- Características Técnicas -->
    <g transform="translate(20, 228)">
      <rect width="405" height="195" fill="#0f172a" stroke="#334155" rx="6" />
      
      <text x="15" y="28" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">• Anticipación Vocal:</text>
      <text x="150" y="28" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10.5">Se liga sobre la vocal de partida</text>

      <text x="15" y="62" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">• Acción Muscular:</text>
      <text x="150" y="62" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10.5">Transición gradual CT / TA continua</text>

      <text x="15" y="96" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">• Apoyo Respiratorio:</text>
      <text x="150" y="96" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10.5">Appoggio constante sin micro-apneas</text>

      <text x="15" y="130" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">• Efecto Estético:</text>
      <text x="150" y="130" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10.5">Nobleza afectiva, alma de la melodía</text>

      <text x="15" y="164" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">• Velocidad:</text>
      <text x="150" y="164" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10.5">Ágil y transparente al oído</text>
    </g>
  </g>

  <!-- PANEL DERECHO -->
  <g transform="translate(505, 70)">
    <rect width="445" height="470" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" rx="8" />
    
    <rect width="445" height="34" fill="#b91c1c" rx="8" />
    <rect y="26" width="445" height="8" fill="#b91c1c" />
    <text x="222" y="22" text-anchor="middle" fill="#ffffff" font-family="'Cinzel', serif" font-size="12" font-weight="bold">2. DEGENERACIÓN MODERNA (Slur / Salto Rígido)</text>

    <!-- Eje Acústico F0 vs Tiempo -->
    <rect x="20" y="48" width="405" height="165" fill="#0f172a" stroke="#334155" rx="6" />
    <line x1="45" y1="185" x2="390" y2="185" stroke="#64748b" stroke-width="1.5" />
    <line x1="45" y1="185" x2="45" y2="65" stroke="#64748b" stroke-width="1.5" />
    <text x="390" y="200" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">Tiempo (t)</text>
    <text x="40" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Tono (f0)</text>

    <!-- Salto seco con corte -->
    <line x1="60" y1="145" x2="180" y2="145" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="180" y1="145" x2="230" y2="145" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2" />
    <path d="M 230,130 Q 250,110 270,95" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="270" y1="95" x2="370" y2="95" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />

    <circle cx="180" cy="145" r="4.5" fill="#ef4444" />
    <circle cx="270" cy="95" r="4.5" fill="#ef4444" />
    <text x="210" y="135" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Colapso / Golpe</text>

    <!-- Línea punteada y texto SEPARADOS SIN SUPERPONER -->
    <line x1="60" y1="165" x2="370" y2="165" stroke="#f87171" stroke-width="2" stroke-dasharray="3,3" />
    <text x="215" y="180" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="9.5">Micro-apnea o Golpe Glótico en la llegada</text>

    <!-- Características Técnicas -->
    <g transform="translate(20, 228)">
      <rect width="405" height="195" fill="#0f172a" stroke="#334155" rx="6" />
      
      <text x="15" y="28" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">• Degeneración 1 (Slur):</text>
      <text x="165" y="28" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10.5">Arrastre gutural viscoso (scooping)</text>

      <text x="15" y="62" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">• Degeneración 2 (Corte):</text>
      <text x="165" y="62" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10.5">Salto seco desconectado, anti-vocal</text>

      <text x="15" y="96" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">• Falla Laríngea:</text>
      <text x="165" y="96" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10.5">Golpe glótico compensatorio en agudo</text>

      <text x="15" y="130" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">• Prejuicio Moderno:</text>
      <text x="165" y="130" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10.5">Terror al arrastre confunde portamento</text>

      <text x="15" y="164" fill="#f87171" font-family="system-ui, sans-serif" font-size="10.5" font-weight="bold">• Pérdida Estética:</text>
      <text x="165" y="164" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="10.5">Canto instrumentalizado, frío y plano</text>
    </g>
  </g>

  <!-- PIE DE PAGINA -->
  <text x="490" y="562" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5">Ars Cantorum © 2026 • Análisis Musicológico e Histórico del Bel Canto</text>
</svg>