<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDarkP" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#111e38" />
    </linearGradient>
    <linearGradient id="goldGradP" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#f3e5ab" />
    </linearGradient>
  </defs>

  <rect width="980" height="580" fill="url(#bgDarkP)" rx="12" />

  <!-- TITULO -->
  <text x="490" y="42" text-anchor="middle" fill="url(#goldGradP)" font-family="Georgia, serif" font-size="22" font-weight="bold" letter-spacing="1">FISIOLOGÍA Y ACÚSTICA DEL PORTAMENTO BELCANTISTA</text>
  <text x="490" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Mecánica de ligadura aerodinámica continua frente a la fragmentación moderna</text>

  <!-- PANEL 1: PORTAMENTO CLASICO -->
  <g transform="translate(30, 95)">
    <rect width="445" height="435" fill="#0f172a" stroke="#d4af37" stroke-width="1.5" rx="10" />
    <rect width="445" height="38" fill="#d4af37" rx="8" />
    <text x="222" y="25" text-anchor="middle" fill="#0f172a" font-family="Georgia, serif" font-size="14.5" font-weight="bold">1. PORTAMENTO BELCANTISTA (García / Vaccai)</text>

    <!-- Grafico Curva de Frecuencia y Presion -->
    <rect x="20" y="55" width="405" height="155" fill="#1e293b" stroke="#334155" rx="6" />
    <line x1="45" y1="180" x2="395" y2="180" stroke="#64748b" stroke-width="1.5" />
    <line x1="45" y1="180" x2="45" y2="70" stroke="#64748b" stroke-width="1.5" />
    <text x="390" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">Tiempo (t)</text>
    <text x="40" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Tono (f0)</text>

    <!-- Curva continua elegante -->
    <line x1="60" y1="150" x2="160" y2="150" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <path d="M 160,150 Q 215,135 250,90" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round" />
    <line x1="250" y1="90" x2="370" y2="90" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />

    <circle cx="160" cy="150" r="4" fill="#38bdf8" />
    <circle cx="250" cy="90" r="4" fill="#38bdf8" />
    <text x="110" y="140" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Nota Inicial</text>
    <text x="300" y="82" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Nota Destino</text>
    <text x="220" y="125" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Glissando veloz</text>

    <path d="M 60,170 C 150,170 200,165 370,170" stroke="#10b981" stroke-width="2" stroke-dasharray="3,3" fill="none" />
    <text x="222" y="176" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="9.5">Presión Subglótica Ininterrumpida (Legato Real)</text>

    <!-- Características Técnicas -->
    <g transform="translate(20, 230)">
      <rect width="405" height="185" fill="#1e293b" stroke="#334155" rx="6" />
      
      <text x="15" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Anticipación Vocal:</text>
      <text x="145" y="24" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Se liga sobre la vocal de partida</text>

      <text x="15" y="54" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Acción Muscular:</text>
      <text x="145" y="54" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Transición gradual CT / TA continua</text>

      <text x="15" y="84" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Apoyo Respiratorio:</text>
      <text x="145" y="84" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Appoggio constante sin micro-apneas</text>

      <text x="15" y="114" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Efecto Estético:</text>
      <text x="145" y="114" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Nobleza afectiva, alma de la melodía</text>

      <text x="15" y="144" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Velocidad:</text>
      <text x="145" y="144" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Ágil y transparente al oído</text>
    </g>
  </g>

  <!-- PANEL 2: DEGENERACION MODERNA -->
  <g transform="translate(505, 95)">
    <rect width="445" height="435" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" rx="10" />
    <rect width="445" height="38" fill="#7f1d1d" rx="8" />
    <text x="222" y="25" text-anchor="middle" fill="#f8fafc" font-family="Georgia, serif" font-size="14.5" font-weight="bold">2. DEGENERACIÓN MODERNA (Slur / Salto Rígido)</text>

    <!-- Grafico Curva de Frecuencia y Presion -->
    <rect x="20" y="55" width="405" height="155" fill="#1e293b" stroke="#334155" rx="6" />
    <line x1="45" y1="180" x2="395" y2="180" stroke="#64748b" stroke-width="1.5" />
    <line x1="45" y1="180" x2="45" y2="70" stroke="#64748b" stroke-width="1.5" />
    <text x="390" y="195" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" text-anchor="end">Tiempo (t)</text>
    <text x="40" y="66" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Tono (f0)</text>

    <!-- Salto seco con corte -->
    <line x1="60" y1="150" x2="180" y2="150" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="180" y1="150" x2="230" y2="150" stroke="#64748b" stroke-width="1" stroke-dasharray="2,2" />
    <path d="M 230,135 Q 250,110 270,90" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
    <line x1="270" y1="90" x2="370" y2="90" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />

    <circle cx="180" cy="150" r="4" fill="#ef4444" />
    <circle cx="270" cy="90" r="4" fill="#ef4444" />
    <text x="205" y="138" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Colapso / Golpe</text>

    <path d="M 60,170 L 175,170 L 195,178 L 235,165 L 370,170" stroke="#f87171" stroke-width="2" stroke-dasharray="3,3" fill="none" />
    <text x="222" y="176" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="9.5">Micro-apnea o Golpe Glótico en la llegada</text>

    <!-- Características Técnicas -->
    <g transform="translate(20, 230)">
      <rect width="405" height="185" fill="#1e293b" stroke="#334155" rx="6" />
      
      <text x="15" y="24" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Degeneración 1 (Slur):</text>
      <text x="145" y="24" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Arrastre gutural viscoso (scooping)</text>

      <text x="15" y="54" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Degeneración 2 (Corte):</text>
      <text x="145" y="54" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Salto seco desconectado, anti-vocal</text>

      <text x="15" y="84" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Falla Laríngea:</text>
      <text x="145" y="84" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Golpe glótico compensatorio en el agudo</text>

      <text x="15" y="114" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Prejuicio Moderno:</text>
      <text x="145" y="114" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Terror al arrastre confunde portamento y vicio</text>

      <text x="15" y="144" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">• Pérdida Estética:</text>
      <text x="145" y="144" fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="11">Canto instrumentalizado, frío y plano</text>
    </g>
  </g>

  <!-- PIE DE PAGINA -->
  <text x="490" y="555" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Ars Cantorum © 2026 • Análisis Musicológico e Histórico del Bel Canto</text>
</svg>