<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" width="100%" height="auto" style="background:#FAF8F5; border:1px solid #DCD6CD; display:block;">
  <defs>
    <pattern id="hatchPort" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#881337" stroke-width="0.9" stroke-opacity="0.18"/>
    </pattern>
  </defs>
  <rect x="10" y="10" width="860" height="440" fill="none" stroke="#1C1B19" stroke-width="0.8" stroke-opacity="0.25"/>

  <text x="36" y="42" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="700" fill="#1C1B19" letter-spacing="0.06em">FIG. 1 — CONTORNO TONAL Y FLUJO: PORTAMENTO BELCANTISTA vs. FRAGMENTACIÓN</text>
  <text x="36" y="61" font-family="'Newsreader', Georgia, serif" font-style="italic" font-size="12.5" fill="#57534E">Trayectoria de frecuencia fundamental (f0) y continuidad del appoggio durante un intervalo ascendente</text>
  <line x1="36" y1="73" x2="844" y2="73" stroke="#1C1B19" stroke-width="0.7" stroke-opacity="0.3"/>

  <!-- Grilla musical minimalista -->
  <g stroke="#1C1B19" stroke-opacity="0.14" stroke-width="0.8">
    <line x1="95" y1="130" x2="820" y2="130"/>
    <line x1="95" y1="165" x2="820" y2="165"/>
    <line x1="95" y1="200" x2="820" y2="200"/>
    <line x1="95" y1="235" x2="820" y2="235"/>
    <line x1="310" y1="100" x2="310" y2="305" stroke-dasharray="3,4"/>
    <line x1="560" y1="100" x2="560" y2="305" stroke-dasharray="3,4"/>
  </g>

  <line x1="95" y1="100" x2="95" y2="305" stroke="#1C1B19" stroke-width="1.2"/>
  <line x1="95" y1="305" x2="825" y2="305" stroke="#1C1B19" stroke-width="1.2"/>

  <text x="83" y="134" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#881337">Nota B</text>
  <text x="83" y="239" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#1C1B19">Nota A</text>
  <text x="38" y="202" text-anchor="middle" transform="rotate(-90 38 202)" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600" fill="#57534E" letter-spacing="0.06em">ALTURA TONAL (f0)</text>

  <text x="200" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Vocal inicial sostenida</text>
  <text x="435" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#881337">Tránsito (120–180 ms)</text>
  <text x="690" y="324" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#57534E">Articulación de destino</text>

  <!-- Zona de tránsito -->
  <rect x="310" y="105" width="250" height="195" fill="url(#hatchPort)"/>

  <!-- CURVA 1: PORTAMENTO BELCANTISTA (Curva S continua y ágil) -->
  <path d="M 110,235 L 320,235 C 395,235 455,130 550,130 L 800,130" fill="none" stroke="#881337" stroke-width="2.4"/>
  <circle cx="320" cy="235" r="3.8" fill="#881337"/>
  <circle cx="550" cy="130" r="3.8" fill="#881337"/>

  <!-- CURVA 2: DEGENERACIÓN MODERNA (Corte con micro-apnea + salto/scoop) -->
  <path d="M 110,239 L 330,239 M 445,248 Q 515,192 565,134 L 800,134" fill="none" stroke="#1C1B19" stroke-width="1.5" stroke-dasharray="5,4"/>
  <circle cx="445" cy="248" r="3.8" fill="#FAF8F5" stroke="#1C1B19" stroke-width="1.5"/>

  <!-- Flujo aéreo continuo en la base -->
  <line x1="110" y1="278" x2="800" y2="278" stroke="#881337" stroke-width="1.1" stroke-dasharray="2,2"/>
  <text x="455" y="293" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" font-weight="600" fill="#881337">Presión subglótica continua (Appoggio ininterrumpido)</text>

  <!-- Anotaciones directas -->
  <line x1="435" y1="182" x2="365" y2="128" stroke="#881337" stroke-width="0.9"/>
  <text x="360" y="114" text-anchor="end" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="700" fill="#881337">Portamento belcantista</text>
  <text x="360" y="128" text-anchor="end" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Viaja sobre la primera vocal · Consonante al llegar</text>

  <line x1="445" y1="248" x2="540" y2="215" stroke="#1C1B19" stroke-width="0.9"/>
  <text x="546" y="210" font-family="'Newsreader', Georgia, serif" font-size="11.5" font-weight="600" fill="#1C1B19">Corte o arrastre (Scooping)</text>
  <text x="546" y="224" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#57534E">Micro-apnea glótica y ascenso pesado por debajo del tono</text>

  <line x1="36" y1="365" x2="844" y2="365" stroke="#1C1B19" stroke-width="0.6" stroke-opacity="0.25"/>
  <text x="36" y="388" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    <tspan font-weight="600">Lectura acústica:</tspan> El portamento clásico (curva burdeos) modula el relevo TA→CT sin cortar la columna aérea; la rigidez
  </text>
  <text x="36" y="406" font-family="'Newsreader', Georgia, serif" font-size="12" fill="#1C1B19">
    neoclásica o el arrastre vicioso (trazo punteado) rompen esa continuidad mediante golpes glóticos o desafinación previa.
  </text>
  <text x="36" y="432" font-family="'Plus Jakarta Sans', sans-serif" font-size="9.5" fill="#78716C" letter-spacing="0.04em">ARS CANTORUM · ANÁLISIS DE TRANSICIÓN INTERVÁLICA (CORRI 1810 · GARCÍA II · LABLACHE)</text>
</svg>
